<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Loader Entry · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .sub-info { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 16px; }
    .sub-info b { color: var(--ink); }
    .warnline { display: inline-block; font-size: 12.5px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 5px 9px; margin-top: 4px; }
    .lrrow { display: flex; align-items: center; gap: 8px; }
    .lrrow .input { font-weight: 800; letter-spacing: 1px; font-size: 18px; color: var(--navy); }
    .lrtag { font-size: 11px; font-weight: 700; white-space: nowrap; }
    .lrbox { text-align: center; padding: 6px 0 12px; }
    .lrbox .k { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .6px; }
    .lrbox .v { font-size: 34px; font-weight: 800; color: var(--navy); letter-spacing: 1px; }
    .lrbox .s { color: var(--muted); font-size: 13px; }
    .done { opacity: .6; }
    .recent .item { padding: 10px 0; border-bottom: 1px solid #EEF1F5; }
    .recent .item:last-child { border-bottom: 0; }
    .recent .item b { font-size: 14px; }
    .recent .item small { display: block; color: var(--muted); }
    .mini { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 6px 10px; font-weight: 700; font-size: 12.5px; color: var(--navy); cursor: pointer; }
    h3.cardh { margin: 0 0 12px; font-size: 14px; color: var(--navy); display: flex; justify-content: space-between; align-items: center; }
    .req::after { content: ' *'; color: var(--bad); }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">

    <form id="f" class="card" autocomplete="off" novalidate>
      <h3 class="cardh">Loader Dispatch · लोडर डिस्पैच</h3>

      <div class="field">
        <label class="req" for="lr">LR Number · एलआर नंबर</label>
        <div class="lrrow">
          <input id="lr" class="input upper" placeholder="Loading…">
          <span class="lrtag pill" id="lrTag">Auto</span>
        </div>
        <div class="hint">Filled automatically (last LR + 1). Change it only if your LR book shows a different number.</div>
      </div>

      <div class="field">
        <label class="req" for="truck">1. Truck Number · गाड़ी नंबर</label>
        <input id="truck" class="input upper" placeholder="e.g. MH40CQ8307 or 8307">
        <div class="sub-info" id="truckInfo"></div>
      </div>

      <div class="field">
        <label class="req" for="driver">2. Driver Name · ड्राइवर</label>
        <input id="driver" class="input" placeholder="Type driver name...">
        <div class="sub-info" id="driverInfo"></div>
      </div>

      <div class="field">
        <label class="req" for="dest">3. Destination · डेस्टिनेशन</label>
        <input id="dest" class="input upper" placeholder="Type destination...">
        <div class="sub-info" id="destInfo"></div>
      </div>

      <div class="row2">
        <div class="field">
          <label class="req" for="km">4. Start KM</label>
          <input id="km" class="input" inputmode="numeric" placeholder="e.g. 167777">
          <div class="sub-info" id="kmInfo"></div>
        </div>
        <div class="field">
          <label class="req" for="diesel">5. Diesel (Ltr)</label>
          <input id="diesel" class="input" inputmode="decimal" placeholder="e.g. 150">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="rate">6. Rate (₹)</label>
          <input id="rate" class="input" inputmode="decimal" placeholder="e.g. 722">
        </div>
        <div class="field">
          <label for="adv">7. Trip Advance (₹)</label>
          <input id="adv" class="input" inputmode="numeric" placeholder="e.g. 5000">
        </div>
      </div>

      <div class="field">
        <label for="remark">8. Remark</label>
        <input id="remark" class="input" placeholder="Notes">
      </div>

      <div id="formErr" class="err hidden" style="margin-bottom:10px"></div>
      <button id="saveBtn" class="btn orange" type="submit">Save Entry · सेव करें</button>
    </form>

    <div id="doneCard" class="card hidden">
      <div class="lrbox">
        <div class="k">SAVED · LR NUMBER</div>
        <div class="v" id="lrNo"></div>
        <div class="s" id="lrSub"></div>
      </div>
      <button class="btn green" id="msg1" type="button">📲 1. Share Msg 1 (Pump Format)</button>
      <button class="btn green hidden" id="msg2" type="button">📲 2. Share Msg 2 (LR / Rate Format)</button>
      <button class="btn light" id="nextBtn" type="button">➕ Next Entry · अगली एंट्री</button>
    </div>

    <div class="card recent">
      <h3 class="cardh">Recent entries <button class="mini" id="reloadRecent" type="button">↻</button></h3>
      <div id="recent" class="muted">Loading…</div>
    </div>
  </div>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const DRAFT = 'jnp_loader_draft';
  let M = null, last = null, suggestedLR = '', clientReqId = JNP.uid();

  JNP.header($('hdr'), 'Loader Entry', 'लोडर एंट्री · डिस्पैच', { sync: () => { loadMasters(true); fetchLR(); } });
  const ctx = await JNP.requireModule('OPS-01');
  if (!ctx.can('E')) $('f').classList.add('hidden');

  // ---------- masters (now from the new DB_Master)
  async function loadMasters(force) {
    try { M = await JNP.masters(force); if (force) JNP.toast('Lists updated', 'ok'); }
    catch (e) { JNP.toast(e.message, 'bad', 5000); }
  }
  await loadMasters(false);

  // ---------- LR: suggestion = last LR + 1, editable
  async function fetchLR() {
    try {
      const out = await JNP.api('nextLR');
      if (!out.ok) throw new Error(out.error);
      const typed = $('lr').value.trim().toUpperCase();
      const wasAuto = !typed || typed === suggestedLR;
      suggestedLR = out.lr;
      if (wasAuto) $('lr').value = suggestedLR;
      lrTag();
    } catch (e) { $('lr').placeholder = 'Type LR number'; JNP.toast('Could not fetch next LR: ' + e.message, 'warn'); }
  }
  function lrTag() {
    const edited = $('lr').value.trim().toUpperCase() !== suggestedLR;
    $('lrTag').textContent = edited ? 'Changed' : 'Auto';
    $('lrTag').className = 'lrtag pill ' + (edited ? 'warn' : 'ok');
  }
  $('lr').addEventListener('input', () => { $('lr').value = $('lr').value.replace(/\s+/g, '').toUpperCase(); lrTag(); });

  // ---------- pickers
  const truckOf = no => M && M.trucks.find(t => t.no === JNP.normTruck(no));
  const driverOf = n => M && M.drivers.find(d => JNP.keyOf(d.name) === JNP.keyOf(n) || (d.alt || '').split(',').some(a => JNP.keyOf(a) === JNP.keyOf(n)));
  const destOf = n => M && M.destinations.find(d => JNP.keyOf(d.name) === JNP.keyOf(n) || (d.alt || '').split(',').some(a => JNP.keyOf(a) === JNP.keyOf(n)));

  JNP.picker($('truck'), () => (M ? M.trucks : []).map(t => ({
    label: t.no, value: t.no, sub: [t.capacity ? t.capacity + 'T' : '', t.driver].filter(Boolean).join(' · ')
  })), { allowNew: true, upper: true, onPick: onTruck });
  $('truck').addEventListener('blur', () => { $('truck').value = JNP.normTruck($('truck').value); onTruck(); });
  function onTruck() {
    const v = JNP.normTruck($('truck').value), t = truckOf(v), info = $('truckInfo');
    if (!v) { info.innerHTML = ''; return; }
    if (!t) { info.innerHTML = '<span class="warnline">New truck — will be added to the master</span>'; return; }
    info.innerHTML = [t.brand, t.capacity ? '<b>' + t.capacity + ' T</b>' : '', t.odo ? 'Last KM <b>' + Number(t.odo).toLocaleString('en-IN') + '</b>' : ''].filter(Boolean).join(' · ');
    if (t.driver && !$('driver').value) { $('driver').value = t.driver; onDriver(); }
    checkKm(); saveDraft();
  }

  JNP.picker($('driver'), () => (M ? M.drivers : []).filter(d => d.status !== 'Inactive').map(d => ({
    label: d.name, alt: d.alt, sub: d.truck || ''
  })), { allowNew: true, onPick: onDriver });
  $('driver').addEventListener('blur', () => { if ($('driver').value) { const d = driverOf($('driver').value); $('driver').value = d ? d.name : JNP.titleCase($('driver').value); } onDriver(); });
  function onDriver() {
    const v = $('driver').value.trim(), d = driverOf(v);
    $('driverInfo').innerHTML = !v ? '' : d ? (d.mobile ? '📞 ' + d.mobile : '') : '<span class="warnline">New driver “' + JNP.esc(JNP.titleCase(v)) + '” — will be added to the master</span>';
    saveDraft();
  }

  JNP.picker($('dest'), () => (M ? M.destinations : []).map(d => ({ label: d.name, alt: d.alt, sub: d.code })), { allowNew: true, upper: true, onPick: onDest });
  $('dest').addEventListener('blur', () => { if ($('dest').value) { const d = destOf($('dest').value); $('dest').value = d ? d.name : $('dest').value.replace(/\s+/g, ' ').trim().toUpperCase(); } onDest(); });
  function onDest() {
    const v = $('dest').value.trim();
    $('destInfo').innerHTML = v && !destOf(v) ? '<span class="warnline">New destination — will be added to the master</span>' : '';
    saveDraft();
  }

  $('km').addEventListener('input', () => { checkKm(); saveDraft(); });
  function checkKm() {
    const k = Number($('km').value), t = truckOf($('truck').value);
    let msg = '';
    if ($('km').value !== '' && k === 0) msg = '0 KM — mileage cannot be checked for this trip';
    else if (k && t && t.odo && k < Number(t.odo)) msg = 'Lower than last reading ' + Number(t.odo).toLocaleString('en-IN');
    else if (k && t && t.odo && k - Number(t.odo) > 3000) msg = (k - Number(t.odo)).toLocaleString('en-IN') + ' km since last entry — please check';
    $('kmInfo').innerHTML = msg ? '<span class="warnline">' + msg + '</span>' : '';
  }

  // ---------- draft (form survives a dropped network or closed tab)
  const fields = ['truck', 'driver', 'dest', 'km', 'diesel', 'rate', 'adv', 'remark'];
  function saveDraft() { const d = {}; fields.forEach(f => d[f] = $(f).value); JNP.store.set(DRAFT, d); }
  (function restoreDraft() {
    const d = JNP.store.get(DRAFT); if (!d) return;
    fields.forEach(f => { if (d[f]) $(f).value = d[f]; });
    onTruck(); onDriver(); onDest();
  })();
  $('f').addEventListener('input', saveDraft);
  await fetchLR();

  // ---------- save (same checks as the original Loader app)
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('formErr'); err.classList.add('hidden');
    const v = id => $(id).value.trim();
    const truck = JNP.normTruck(v('truck')), lr = v('lr').replace(/\s+/g, '').toUpperCase();
    const bad = msg => { err.textContent = msg; err.classList.remove('hidden'); err.scrollIntoView({ block: 'center' }); };
    if (!/^[A-Z]{1,3}\d{3,8}$/.test(lr)) return bad('Invalid LR Number! Must be like A21229.');
    if (!/^[A-Z]{2}\d{1,2}[A-Z]{0,3}\d{4}$/.test(truck)) return bad('Invalid Truck Number! e.g. MH40CQ8307 (no spaces).');
    if (!v('driver') || !v('dest')) return bad('Please ensure Driver Name and Destination are filled.');
    if (v('km') === '' || isNaN(Number(v('km')))) return bad('Start KM must be a valid number.');
    if (v('diesel') === '' || isNaN(Number(v('diesel')))) return bad('Diesel Liters must be a valid number.');
    if (v('rate') !== '' && isNaN(Number(v('rate')))) return bad('Rate must be a valid number.');
    if (v('adv') !== '' && isNaN(Number(v('adv')))) return bad('Trip Advance must be a valid number.');

    const edited = lr !== suggestedLR;
    const data = {
      LR_No: lr, _lrEdited: edited, Truck_No: truck,
      Driver_Name: JNP.titleCase(v('driver')),            // keeps the space: "kailash  patil" → "Kailash Patil"
      Destination: v('dest').replace(/\s+/g, ' ').toUpperCase(),
      Start_KM: v('km'), Diesel_Ltr: v('diesel'), Rate: v('rate'), Trip_Advance: v('adv'), Remark: v('remark')
    };
    const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving to Google Sheet…';
    try {
      const out = await JNP.api('save', { module: 'OPS-01', clientReqId: clientReqId, data: data });
      if (!out.ok) {
        if (out.code === 'DUPLICATE' && edited) throw new Error(out.error + ' — check your LR book');
        throw new Error(out.error);
      }
      last = out.record;
      if (out.nextLR) suggestedLR = out.nextLR;
      JNP.store.del(DRAFT);
      showDone(edited && last.LR_No !== lr);
      const newMaster = !truckOf(last.Truck_No) || !driverOf(last.Driver_Name) || !destOf(last.Destination);
      if (newMaster) JNP.masters(true).then(m => M = m).catch(() => { });
      loadRecent();
    } catch (ex) { bad(ex.message); }
    finally { btn.disabled = false; btn.textContent = 'Save Entry · सेव करें'; }
  });

  function showDone() {
    $('f').classList.add('hidden'); $('doneCard').classList.remove('hidden');
    $('lrNo').textContent = last.LR_No;
    $('lrSub').textContent = last.Truck_No + ' · ' + last.Driver_Name + ' · ' + last.Destination;
    $('msg1').classList.remove('done'); $('msg2').classList.add('hidden'); $('msg2').classList.remove('done');
    $('msg1').innerHTML = '📲 1. Share Msg 1 (Pump Format)';
    window.scrollTo(0, 0);
    JNP.toast('Saved — LR ' + last.LR_No, 'ok');
  }

  // Message formats exactly as the original Loader app
  $('msg1').onclick = () => {
    if (!last) return;
    JNP.whatsapp(last.Truck_No + '\nDIESEL ' + last.Diesel_Ltr + '\n' + last.Destination + '\nKM ' + last.Start_KM);
    $('msg1').classList.add('done'); $('msg1').innerHTML = '✓ Msg 1 Sent (Tap to re-send)';
    $('msg2').classList.remove('hidden');
  };
  $('msg2').onclick = () => {
    if (!last) return;
    JNP.whatsapp((last.Truck_No + ' ' + last.LR_No + ' ' + last.Destination + ' ' + (last.Rate || '')).trim());
    $('msg2').classList.add('done'); $('msg2').innerHTML = '✓ Msg 2 Sent (Tap to re-send)';
  };
  $('nextBtn').onclick = () => {
    $('f').reset(); ['truckInfo', 'driverInfo', 'destInfo', 'kmInfo', 'formErr'].forEach(i => $(i).innerHTML = '');
    $('lr').value = suggestedLR; lrTag(); fetchLR();
    clientReqId = JNP.uid(); last = null;
    $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden');
    window.scrollTo(0, 0);
  };

  // ---------- recent entries
  async function loadRecent() {
    try {
      const out = await JNP.api('list', { module: 'OPS-01', days: 3, limit: 15 });
      if (!out.ok) throw new Error(out.error);
      $('recent').innerHTML = out.rows.length ? out.rows.map(r =>
        '<div class="item"><b>' + JNP.esc(r.LR_No) + ' · ' + JNP.esc(r.Truck_No) + ' · ' + JNP.esc(r.Destination) + '</b><small>' +
        JNP.esc(r.Driver_Name) + ' · KM ' + JNP.esc(r.Start_KM) + ' · Diesel ' + JNP.esc(r.Diesel_Ltr) + ' L · ' + JNP.esc(String(r.Created_At).slice(5)) +
        (r.Created_By ? ' · ' + JNP.esc(r.Created_By) : '') + '</small></div>').join('') : '<span class="muted">No entries in the last 3 days.</span>';
    } catch (e) { $('recent').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  $('reloadRecent').onclick = loadRecent;
  loadRecent();
})();
</script>
</body>
</html>
