<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Depot · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="view"></div>
    <div id="doneCard" class="card hidden"></div>
    <div class="card list"><h3 class="cardh"><span id="listTitle">Recent</span><button class="mini" id="reload" type="button">↻</button></h3><div id="rows" class="muted">Loading…</div></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  JNP.header($('hdr'), 'Depot Store', 'डिपो स्टोर · इंडेंट · रसीद · इशू');
  const ctx = await JNP.requireModule(['RM-04', 'RM-07', 'RM-05']);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  const part = c => (JNP.M().parts || []).find(p => p.code === c);
  let F = null, CODE = '', clientReqId = JNP.uid(), indents = [], stock = {};

  const VIEWS = {
    indent: { code: 'RM-04', title: 'Material indent (purchase request) · इंडेंट', btn: 'Send for approval', fields: () => [
      { k: 'Part_Code', label: 'Part', hi: 'पार्ट', type: 'part', req: true, allowNew: false },
      { k: 'Qty', label: 'Quantity', type: 'dec', req: true, half: true },
      { k: 'Est_Rate', label: 'Rate ₹', type: 'dec', half: true },
      { k: 'Vendor', label: 'Vendor', type: 'vendor' },
      { k: 'For_Truck', label: 'For truck (optional)', type: 'truck', allowNew: false },
      { k: 'Needed_By', label: 'Needed by', type: 'date' },
      { k: 'Quote_Photo_URL', label: 'Quotation photo', type: 'photo' },
      { k: 'amt', type: 'html' },
      { k: 'Approver_Requested', label: 'Whose approval?', type: 'approver', module: 'RM-04', amountKey: '_amount', req: true },
      { k: '_amount', label: 'Amount', type: 'num', noSend: true, show: () => false },
      { k: 'Remark', label: 'Remark' }] },
    receipt: { code: 'RM-07', title: 'Material received · माल प्राप्त', btn: 'Save receipt', fields: () => [
      { k: 'Indent_ID', label: 'Against indent', type: 'select', req: true, options: () => indents.map(i => ({ v: i.Record_ID, t: i.Part_Name + ' · ' + i.Qty + ' ' + i.Unit + ' · ' + (i.Vendor || '') + ' (' + (i.Indent_Status || i.Status) + ')' }))
        .concat(ctx.isL1 || JNP.session().user.role === 'R&M_Head' ? [{ v: 'OPENING', t: '— Opening stock (first time only) —' }] : []) },
      { k: 'Part_Code', label: 'Part', type: 'part', allowNew: false, req: v => v.Indent_ID === 'OPENING', show: v => v.Indent_ID === 'OPENING' },
      { k: 'Qty_Received', label: 'Qty received', type: 'dec', req: true, half: true },
      { k: 'Rate', label: 'Rate ₹', type: 'dec', half: true },
      { k: 'Vendor', label: 'Vendor', type: 'vendor', show: v => v.Indent_ID === 'OPENING' },
      { k: 'Invoice_No', label: 'Invoice no.', show: v => v.Indent_ID !== 'OPENING' },
      { k: 'Invoice_Photo_URL', label: 'Invoice photo', type: 'photo', show: v => v.Indent_ID !== 'OPENING' },
      { k: 'Remark', label: 'Remark' }] },
    issue: { code: 'RM-05', title: 'Issue to truck · माल इशू', btn: 'Save issue', fields: () => [
      { k: 'Part_Code', label: 'Part', type: 'part', req: true, allowNew: false },
      { k: 'Qty', label: 'Quantity', type: 'dec', req: true, half: true },
      { k: 'Truck_No', label: 'Truck', type: 'truck', req: true, allowNew: false, half: true },
      { k: 'Issued_To', label: 'Given to (mechanic / driver)', req: true },
      { k: 'Odometer_KM', label: 'Odometer KM', type: 'num', half: true },
      { k: 'Old_Part_Returned', label: 'Old part returned?', type: 'seg', options: ['Yes', 'No', 'N.A.'], half: true },
      { k: 'Fault_Code', label: 'Fault', type: 'fault', allowNew: false },
      { k: 'Photo_URL', label: 'Photo', type: 'photo' },
      { k: 'Remark', label: 'Remark' }] },
  };
  const tabsList = [];
  if (JNP.rights('RM-04').length) tabsList.push({ id: 'indent', label: '📝 Indent' });
  if (JNP.rights('RM-07').length) tabsList.push({ id: 'receipt', label: '📥 Receipt' });
  if (JNP.rights('RM-05').length) tabsList.push({ id: 'issue', label: '📤 Issue' });
  tabsList.push({ id: 'stock', label: '📦 Stock' });
  let tab = '';

  async function loadStock() { try { (await JNP.call('stock')).rows.forEach(r => stock[r.code] = r); } catch (e) { } }

  async function open(t) {
    tab = t; $('doneCard').classList.add('hidden');
    if (t === 'stock') { $('view').innerHTML = ''; $('listTitle').textContent = 'Stock in depot'; return loadList(); }
    const V = VIEWS[t]; CODE = V.code; clientReqId = JNP.uid();
    if (!JNP.can(CODE, 'E')) { $('view').innerHTML = '<div class="card muted">View only.</div>'; $('listTitle').textContent = 'Recent'; return loadList(); }
    if (t === 'receipt') { try { indents = (await JNP.call('openIndents')).rows; } catch (e) { indents = []; } }
    if (t === 'issue') await loadStock();
    $('view').innerHTML = '<form id="f" class="card" autocomplete="off" novalidate><h3 class="cardh"><span>' + V.title + '</span></h3><div id="fields"></div><div id="err" class="err hidden"></div><button id="saveBtn" class="btn orange" type="submit">' + V.btn + '</button></form>';
    F = JNP.form($('fields'), V.fields(), { module: CODE });
    F.on(k => {
      if (t === 'indent' && (k === 'Part_Code' || k === 'Qty' || k === 'Est_Rate')) {
        const p = part(F.val('Part_Code')); if (k === 'Part_Code' && p && p.rate && !F.val('Est_Rate')) F.set('Est_Rate', p.rate);
        const amt = (Number(F.val('Qty')) || 0) * (Number(F.val('Est_Rate')) || 0);
        F.F.amt.set(amt ? '<div class="field"><span class="okline">Amount ' + JNP.inr(amt) + (p ? ' · ' + JNP.esc(p.unit) : '') + '</span></div>' : '');
        F.setFire('_amount', amt);
      }
      if (t === 'issue' && (k === 'Part_Code' || k === 'Qty')) { const s = stock[F.val('Part_Code')]; F.info('Part_Code', s ? 'In stock: <b>' + s.balance + ' ' + JNP.esc(s.unit) + '</b>' : F.val('Part_Code') ? '<span class="warnline">No stock recorded</span>' : ''); }
      if (t === 'issue' && k === 'Truck_No') { const tm = JNP.findTruck(F.val('Truck_No')); if (tm && tm.driver && !F.val('Issued_To')) F.set('Issued_To', tm.driver); }
      if (t === 'receipt' && k === 'Indent_ID') { const i = indents.find(x => x.Record_ID === F.val('Indent_ID')); F.info('Indent_ID', i ? 'Ordered <b>' + i.Qty + ' ' + JNP.esc(i.Unit) + '</b> @ ' + JNP.inr(i.Est_Rate) : ''); if (i && !F.val('Rate')) F.set('Rate', i.Est_Rate); }
    });
    $('f').addEventListener('submit', e => { e.preventDefault(); JNP.submit($('saveBtn'), $('err'), save); });
    $('listTitle').textContent = 'Recent'; loadList();
  }

  async function save() {
    const bad = F.check(); if (bad) throw new Error(bad);
    const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: F.values() });
    const r = out.record; let msg, big, sub, btns = [];
    if (CODE === 'RM-04') {
      msg = JNP.waText('📝 DEPOT INDENT · ' + JNP.inr(r.Amount), [['Part', r.Part_Name + ' (' + r.Part_Code + ')'], ['Qty', r.Qty + ' ' + r.Unit + ' @ ' + JNP.inr(r.Est_Rate)], ['Vendor', r.Vendor], ['For truck', r.For_Truck], ['Needed by', JNP.dmy(r.Needed_By)], ['Approval by', r.Approver_Requested], ['Ref', r.Record_ID]]);
      big = JNP.inr(r.Amount); sub = r.Qty + ' ' + r.Unit + ' ' + r.Part_Name + ' · waiting for ' + r.Approver_Requested; btns = JNP.approvalButtons(out, msg);
    } else if (CODE === 'RM-07') {
      msg = JNP.waText('📥 MATERIAL RECEIVED', [['Part', r.Part_Name], ['Qty', r.Qty_Received + ' ' + r.Unit], ['Rate', JNP.inr(r.Rate)], ['Amount', JNP.inr(r.Amount)], ['Vendor', r.Vendor], ['Invoice', r.Invoice_No], ['Indent', r.Indent_ID]]);
      big = r.Qty_Received + ' ' + r.Unit; sub = r.Part_Name + ' · ' + JNP.inr(r.Amount);
    } else {
      msg = JNP.waText('📤 PART ISSUED · ' + r.Truck_No, [['Part', r.Part_Name], ['Qty', r.Qty + ' ' + r.Unit], ['Given to', r.Issued_To], ['KM', r.Odometer_KM], ['Old part returned', r.Old_Part_Returned], ['Stock left', out.stockAfter + ' ' + r.Unit]]);
      big = r.Truck_No; sub = r.Qty + ' ' + r.Unit + ' ' + r.Part_Name + ' · stock left ' + out.stockAfter;
    }
    $('view').innerHTML = '';
    JNP.done($('doneCard'), { title: 'SAVED', big, sub, buttons: btns.concat([{ label: '📲 Share on WhatsApp', cls: btns.length ? 'light' : 'green', onClick: () => JNP.whatsapp(msg) }]), onNew: () => open(tab) });
    loadList();
  }

  async function loadList() {
    $('rows').innerHTML = 'Loading…';
    try {
      if (tab === 'stock') {
        const rows = (await JNP.call('stock')).rows.filter(r => r.received || r.issued || r.low);
        $('rows').innerHTML = JNP.rowsHtml(rows, r => ({ t: JNP.esc(r.code + ' · ' + r.name), s: 'In ' + r.received + ' · Out ' + r.issued + (r.min ? ' · Min ' + r.min : ''), tag: r.balance + ' ' + r.unit, cls: r.low ? 'bad' : r.balance > 0 ? 'ok' : '' }), 'No stock recorded yet.');
        return;
      }
      const out = await JNP.call('list', { module: CODE, days: 45, limit: 60 });
      $('rows').innerHTML = JNP.rowsHtml(out.rows, r => CODE === 'RM-04'
        ? { t: JNP.esc(r.Part_Name + ' · ' + r.Qty + ' ' + r.Unit), s: JNP.esc([JNP.inr(r.Amount), r.Vendor, r.Indent_Status, JNP.dmy(r.Created_At)].filter(Boolean).join(' · ')), tag: r.Status, cls: JNP.statusCls(r.Status) }
        : CODE === 'RM-07' ? { t: JNP.esc(r.Part_Name + ' · ' + r.Qty_Received + ' ' + r.Unit), s: JNP.esc([JNP.inr(r.Amount), r.Vendor, r.Indent_ID, JNP.dmy(r.Created_At)].filter(Boolean).join(' · ')) }
        : { t: JNP.esc(r.Truck_No + ' · ' + r.Part_Name + ' · ' + r.Qty + ' ' + r.Unit), s: JNP.esc([r.Issued_To, JNP.dmy(r.Created_At), r.Created_By].filter(Boolean).join(' · ')) }, 'Nothing in 45 days.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  $('reload').onclick = loadList;
  JNP.tabs($('tabs'), tabsList, open, JNP.param('tab'));
})();
</script>
</body>
</html>
