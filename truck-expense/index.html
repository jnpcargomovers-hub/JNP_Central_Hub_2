<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Truck Expense · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Truck expense · गाड़ी खर्च</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Send for approval · अप्रूवल के लिए भेजें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="card list hidden"><div id="rows" class="muted">Loading…</div></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const CODE = 'RM-03';
  JNP.header($('hdr'), 'Truck Expense', 'खर्च अनुमोदन (गाड़ी)');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  const LIM = Number(JNP.M().settings.Second_Quote_Above) || 5000;
  let clientReqId = JNP.uid(), openBd = [];
  const over = v => Number(v.Amount) > LIM;
  const F = JNP.form($('fields'), [
    { k: 'Truck_No', label: 'Truck', hi: 'गाड़ी', type: 'truck', req: true, allowNew: false },
    { k: 'Breakdown_ID', label: 'Linked breakdown', type: 'select', options: () => openBd.map(b => ({ v: b.Record_ID, t: b.Symptom + ' · ' + b.Location + ' (' + b.Breakdown_Status + ')' })), hint: 'Open breakdowns of this truck', show: () => openBd.length > 0 },
    { k: 'Expense_Head', label: 'Expense head', hi: 'खर्च का प्रकार', type: 'select', list: 'Truck_Expense_Head', req: true },
    { k: 'Fault_Code', label: 'Fault', hi: 'खराबी', type: 'fault', allowNew: false },
    { k: 'Amount', label: 'Amount (₹)', hi: 'रकम', type: 'num', req: true, half: true },
    { k: 'Urgency', label: 'Urgency', type: 'select', list: 'Urgency', value: 'Normal', half: true },
    { k: 'Vendor', label: 'Vendor / garage (quote 1)', type: 'vendor', req: true },
    { k: 'Quote1_Photo_URL', label: 'Quotation 1 photo', type: 'photo', req: over },
    { k: 'Second_Quote', label: '2nd quote amount (₹)', type: 'num', req: over, show: over, half: true },
    { k: 'Second_Vendor', label: '2nd vendor', type: 'vendor', req: over, show: over, half: true },
    { k: 'Quote2_Photo_URL', label: 'Quotation 2 photo', type: 'photo', show: over },
    { k: 'Driver_Name', label: 'Driver', type: 'driver' },
    { k: 'Location', label: 'Location', hi: 'जगह' },
    { k: 'Description', label: 'Work needed', hi: 'काम', type: 'textarea', req: true },
    { k: 'Bill_Photo_URL', label: 'Bill photo (if already billed)', type: 'photo' },
    { k: 'Approver_Requested', label: 'Whose approval?', hi: 'किसका अप्रूवल', type: 'approver', amountKey: 'Amount', req: true },
    { k: 'Remark', label: 'Remark' },
  ], { module: CODE });
  let lastT = '';
  F.on(async k => {
    if (k === 'Amount') F.info('Amount', over(F.all()) ? '<span class="warnline">Above ' + JNP.inr(LIM) + ' — second quotation is compulsory</span>' : '');
    if (k === 'Truck_No' && F.val('Truck_No') && F.val('Truck_No') !== lastT) {
      lastT = F.val('Truck_No'); const t = JNP.findTruck(lastT);
      if (t && t.driver && !F.val('Driver_Name')) F.set('Driver_Name', t.driver);
      try { openBd = (await JNP.call('openBreakdowns', { truck: lastT })).rows; } catch (e) { openBd = []; }
      F.fill('Breakdown_ID'); if (openBd.length === 1) F.set('Breakdown_ID', openBd[0].Record_ID); F.refresh();
    }
  });
  const q = JNP.param('truck'); if (q) F.setFire('Truck_No', q);
  const bq = JNP.param('bd');

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: F.values() });
      const r = out.record;
      const msg = JNP.waText('TRUCK EXPENSE · ' + r.Truck_No + ' · ' + JNP.inr(r.Amount), [['Head', r.Expense_Head], ['Fault', r.Fault_Code], ['Work', r.Description],
        ['Quote 1', r.Vendor + ' ' + JNP.inr(r.Amount)], ['Quote 2', r.Second_Quote ? r.Second_Vendor + ' ' + JNP.inr(r.Second_Quote) : ''], ['Driver', r.Driver_Name],
        ['Location', r.Location], ['Breakdown', r.Breakdown_ID], ['Urgency', r.Urgency], ['Approval by', r.Approver_Requested], ['Quote photo', r.Quote1_Photo_URL], ['Ref', r.Record_ID]]);
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'SENT FOR APPROVAL', big: JNP.inr(r.Amount), sub: r.Truck_No + ' · ' + r.Expense_Head + ' · waiting for ' + r.Approver_Requested,
        buttons: JNP.approvalButtons(out, msg).concat([{ label: '📲 Share to group', cls: 'light', onClick: () => JNP.whatsapp(msg) }]),
        onNew: () => { F.reset(); openBd = []; lastT = ''; clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });

  async function loadList() {
    $('rows').innerHTML = 'Loading…';
    try {
      const out = await JNP.call('list', { module: CODE, days: 45, limit: 80 });
      $('rows').innerHTML = JNP.rowsHtml(out.rows, r => ({ t: JNP.inr(r.Amount) + ' · ' + JNP.esc(r.Truck_No + ' · ' + r.Expense_Head), s: JNP.esc([r.Vendor, r.Description, JNP.dmy(r.Created_At), r.Approved_By ? '✓ ' + r.Approved_By : 'to ' + r.Approver_Requested, r.Paid_At ? 'paid ' + r.Payment_Mode : ''].filter(Boolean).join(' · ')), tag: r.Status, cls: JNP.statusCls(r.Status) }), 'No truck expenses in 45 days.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  JNP.tabs($('tabs'), (ctx.can('E') ? [{ id: 'new', label: '➕ New request' }] : []).concat([{ id: 'list', label: '📋 Requests' }]), t => {
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t !== 'list'); if (t === 'list') loadList();
  });
  if (bq) setTimeout(() => F.set('Breakdown_ID', bq), 1500);
})();
</script>
</body>
</html>
