<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Vehicle Inspection · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .prog { position: sticky; top: 66px; z-index: 15; background: #fff; border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; margin: 14px 0 0; }
    .prog .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--navy); }
    .prog .bar { height: 8px; border-radius: 6px; background: #E8EDF5; overflow: hidden; display: flex; margin-top: 7px; }
    .prog .bar i { display: block; height: 100%; }
    .prog .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .sec2 { padding: 0; overflow: hidden; }
    .sec2 > .sh { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
    .sec2 > .sh .ic { font-size: 20px; width: 28px; text-align: center; }
    .sec2 > .sh .tt { flex: 1; min-width: 0; }
    .sec2 > .sh .tt b { display: block; font-size: 15px; color: var(--navy); }
    .sec2 > .sh .tt small { color: var(--muted); font-size: 12.5px; font-weight: 600; }
    .sec2 > .sh .chev { color: var(--muted); font-size: 18px; transition: transform .15s; }
    .sec2.open > .sh .chev { transform: rotate(90deg); }
    .sec2 > .sb { display: none; padding: 0 16px 12px; }
    .sec2.open > .sb { display: block; }
    .sec2.done > .sh { background: var(--ok-bg); }
    .sec2.bad > .sh { background: var(--bad-bg); }
    .ir { border-top: 1px solid #EEF1F5; padding: 10px 0; }
    .ir .top { display: flex; align-items: center; gap: 10px; }
    .ir .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; line-height: 1.3; }
    .ir .nm small { display: block; color: #3E4A5A; font-weight: 600; font-size: 13.5px; margin-top: 1px; }
    .ir .nm .crit { color: var(--red); font-size: 11px; font-weight: 800; margin-left: 4px; }
    .tri { display: flex; gap: 5px; flex: 0 0 auto; }
    .tri button { width: 44px; height: 40px; border-radius: 10px; border: 1.5px solid #CCD5E2; background: #fff; font-size: 16px; font-weight: 800; color: var(--char); cursor: pointer; padding: 0; }
    .tri button.na { font-size: 11.5px; }
    .tri button.on.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    .tri button.on.is { background: var(--red); border-color: var(--red); color: #fff; }
    .tri button.on.na { background: #8B96A5; border-color: #8B96A5; color: #fff; }
    .ir.issue { background: var(--bad-bg); margin: 0 -16px; padding: 10px 16px; border-top-color: transparent; }
    .ir .was { margin-top: 6px; }
    .ir .more { margin-top: 10px; display: grid; gap: 8px; }
    .qchips { display: flex; flex-wrap: wrap; gap: 6px; }
    .qchips button { border: 1.5px solid #E7B4BC; background: #fff; color: var(--red); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .qchips button.on { background: var(--red); color: #fff; border-color: var(--red); }
    .sev button { padding: 7px 8px !important; font-size: 13px !important; }
    .sev button.on.Minor { background: #D48A00; border-color: #D48A00; }
    .sev button.on.Major { background: var(--orange); border-color: var(--orange); }
    .sev button.on.Critical { background: var(--red); border-color: var(--red); }
    .ir .more .input { font-size: 15px; padding: 9px 11px; }
    .phrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .phrow img { width: 58px; height: 58px; object-fit: cover; border-radius: 9px; border: 1px solid var(--line); }
    .phrow .photo-add { padding: 8px 12px; font-size: 13.5px; }
    .phrow .photo-add.need { border-color: var(--red); color: var(--red); background: #fff; }
    .res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .res button { border: 1.5px solid #CCD5E2; background: #fff; border-radius: 12px; padding: 10px 6px; font-weight: 800; font-size: 13px; cursor: pointer; color: var(--char); line-height: 1.25; }
    .res button[disabled] { opacity: .35; cursor: not-allowed; }
    .res button.on.r0 { background: var(--ok); border-color: var(--ok); color: #fff; }
    .res button.on.r1 { background: var(--orange); border-color: var(--orange); color: #fff; }
    .res button.on.r2 { background: var(--red); border-color: var(--red); color: #fff; }
    .tbox { border-radius: 12px; background: var(--bg); padding: 10px 12px; font-size: 13.5px; margin-top: 4px; }
    .tbox b { color: var(--navy); }
    .chkline { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; font-size: 14px; margin-top: 12px; cursor: pointer; }
    .chkline input { width: 22px; height: 22px; margin: 0; flex: 0 0 auto; accent-color: var(--red); }
    .draft { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .trk { margin-top: 12px; }
    .trk > .th { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .oi { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: #fff; }
    .oi .itop { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .oi .itop b { font-size: 14px; }
    .oi small { display: block; color: var(--muted); margin-top: 3px; }
    .oi .fixbox { margin-top: 10px; display: grid; gap: 8px; }
    .oi img.th { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); margin-top: 6px; }
    .sevp { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; color: #fff; }
    .sevp.Minor { background: #D48A00; } .sevp.Major { background: var(--orange); } .sevp.Critical { background: var(--red); }
    .stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .stats4 div { background: var(--bg); border-radius: 11px; padding: 8px; text-align: center; }
    .stats4 b { display: block; font-size: 19px; color: var(--navy); line-height: 1.1; }
    .stats4 span { font-size: 11.5px; color: var(--muted); font-weight: 700; }
    .filt { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .filt button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--char); cursor: pointer; }
    .filt button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    details.due summary { cursor: pointer; font-weight: 800; color: var(--navy); }
    .dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13.5px; margin-top: 8px; }
    .dl span:nth-child(even) { color: var(--muted); text-align: right; }
    .ditem { border-top: 1px solid #EEF1F5; padding: 9px 0; }
    .ditem .itop { display: flex; justify-content: space-between; gap: 8px; }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>

    <!-- NEW INSPECTION -->
    <div id="vNew">
      <div class="card hidden" id="draftCard"><div class="draft"><span id="draftTxt"></span><button class="mini" type="button" id="draftDel">Discard · हटाएँ</button></div></div>
      <form id="f" autocomplete="off" novalidate>
        <div class="card">
          <h3 class="cardh"><span>Vehicle Inspection · गाड़ी जांच</span></h3>
          <div id="top"></div>
          <div id="truckInfo"></div>
        </div>
        <div class="prog hidden" id="prog"></div>
        <div id="secs"></div>
        <div class="card hidden" id="endCard">
          <h3 class="cardh"><span>Photos & result · फोटो और नतीजा</span></h3>
          <div id="photos"></div>
          <div class="field"><label>Result · नतीजा</label><div class="res" id="res"></div><div class="sub-info" id="resInfo"></div></div>
          <label class="chkline hidden" id="offWrap"><input type="checkbox" id="offRoad"><span>Mark truck <b>off road</b> now · गाड़ी को <b>ऑफ-रोड</b> करें (R&amp;M को रिकॉर्ड जाएगा)<br><small class="hint" id="offHint"></small></span></label>
          <div id="err" class="err hidden" style="margin-top:12px"></div>
          <button id="saveBtn" class="btn orange" type="submit" style="margin-top:12px">Save inspection · जांच सेव करें</button>
        </div>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>

    <!-- OPEN ISSUES -->
    <div id="vOpen" class="hidden">
      <div class="card list">
        <h3 class="cardh"><span>Open issues · बाकी काम</span><button class="mini" id="reloadOpen" type="button">↻</button></h3>
        <div class="stats4" id="openStats"></div>
        <div class="filt" id="openFilt"></div>
        <div id="openList" class="muted">Loading…</div>
      </div>
    </div>

    <!-- HISTORY -->
    <div id="vHist" class="hidden">
      <div class="card" id="dueCard"></div>
      <div class="card list">
        <h3 class="cardh"><span>Inspections · पुरानी जांच</span><button class="mini" id="reloadHist" type="button">↻</button></h3>
        <div class="filt" id="histFilt"></div>
        <div id="histList" class="muted">Loading…</div>
      </div>
      <div class="card hidden" id="detail"></div>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  JNP.header($('hdr'), 'Vehicle Inspection', 'गाड़ी जांच · R&M');
  const ctx = await JNP.requireModule('RM-08');
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  const canE = ctx.can('E');
  const ICON = { 'Oil & Fluids': '🛢️', 'Engine': '⚙️', 'Mechanical': '🔩', 'Brakes': '🛑', 'Electrical': '⚡', 'Tyres & Wheels': '🛞', 'Body & Cabin': '🚛', 'Load Body': '📦', 'Safety & Documents': '🧯' };
  const SEC_HI = { 'Oil & Fluids': 'ऑइल और पानी', 'Engine': 'इंजन', 'Mechanical': 'मैकेनिकल', 'Brakes': 'ब्रेक', 'Electrical': 'इलेक्ट्रिकल', 'Tyres & Wheels': 'टायर और व्हील', 'Body & Cabin': 'बॉडी और केबिन', 'Load Body': 'लोड बॉडी', 'Safety & Documents': 'सेफ्टी और कागज़ात' };
  const QH = {"Air gauge off": "एयर मीटर बंद", "Bead damage": "बीड खराब", "Belt missing": "बेल्ट नहीं", "Bent": "टेढ़ा", "Black / dirty": "काला / गंदा", "Black smoke": "काला धुआं", "Blade worn": "ब्लेड घिसा", "Blocked fins": "जाली बंद", "Blue smoke": "नीला धुआं", "Bolt loose": "बोल्ट ढीला", "Boot torn": "बूट फटा", "Broken": "टूटा", "Broken bumper": "बंपर टूटा", "Broken leaf": "पत्ती टूटी", "Broken step": "पायदान टूटा", "Bulge": "फूला हुआ", "Burnt": "जला", "Centre bolt broken": "सेंटर बोल्ट टूटा", "Check engine on": "इंजन लाइट जली", "Clamp missing": "क्लैंप नहीं", "Crack": "दरार", "Cracked": "दरार", "Cracked hose": "पाइप में दरार", "Cut": "कटा", "Damaged": "खराब", "Dent": "पिचका", "Dim": "धीमी रोशनी", "Dirty": "गंदा", "Drain valve stuck": "ड्रेन वाल्व जाम", "Drum cracked": "ड्रम में दरार", "Dry": "सूखा", "Empty": "खाली", "Excess play": "ज़्यादा ढीला", "Expired": "तारीख खत्म", "Faded": "फीका", "Flat": "पंचर / बैठा", "Fuel gauge off": "डीजल मीटर बंद", "Gasket worn": "गैसकेट घिसा", "Glass broken": "कांच टूटा", "Grease leak": "ग्रीस लीक", "Handle broken": "हैंडल टूटा", "Hard": "सख्त / भारी", "Hard start": "मुश्किल से चालू", "Hole": "छेद", "Hook missing": "हुक नहीं", "Hose loose": "पाइप ढीला", "Indicator red": "इंडिकेटर लाल", "Joint taped": "टेप से जोड़ा", "Knocking": "ठक-ठक आवाज़", "Leak": "लीक", "Leak hissing": "हवा निकल रही", "Leaking": "लीक", "Light on": "लाइट जली", "Lock broken": "लॉक टूटा", "Lock not engaging": "लॉक नहीं लगता", "Loose": "ढीला", "Loose clamp": "क्लैंप ढीला", "Low": "कम", "Low balance": "बैलेंस कम", "Low pressure": "प्रेशर कम", "Milky (water mix)": "दूधिया (पानी मिला)", "Missing": "नहीं है", "Noise": "आवाज़", "Not charging": "चार्ज नहीं", "Not done": "नहीं किया", "Not holding": "पकड़ नहीं", "Not reaching": "पूरा नहीं बनता", "Not readable": "पढ़ा नहीं जाता", "Not working": "काम नहीं करता", "Oil leak": "ऑइल लीक", "Oil on liner": "लाइनर पर ऑइल", "Oil pressure light": "ऑइल प्रेशर लाइट", "One side off": "एक तरफ बंद", "Over-stroke": "ज़्यादा स्ट्रोक", "Overfilled": "ज़्यादा भरा", "Pipe cut": "पाइप कटा", "Pipe leak": "पाइप लीक", "Pipe torn": "पाइप फटा", "Play": "ढीलापन", "Pulls to one side": "एक तरफ खींचता", "Pump leak": "पंप लीक", "Rough idle": "आइडल ठीक नहीं", "Rusted": "जंग लगा", "Scratch": "खरोंच", "Seal broken": "सील टूटी", "Shackle worn": "शैकल घिसा", "Slipping": "फिसलता", "Slipping out": "गियर निकलता", "Slow build-up": "धीरे बनता", "Slow crank": "धीरे घूमता", "Speedometer off": "स्पीडोमीटर बंद", "Stops": "बंद हो जाता", "Stuck": "जाम", "Stud broken": "स्टड टूटा", "Tank leak": "टंकी लीक", "Tappet noise": "टैपेट आवाज़", "Temp high": "गरम हो रहा", "Terminal corroded": "टर्मिनल पर जंग", "Thin": "पतला", "Torn": "फटा", "Uneven wear": "एक तरफ घिसा", "Vibration": "कंपन", "Warning light": "वार्निंग लाइट", "Water in tank": "टैंक में पानी", "Water low": "पानी कम", "Weak": "कमज़ोर", "Whistle noise": "सीटी की आवाज़", "White smoke": "सफेद धुआं", "Wire cut": "तार कटा", "Worn": "घिसा", "Worn out": "पूरा घिसा"};
  const TYPE_HI = { 'Routine': 'रोज़ की', 'Pre-trip': 'ट्रिप से पहले', 'After repair': 'रिपेयर के बाद', 'Monthly': 'महीने की', 'Handover': 'हैंडओवर' };
  const SEV_HI = { Minor: 'छोटा', Major: 'बड़ा', Critical: 'गंभीर' };
  const RESULTS = ['Fit to run', 'Run with caution', 'Not fit - off road'], RES_HI = ['चलने लायक', 'सावधानी से', 'नहीं चलेगी'];
  const SEV = ['Minor', 'Major', 'Critical'];
  const hiIssue = s => String(s || '').split(', ').filter(Boolean).map(x => QH[x] ? x + ' (' + QH[x] + ')' : x).join(', ');
  const DKEY = 'jnp2_insp_draft', CKEY = 'jnp2_insp_cl';
  const daysAgo = s => { const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? NaN : (Date.now() - d) / 864e5; };
  const ago = s => { const d = daysAgo(s); return isNaN(d) ? '' : d < 1 ? 'today' : Math.floor(d) + ' d ago'; };
  const thumb = u => JNP.driveThumb(u);

  // ---------------- checklist (cached on the phone, refreshed every visit)
  let CL = (JNP.store.get(CKEY) || {}).items || [], CFG = (JNP.store.get(CKEY) || {}).cfg || { photoOnIssue: false, dueDays: 30, types: ['Routine', 'Pre-trip', 'After repair', 'Monthly', 'Handover'] };
  async function loadChecklist() {
    try { const o = await JNP.call('inspChecklist'); CL = o.items; CFG = { photoOnIssue: o.photoOnIssue, dueDays: o.dueDays, types: o.types }; JNP.store.set(CKEY, { items: CL, cfg: CFG, at: Date.now() }); }
    catch (e) { if (!CL.length) throw e; JNP.toast('Offline — using saved checklist', 'warn'); }
  }

  // ---------------- tabs
  let openLoaded = false, histLoaded = false;
  const startTab = JNP.param('tab') || (canE ? 'new' : 'open');
  JNP.tabs($('tabs'), (canE ? [{ id: 'new', label: '＋ New · नई जांच' }] : []).concat([{ id: 'open', label: 'Open issues · बाकी काम' }, { id: 'hist', label: 'History · पुरानी जांच' }]), id => {
    $('vNew').classList.toggle('hidden', id !== 'new'); $('vOpen').classList.toggle('hidden', id !== 'open'); $('vHist').classList.toggle('hidden', id !== 'hist');
    if (id === 'open' && !openLoaded) loadOpen();
    if (id === 'hist' && !histLoaded) loadHist();
  }, startTab);

  try { await loadChecklist(); } catch (e) { $('secs').innerHTML = '<div class="card err">' + E(e.message) + '</div>'; }

  // =====================================================================
  // NEW INSPECTION
  // =====================================================================
  let S = {}, truckOpen = {}, cargo = '', clientReqId = JNP.uid(), resultPick = -1, openSec = {}, offTouched = false;
  const T = JNP.form($('top'), [
    { k: 'Truck_No', label: 'Truck Number', hi: 'गाड़ी नंबर', type: 'truck', req: true, ph: 'e.g. MH40CQ8307' },
    { k: 'Inspection_Type', label: 'Type', hi: 'प्रकार', type: 'seg', options: CFG.types.map(t => ({ v: t, t: t + (TYPE_HI[t] ? ' · ' + TYPE_HI[t] : '') })), req: true, value: 'Routine' },
    { k: 'Driver_Name', label: 'Driver', hi: 'ड्राइवर', type: 'driver', half: true },
    { k: 'Odometer_KM', label: 'Odometer KM', hi: 'मीटर रीडिंग', type: 'num', half: true },
    { k: 'Location', label: 'Location', hi: 'जगह', ph: 'e.g. Dhule yard / धुले यार्ड' },
  ], { module: 'RM-08' });
  const P = JNP.form($('photos'), [
    { k: 'Truck_Photo_URLs', label: 'Truck photos (front, back, both sides)', hi: 'गाड़ी के फोटो – आगे, पीछे, दोनों साइड', type: 'photo', multiple: true },
    { k: 'Odometer_Photo_URL', label: 'Odometer photo', hi: 'मीटर का फोटो', type: 'photo' },
    { k: 'Remark', label: 'Remark', hi: 'टिप्पणी', type: 'textarea', ph: 'Anything else / और कुछ बताना हो तो' },
  ], { module: 'RM-08' });

  const applies = c => c.applies === 'ALL' || !cargo || c.applies === cargo;
  const items = () => CL.filter(applies);
  const sections = () => { const o = []; items().forEach(c => { let s = o.find(x => x.name === c.section); if (!s) o.push(s = { name: c.section, items: [] }); s.items.push(c); }); return o; };
  const st = c => S[c.code] = S[c.code] || { status: '', issue: '', severity: '', note: '', photo: '', preview: '' };

  function itemHtml(c) {
    const x = st(c), op = truckOpen[c.code];
    const q = (c.quick || '').split(',').map(s => s.trim()).filter(Boolean), chosen = x.issue.split(', ').filter(Boolean);
    return '<div class="ir' + (x.status === 'Issue' ? ' issue' : '') + '" data-c="' + E(c.code) + '"><div class="top"><div class="nm">' + E(c.item) + (c.critical ? '<span class="crit">● SAFETY · सुरक्षा</span>' : '') + '<small>' + E(c.hindi) + '</small></div>' +
      '<div class="tri"><button type="button" class="ok' + (x.status === 'OK' ? ' on' : '') + '" data-v="OK" aria-label="OK">✓</button><button type="button" class="is' + (x.status === 'Issue' ? ' on' : '') + '" data-v="Issue" aria-label="Issue">✗</button><button type="button" class="na' + (x.status === 'N.A.' ? ' on' : '') + '" data-v="N.A.">N.A.</button></div></div>' +
      (op ? '<div class="was"><span class="warnline">' + 'पहले से खराब · Open since ' + E(ago(op.Inspected_At)) + ': ' + E([op.Issue, op.Note].filter(Boolean).join(' – ') || 'issue') + '</span></div>' : '') +
      (x.status === 'Issue' ? '<div class="more">' +
        (q.length ? '<div class="qchips">' + q.map(s => '<button type="button" data-q="' + E(s) + '" class="' + (chosen.indexOf(s) >= 0 ? 'on' : '') + '">' + E(s) + (QH[s] ? ' · ' + QH[s] : '') + '</button>').join('') + '</div>' : '') +
        '<input class="input" data-n="1" placeholder="What is wrong? / क्या खराबी है?" value="' + E(x.note) + '">' +

    histLoaded = true; $('histList').innerHTML = 'Loading…';
    try { const o = await JNP.call('inspList', { days: 90 }); HIST = o.rows; LAST = o.last; drawHist(); drawDue(); }
    catch (e) { $('histList').innerHTML = '<span class="err">' + E(e.message) + '</span>'; histLoaded = false; }
  }
  function drawDue() {
    const fleet = JNP.M().trucks.filter(t => !/sold|inactive/i.test(t.opStatus || ''));
    const never = fleet.filter(t => !LAST[t.no]), over = fleet.filter(t => LAST[t.no] && daysAgo(LAST[t.no].at) > CFG.dueDays).sort((a, b) => daysAgo(LAST[b.no].at) - daysAgo(LAST[a.no].at));
    const okN = fleet.length - never.length - over.length;
    $('dueCard').innerHTML = '<h3 class="cardh"><span>Due for inspection · जांच बाकी</span></h3>' +
      '<div class="stats4"><div><b style="color:var(--ok)">' + okN + '</b><span>Up to date<br>जांच हो गई</span></div><div><b style="color:var(--orange)">' + over.length + '</b><span>Over ' + CFG.dueDays + ' d<br>' + CFG.dueDays + ' दिन से ज़्यादा</span></div><div><b style="color:var(--red)">' + never.length + '</b><span>Never<br>कभी नहीं</span></div><div><b>' + fleet.length + '</b><span>Fleet<br>कुल गाड़ियाँ</span></div></div>' +
      (over.length + never.length ? '<details class="due"><summary>Show ' + (over.length + never.length) + ' trucks · गाड़ियाँ देखें</summary><div class="dl">' +
        over.map(t => '<span>' + E(t.no) + '</span><span>' + Math.floor(daysAgo(LAST[t.no].at)) + ' दिन पहले</span>').join('') +
        never.map(t => '<span>' + E(t.no) + '</span><span>कभी नहीं</span>').join('') + '</div></details>' : '<div class="okline">All trucks inspected · सब गाड़ियों की जांच हो गई (' + CFG.dueDays + ' दिन)</div>');
  }
  function drawHist() {
    const HH = { All: 'सब', 'Not fit': 'नहीं चलेगी', Caution: 'सावधानी', 'With open issues': 'खराबी बाकी' };
    $('histFilt').innerHTML = ['All', 'Not fit', 'Caution', 'With open issues'].map(f => '<button type="button" class="' + (f === histF ? 'on' : '') + '" data-f="' + f + '">' + f + ' · ' + HH[f] + '</button>').join('');
    const rows = HIST.filter(r => histF === 'All' || (histF === 'Not fit' && /Not fit/.test(r.Result)) || (histF === 'Caution' && /caution/.test(r.Result)) || (histF === 'With open issues' && Number(r.Open_Issues) > 0));
    $('histList').innerHTML = JNP.rowsHtml(rows, r => ({ t: E(r.Truck_No) + ' <small style="display:inline;font-weight:600">· ' + E(JNP.dmy(r.Created_At)) + '</small>', tag: r.Result, cls: /Not fit/.test(r.Result) ? 'bad' : /caution/.test(r.Result) ? 'warn' : 'ok',
      s: E(r.Inspection_Type + ' · ' + r.Items_Issue + ' खराबी · score ' + r.Score_Pct + '% · ' + r.Created_By) + (Number(r.Open_Issues) ? ' · <b style="color:var(--red)">' + r.Open_Issues + ' बाकी</b>' : Number(r.Items_Issue) ? ' · सब ठीक ✓' : ''), click: true }), 'No inspections in the last 90 days. · 90 दिन में कोई जांच नहीं।');
  }
  $('histFilt').onclick = e => { const b = e.target.closest('button'); if (b) { histF = b.dataset.f; drawHist(); } };
  $('reloadHist').onclick = loadHist;
  $('histList').addEventListener('click', async e => {
    const it = e.target.closest('.item'); if (!it) return;
    const r = HIST.filter(r => histF === 'All' || (histF === 'Not fit' && /Not fit/.test(r.Result)) || (histF === 'Caution' && /caution/.test(r.Result)) || (histF === 'With open issues' && Number(r.Open_Issues) > 0))[Number(it.dataset.i)];
    const d = $('detail'); d.classList.remove('hidden'); d.innerHTML = '<div class="muted">Loading ' + E(r.Record_ID) + '…</div>'; d.scrollIntoView({ block: 'start' });
    try {
      const o = await JNP.call('inspDetail', { id: r.Record_ID }), R = o.record, iss = o.items.filter(x => x.Status === 'Issue');
      const photos = (R.Truck_Photo_URLs || '').split(/\s+/).filter(Boolean).concat(R.Odometer_Photo_URL ? [R.Odometer_Photo_URL] : []);
      d.innerHTML = '<h3 class="cardh"><span>' + E(R.Truck_No) + ' · ' + E(JNP.dmy(R.Created_At)) + '</span><button class="mini" type="button" id="dClose">✕</button></h3>' +
        '<div style="margin-bottom:8px">' + resPill(R.Result) + ' <span class="pill">' + E(R.Inspection_Type) + '</span> <span class="pill">score ' + E(R.Score_Pct) + '%</span></div>' +
        '<div class="kv"><span>By · किसने</span><b>' + E(R.Created_By) + '</b><span>Driver · ड्राइवर</span><b>' + E(R.Driver_Name || '—') + '</b><span>Odometer · मीटर</span><b>' + E(R.Odometer_KM || '—') + '</b><span>Location · जगह</span><b>' + E(R.Location || '—') + '</b><span>Checked · जांचे</span><b>' + E(R.Items_OK + ' OK · ' + R.Items_Issue + ' issue · ' + R.Items_NA + ' N.A.') + '</b>' + (R.Breakdown_ID ? '<span>Off-road</span><b>' + E(R.Breakdown_ID) + '</b>' : '') + (R.Remark ? '<span>Remark</span><b>' + E(R.Remark) + '</b>' : '') + '</div>' +
        (photos.length ? '<div class="photos" style="margin-top:10px">' + photos.map(u => '<a class="ph" href="' + E(u) + '" target="_blank" rel="noopener"><img src="' + E(thumb(u)) + '" alt=""></a>').join('') + '</div>' : '') +
        '<div class="grouph">Issues · खराबी (' + iss.length + ')</div>' + (iss.length ? iss.map(x => '<div class="ditem"><div class="itop"><b>' + E(x.Item) + '</b><span class="sevp ' + E(x.Severity) + '">' + E(x.Severity) + ' · ' + (SEV_HI[x.Severity] || '') + '</span></div><small class="hint">' + E([x.Section, [hiIssue(x.Issue), x.Note].filter(Boolean).join(' – ')].join(' · ')) + '</small>' +
          '<div><span class="pill ' + (x.Action_Status === 'Fixed' ? 'ok' : 'bad') + '">' + E(x.Action_Status === 'Fixed' ? 'Fixed · ठीक' + (x.Fixed_By ? ' – ' + x.Fixed_By : '') : 'Open · बाकी ' + (x.Days_Open !== '' ? x.Days_Open + ' दिन' : '')) + '</span>' + (x.Repeat_Flag === 'Yes' ? ' <span class="pill bad">repeat · फिर से</span>' : '') + '</div>' +
          (x.Fix_Note ? '<small class="hint">Fix: ' + E(x.Fix_Note) + '</small>' : '') + (x.Photo_URL ? '<a href="' + E(x.Photo_URL) + '" target="_blank" rel="noopener"><img class="th" style="width:54px;height:54px;object-fit:cover;border-radius:8px;margin-top:6px" src="' + E(thumb(x.Photo_URL)) + '" alt=""></a>' : '') + '</div>').join('') : '<div class="okline">No issues · कोई खराबी नहीं ✓</div>') +
        '<button class="btn green" type="button" id="dShare" style="margin-top:12px">📲 Share on WhatsApp · भेजें</button>';
      $('dClose').onclick = () => d.classList.add('hidden');
      $('dShare').onclick = () => JNP.whatsapp(reportText(R, iss.filter(x => x.Photo_URL).map(x => x.Item + ': ' + x.Photo_URL).join('\n')));
    } catch (ex) { d.innerHTML = '<span class="err">' + E(ex.message) + '</span>'; }
  });

  if (!canE) return;
  restoreDraft();
  paint();
})();
</script>
</body>
</html>
