<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Billing · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="ubView" class="hidden">
      <div class="card list"><h3 class="cardh"><span>Delivered, not billed</span><button class="mini" id="rub" type="button">↻</button></h3>
        <div class="hint" style="margin-bottom:6px">Target: bill within <b id="tat">48</b> hours of POD. Tick LRs of one party → Make bill.</div><div id="ub" class="muted">Loading…</div></div>
      <div class="card"><button class="btn orange" id="mkBill" type="button">🧮 Make bill from ticked LRs</button></div>
    </div>
    <div id="newView" class="hidden">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>New bill · नया बिल</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Save bill</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="billView" class="hidden">
      <div class="card list"><div class="seg small" id="bSeg" style="margin-bottom:10px"><button type="button" data-v="open" class="on">Outstanding</button><button type="button" data-v="all">All bills</button></div><div class="nums" id="bNums"></div><div id="bills" class="muted">Loading…</div></div>
      <form id="rf" class="card hidden" autocomplete="off" novalidate>
        <h3 class="cardh"><span id="rTitle">Receipt</span></h3>
        <div id="rfields"></div>
        <div id="rerr" class="err hidden"></div>
        <button id="rbtn" class="btn green" type="submit">Save receipt</button>
      </form>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const CODE = 'FIN-02';
  JNP.header($('hdr'), 'Billing', 'बिलिंग · वसूली');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  const TAT = 48; $('tat').textContent = TAT;
  let ub = [], bills = [], clientReqId = JNP.uid();

  async function loadUb() {
    $('ub').innerHTML = 'Loading…';
    try {
      ub = (await JNP.call('unbilledLRs')).rows;
      $('ub').innerHTML = ub.length ? ub.map((r, i) => '<label class="item" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" class="lrc" data-i="' + i + '" style="margin-top:4px;width:20px;height:20px">' +
        '<span style="flex:1"><span class="itop" style="display:flex;justify-content:space-between"><b>' + JNP.esc(r.LR_No + ' · ' + r.Party) + '</b><span class="pill ' + (r.Hours_Since_POD > TAT ? 'bad' : r.Hours_Since_POD > TAT / 2 ? 'warn' : 'ok') + '">' + Math.round(r.Hours_Since_POD) + ' h</span></span>' +
        '<small>' + JNP.esc([r.Truck_No, r.Destination, r.Qty_MT + ' MT', r.Freight_Type, 'POD ' + JNP.dmy(r.POD_At)].filter(Boolean).join(' · ')) + '</small></span></label>').join('') : '<div class="muted">Everything delivered is billed 🎉</div>';
    } catch (e) { $('ub').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  $('rub').onclick = loadUb;
  $('mkBill').onclick = () => {
    const pick = [...document.querySelectorAll('.lrc:checked')].map(x => ub[Number(x.dataset.i)]);
    if (!pick.length) return JNP.toast('Tick at least one LR', 'warn');
    const parties = [...new Set(pick.map(p => p.Party))];
    if (parties.length > 1 && !confirm('Ticked LRs are of ' + parties.length + ' parties. Continue?')) return;
    sel('new'); F.set('Party', parties[0]); F.setFire('LR_List', pick.map(p => p.LR_No).join(', '));
  };

  const F = JNP.form($('fields'), [
    { k: 'Bill_No', label: 'Bill number', upper: true, req: true, half: true },
    { k: 'Bill_Date', label: 'Bill date', type: 'date', value: () => JNP.todayISO(), half: true },
    { k: 'Party', label: 'Party', type: 'party', req: true },
    { k: 'LR_List', label: 'LR numbers', upper: true, type: 'textarea', req: true, hint: 'Comma separated, e.g. A21306, A21307' },
    { k: 'Freight_Amount', label: 'Freight ₹', type: 'dec', req: true, half: true },
    { k: 'Detention', label: 'Detention ₹', type: 'dec', half: true },
    { k: 'Other_Charges', label: 'Other ₹', type: 'dec', half: true },
    { k: 'GST_Amount', label: 'GST ₹', type: 'dec', half: true },
    { k: 'tot', type: 'html' },
    { k: 'Submitted_At', label: 'Submitted to party at', type: 'datetime', hint: 'Fill when the bill reaches the party — starts the credit period' },
    { k: 'Credit_Days', label: 'Credit days', type: 'num', hint: 'Blank = party default' },
    { k: 'Bill_Copy_URL', label: 'Bill copy photo', type: 'photo' },
    { k: 'Remark', label: 'Remark' },
  ], { module: CODE });
  F.on(k => {
    if (/Freight|Detention|Other|GST/.test(k)) { const s = ['Freight_Amount', 'Detention', 'Other_Charges', 'GST_Amount'].reduce((a, x) => a + (Number(F.val(x)) || 0), 0); F.F.tot.set(s ? '<div class="field"><span class="okline">Bill amount <b>' + JNP.inr(s) + '</b></span></div>' : ''); }
    if (k === 'LR_List') { const n = F.val('LR_List').split(/[\s,]+/).filter(Boolean); const mt = n.reduce((a, lr) => { const r = ub.find(x => x.LR_No === lr.toUpperCase()); return a + (r ? Number(r.Qty_MT) || 0 : 0); }, 0); F.info('LR_List', n.length ? n.length + ' LR' + (mt ? ' · ' + mt.toFixed(3) + ' MT' : '') : ''); }
  });
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const v = F.values(); if (v.Submitted_At) v.Submitted_At = v.Submitted_At.replace('T', ' ');
      const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: v });
      const r = out.record;
      const msg = JNP.waText('🧮 BILL ' + r.Bill_No + ' · ' + r.Party, [['Date', JNP.dmy(r.Bill_Date)], ['LRs', r.LR_Count + ' (' + r.LR_List + ')'], ['Quantity', r.Total_MT + ' MT'], ['Bill amount', JNP.inr(r.Bill_Amount)],
        ['Status', r.Bill_Status], ['Billed in', r.Billing_TAT_Hrs !== '' ? r.Billing_TAT_Hrs + ' h after POD' : ''], ['Due', JNP.dmy(r.Due_Date)]]);
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'BILL SAVED', big: r.Bill_No, sub: r.Party + ' · ' + JNP.inr(r.Bill_Amount) + ' · due ' + JNP.dmy(r.Due_Date),
        buttons: [{ label: '📲 Share on WhatsApp', onClick: () => JNP.whatsapp(msg) }],
        onNew: () => { F.reset(); clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); loadUb(); } });
    });
  });

  // ---------- bills + receipts
  let mode = 'open', curBill = null;
  $('bSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.v; $('bSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); loadBills(); };
  async function loadBills() {
    $('bills').innerHTML = 'Loading…';
    try {
      bills = (await JNP.call('bills', { openOnly: mode === 'open' })).rows;
      const out = bills.reduce((a, b) => a + (Number(b.Balance) || 0), 0), od = bills.filter(b => b.Days_Overdue > 0).reduce((a, b) => a + (Number(b.Balance) || 0), 0);
      $('bNums').innerHTML = '<div class="num"><b>' + bills.length + '</b><span>Bills</span></div><div class="num warn"><b>' + JNP.inr(Math.round(out)) + '</b><span>Outstanding</span></div><div class="num bad"><b>' + JNP.inr(Math.round(od)) + '</b><span>Overdue</span></div>';
      $('bills').innerHTML = JNP.rowsHtml(bills, b => ({ t: JNP.esc(b.Bill_No + ' · ' + b.Party), s: JNP.esc(['Bill ' + JNP.inr(b.Bill_Amount), 'Bal ' + JNP.inr(b.Balance), 'Due ' + JNP.dmy(b.Due_Date), b.LR_Count + ' LR', b.Billing_TAT_Hrs !== '' ? 'billed in ' + b.Billing_TAT_Hrs + ' h' : ''].join(' · ')),
        tag: b.Days_Overdue > 0 ? b.Days_Overdue + ' d overdue' : b.Bill_Status, cls: b.Days_Overdue > 0 ? 'bad' : JNP.statusCls(b.Bill_Status), click: ctx.can('E') && Number(b.Balance) > 0 }), mode === 'open' ? 'Nothing outstanding.' : 'No bills yet.');
    } catch (e) { $('bills').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  $('bills').onclick = e => { const it = e.target.closest('.item.tap'); if (!it) return; curBill = bills[Number(it.dataset.i)]; openReceipt(); };
  let R = null;
  function openReceipt() {
    $('rTitle').textContent = 'Receipt · ' + curBill.Bill_No + ' (bal ' + JNP.inr(curBill.Balance) + ')';
    R = JNP.form($('rfields'), [
      { k: 'Amount', label: 'Amount received ₹', type: 'dec', req: true, value: curBill.Balance },
      { k: 'Mode', label: 'Mode', type: 'select', list: 'Payment_Mode', req: true, value: 'Bank Transfer', half: true },
      { k: 'Receipt_Date', label: 'Date', type: 'date', value: () => JNP.todayISO(), half: true },
      { k: 'Ref_No', label: 'UTR / cheque no.' },
      { k: 'TDS_Deducted', label: 'TDS ₹', type: 'dec', half: true },
      { k: 'Short_Deductions', label: 'Short / deduction ₹', type: 'dec', half: true },
      { k: 'Remark', label: 'Remark' },
    ], { module: CODE });
    $('rf').classList.remove('hidden'); $('rf').scrollIntoView({ behavior: 'smooth' });
  }
  $('rf').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('rbtn'), $('rerr'), async () => {
      const bad = R.check(); if (bad) throw new Error(bad);
      const out = await JNP.call('receipt', { data: Object.assign({ Bill_No: curBill.Bill_No }, R.values()) });
      JNP.toast('Saved — balance ' + JNP.inr(out.balance), 'ok');
      const msg = JNP.waText('💰 PAYMENT RECEIVED · ' + curBill.Party, [['Bill', curBill.Bill_No], ['Received', JNP.inr(R.val('Amount')) + ' (' + R.val('Mode') + ' ' + R.val('Ref_No') + ')'], ['TDS', JNP.inr(R.val('TDS_Deducted'))], ['Short', JNP.inr(R.val('Short_Deductions'))], ['Balance', JNP.inr(out.balance)]]);
      $('rf').classList.add('hidden'); loadBills();
      if (confirm('Share on WhatsApp?')) JNP.whatsapp(msg);
    });
  });

  const tabsList = [{ id: 'ub', label: '⏱️ Unbilled' }].concat(ctx.can('E') ? [{ id: 'new', label: '➕ New bill' }] : []).concat([{ id: 'bills', label: '💰 Bills & receipts' }]);
  const sel = JNP.tabs($('tabs'), tabsList, t => {
    $('ubView').classList.toggle('hidden', t !== 'ub'); $('newView').classList.toggle('hidden', t !== 'new'); $('billView').classList.toggle('hidden', t !== 'bills');
    if (t === 'ub') loadUb(); if (t === 'bills') loadBills();
  });
})();
</script>
</body>
</html>
