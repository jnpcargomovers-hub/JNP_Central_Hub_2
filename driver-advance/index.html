<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Driver Advance · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Driver advance · ड्राइवर एडवांस</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Send for approval · अप्रूवल के लिए भेजें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="card list hidden"><div id="rows" class="muted">Loading…</div></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const CODE = 'FIN-01';
  JNP.header($('hdr'), 'Driver Advance', 'ड्राइवर एडवांस');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  let lim = null, clientReqId = JNP.uid(), lastD = '';
  const overLimit = v => !lim || lim.max === '' || Number(v.Amount) > Number(lim.max);
  const F = JNP.form($('fields'), [
    { k: 'Driver_Name', label: 'Driver', hi: 'ड्राइवर', type: 'driver', req: true, allowNew: false },
    { k: 'lim', type: 'html' },
    { k: 'Advance_Type', label: 'Advance type', type: 'select', options: () => JNP.list('Advance_Type').filter(x => x !== 'Trip Advance'), req: true },
    { k: 'Amount', label: 'Amount (₹)', hi: 'रकम', type: 'num', req: true },
    { k: 'Truck_No', label: 'Truck', type: 'truck', allowNew: false },
    { k: 'Reason', label: 'Reason', hi: 'कारण', type: 'textarea', req: true },
    { k: 'Approver_Requested', label: 'Whose approval?', type: 'approver', amountKey: 'Amount', overLimit: overLimit, req: true },
  ], { module: CODE });
  F.on(async k => {
    if (k === 'Driver_Name' && F.val('Driver_Name') && F.val('Driver_Name') !== lastD) {
      lastD = F.val('Driver_Name'); const d = JNP.findDriver(lastD); if (d && d.truck && !F.val('Truck_No')) F.set('Truck_No', d.truck);
      F.F.lim.set('<div class="hint">Checking limit…</div>');
      try {
        lim = await JNP.call('advanceLimit', { driver: lastD });
        F.F.lim.set(lim.max === '' ? '<div class="field"><span class="badline">Monthly salary not set in Driver_Master — any amount goes to HO</span></div>' :
          '<div class="nums"><div class="num"><b>' + lim.days + '</b><span>Days on duty</span></div><div class="num"><b>' + JNP.inr(lim.earned) + '</b><span>Earned this month</span></div><div class="num warn"><b>' + JNP.inr(lim.advanced) + '</b><span>Already given</span></div></div>' +
          '<div class="field"><span class="' + (lim.max > 0 ? 'okline' : 'badline') + '">Can give up to <b>' + JNP.inr(lim.max) + '</b></span></div>');
      } catch (e) { lim = null; F.F.lim.set('<div class="err">' + JNP.esc(e.message) + '</div>'); }
      F.reloadApprovers(); check();
    }
    if (k === 'Amount') check();
  });
  function check() { const a = Number(F.val('Amount')); F.info('Amount', a && lim && overLimit(F.all()) ? '<span class="badline">Over the limit — needs HO (Level 1) approval</span>' : ''); }

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: F.values() });
      const r = out.record;
      const msg = JNP.waText('💵 DRIVER ADVANCE · ' + JNP.inr(r.Amount), [['Driver', r.Driver_Name], ['Truck', r.Truck_No], ['Type', r.Advance_Type], ['Reason', r.Reason],
        ['Days on duty', r.Days_On_Duty], ['Earned to date', JNP.inr(r.Earned_To_Date)], ['Already given', JNP.inr(r.Advanced_This_Month)], ['Allowed', JNP.inr(r.Max_Allowed)],
        ['Over limit', r.Over_Limit === 'Yes' ? '⚠️ YES' : 'No'], ['Approval by', r.Approver_Requested], ['Ref', r.Record_ID]]);
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'SENT FOR APPROVAL', big: JNP.inr(r.Amount), sub: r.Driver_Name + (r.Over_Limit === 'Yes' ? ' · OVER LIMIT' : '') + ' · waiting for ' + r.Approver_Requested,
        buttons: JNP.approvalButtons(out, msg), onNew: () => location.reload() });
    });
  });
  async function loadList() {
    $('rows').innerHTML = 'Loading…';
    try {
      const out = await JNP.call('list', { module: CODE, days: 45, limit: 100 });
      $('rows').innerHTML = JNP.rowsHtml(out.rows, r => ({ t: JNP.inr(r.Amount) + ' · ' + JNP.esc(r.Driver_Name), s: JNP.esc([r.Advance_Type, r.Truck_No, 'allowed ' + JNP.inr(r.Max_Allowed), JNP.dmy(r.Created_At), r.Approved_By ? '✓ ' + r.Approved_By : 'to ' + r.Approver_Requested, r.Paid_At ? 'paid ' + r.Payment_Mode : ''].filter(Boolean).join(' · ')), tag: r.Over_Limit === 'Yes' && r.Status === 'Pending' ? 'Over limit' : r.Status, cls: r.Over_Limit === 'Yes' && r.Status === 'Pending' ? 'bad' : JNP.statusCls(r.Status) }), 'No advances in 45 days.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  JNP.tabs($('tabs'), (ctx.can('E') ? [{ id: 'new', label: '➕ New advance' }] : []).concat([{ id: 'list', label: '📋 Advances' }]), t => {
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t !== 'list'); if (t === 'list') loadList();
  });
})();
</script>
</body>
</html>
