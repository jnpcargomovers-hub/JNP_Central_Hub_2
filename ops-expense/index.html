<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Ops Expense · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Expense request (non-truck) · खर्च अनुरोध</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Send for approval · अप्रूवल के लिए भेजें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="card list hidden"><div id="rows" class="muted">Loading…</div></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const CODE = 'OPS-05';
  JNP.header($('hdr'), 'Expense Approval', 'खर्च अनुमोदन (अन्य)');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  let clientReqId = JNP.uid();
  const F = JNP.form($('fields'), [
    { k: 'Expense_Head', label: 'Expense head', hi: 'खर्च का प्रकार', type: 'select', list: 'Ops_Expense_Head', req: true },
    { k: 'Amount', label: 'Amount (₹)', hi: 'रकम', type: 'num', req: true, half: true },
    { k: 'Urgency', label: 'Urgency', type: 'select', list: 'Urgency', value: 'Normal', half: true },
    { k: 'Truck_No', label: 'Truck (if any)', type: 'truck', allowNew: false },
    { k: 'Location', label: 'Location', hi: 'जगह' },
    { k: 'Description', label: 'Details', hi: 'विवरण', type: 'textarea', req: true },
    { k: 'Vendor', label: 'Paid to / vendor', type: 'vendor' },
    { k: 'Quote_Photo_URL', label: 'Quotation / slip photo', type: 'photo' },
    { k: 'Bill_Photo_URL', label: 'Bill photo', type: 'photo' },
    { k: 'Approver_Requested', label: 'Whose approval?', hi: 'किसका अप्रूवल', type: 'approver', amountKey: 'Amount', req: true },
    { k: 'Remark', label: 'Remark' },
  ], { module: CODE });

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: F.values() });
      const r = out.record;
      const msg = JNP.waText('EXPENSE APPROVAL · ' + JNP.inr(r.Amount), [['Head', r.Expense_Head], ['Truck', r.Truck_No], ['Location', r.Location], ['Details', r.Description],
        ['Vendor', r.Vendor], ['Urgency', r.Urgency], ['Approval by', r.Approver_Requested], ['Photo', r.Quote_Photo_URL || r.Bill_Photo_URL], ['Ref', r.Record_ID]]);
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'SENT FOR APPROVAL', big: JNP.inr(r.Amount), sub: r.Expense_Head + ' · waiting for ' + r.Approver_Requested,
        buttons: JNP.approvalButtons(out, msg).concat([{ label: '📲 Share to group', cls: 'light', onClick: () => JNP.whatsapp(msg) }]),
        onNew: () => { F.reset(); clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });

  async function loadList() {
    $('rows').innerHTML = 'Loading…';
    try {
      const out = await JNP.call('list', { module: CODE, days: 45, limit: 80, mine: !ctx.isL1 && !ctx.can('A') && !ctx.can('P') });
      $('rows').innerHTML = JNP.rowsHtml(out.rows, r => ({ t: JNP.inr(r.Amount) + ' · ' + JNP.esc(r.Expense_Head), s: JNP.esc([r.Truck_No, r.Description, r.Created_By, JNP.dmy(r.Created_At), r.Approved_By ? '✓ ' + r.Approved_By : 'to ' + r.Approver_Requested, r.Paid_At ? 'paid ' + r.Payment_Mode + ' ' + (r.Payment_Ref || '') : ''].filter(Boolean).join(' · ')), tag: r.Status, cls: JNP.statusCls(r.Status) }), 'No expenses in 45 days.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  JNP.tabs($('tabs'), (ctx.can('E') ? [{ id: 'new', label: '➕ New request' }] : []).concat([{ id: 'list', label: '📋 Requests' }]), t => {
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t !== 'list'); if (t === 'list') loadList();
  });
})();
</script>
</body>
</html>
