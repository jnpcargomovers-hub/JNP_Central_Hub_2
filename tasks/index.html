<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Tasks · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .seg2 { display: flex; gap: 6px; margin: 12px 0 4px; } .seg2 button { flex: 1; border: 1.5px solid #CCD5E2; background: #fff; border-radius: 10px; padding: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .seg2 button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .tk { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 11px 12px; margin-top: 8px; border-left: 5px solid var(--c, #94A3B8); cursor: pointer; }
    .tk .t { display: flex; gap: 8px; align-items: baseline; } .tk .t b { flex: 1; color: var(--navy); font-size: 15px; } .tk small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 3px; }
    .tk .lu { font-size: 12.5px; color: var(--char); margin-top: 4px; font-style: italic; }
    .od { color: var(--red); font-weight: 800; }
    .people { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; } .people span { background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; box-shadow: var(--shadow); }
    .people span i { font-style: normal; color: var(--red); }
    .tl .item small { white-space: pre-wrap; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .acts .btn { flex: 1 1 140px; margin: 0 !important; padding: 11px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView" class="hidden">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>New task · नया काम</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">📋 Give task · काम दें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="hidden">
      <div class="seg2" id="openSeg"><button type="button" data-v="open" class="on">⏳ Pending · बाकी</button><button type="button" data-v="closed">✅ Done (30 days)</button></div>
      <div id="people"></div>
      <div id="rows"><div class="card muted">Loading…</div></div>
    </div>
    <div id="detail" class="hidden"></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  JNP.header($('hdr'), 'Tasks', 'काम · टास्क');
  const ctx = await JNP.requireModule('TSK-01');
  await JNP.masters().catch(() => { });
  const me = JNP.session().user;
  const users = () => (JNP.M().users || []).filter(u => u.name).sort((a, b) => a.name.localeCompare(b.name));
  let view = JNP.param('view') || 'mine', state = 'open', clientReqId = JNP.uid(), cur = null, ROWS = [];
  const PRI = { High: '#B91C1C', Normal: '#1D4ED8', Low: '#94A3B8' };
  const today = JNP.todayISO();

  // ---------- new task
  const F = JNP.form($('fields'), [
    { k: 'Title', label: 'What needs to be done?', hi: 'क्या करना है', req: true, ph: 'e.g. Get fitness renewed for 2748' },
    { k: 'Details', label: 'Details', hi: 'पूरी जानकारी', type: 'textarea', ph: 'optional' },
    { k: 'Assigned_To', label: 'Give to', hi: 'किसको', type: 'select', req: true, options: () => users().map(u => ({ v: u.name, t: u.name })) },
    { k: 'Due_Date', label: 'By when', hi: 'कब तक', type: 'date', half: true },
    { k: 'Priority', label: 'Priority', type: 'seg', options: [{ v: 'High', t: '🔴 High' }, { v: 'Normal', t: 'Normal' }, { v: 'Low', t: 'Low' }], value: 'Normal', half: true },
    { k: 'Truck_No', label: 'Truck (if any)', type: 'truck', allowNew: false },
    { k: 'Photo_URL', label: 'Photo (optional)', hi: 'फोटो', type: 'photo' },
  ], { module: 'TSK-01' });
  const link = id => JNP.CONFIG.HUB + 'tasks/?id=' + encodeURIComponent(id);
  const taskMsg = (r, head) => JNP.waText((head || '📋 TASK') + ' · ' + r.Assigned_To, [['Task', r.Title], ['Details', r.Details], ['Due', r.Due_Date ? JNP.dmy(r.Due_Date) : ''], ['Priority', r.Priority === 'High' ? '🔴 High' : ''],
    ['Truck', r.Truck_No], ['Given by', r.Created_By], ['Update', head ? r.Last_Update : ''], ['Photo', r.Photo_URL]], 'Open / reply: ' + link(r.Record_ID));
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const out = await JNP.call('save', { module: 'TSK-01', clientReqId: clientReqId, data: F.values() }), r = out.record;
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'TASK GIVEN', big: r.Assigned_To, sub: r.Title + (r.Due_Date ? ' · by ' + JNP.dmy(r.Due_Date) : ''),
        buttons: [{ label: '📲 Send on WhatsApp · भेजें', onClick: () => JNP.whatsapp(taskMsg(r)) }],
        onNew: () => { F.reset(); clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });

  // ---------- lists
  async function loadList() {
    $('rows').innerHTML = '<div class="card muted">Loading…</div>'; $('people').innerHTML = '';
    try {
      const o = await JNP.call('taskList', { view: view, status: state }); ROWS = o.rows;
      if (o.byPerson && o.byPerson.length) $('people').innerHTML = '<div class="people">' + o.byPerson.map(p => '<span>' + E(p.name) + ' · ' + p.open + (p.overdue ? ' <i>(' + p.overdue + ' late)</i>' : '') + '</span>').join('') + '</div>';
      $('rows').innerHTML = ROWS.length ? ROWS.map((r, i) => {
        const late = r.Overdue === 'Yes';
        return '<div class="tk" data-i="' + i + '" style="--c:' + (r.Status === 'Done' ? '#12804A' : PRI[r.Priority] || '#1D4ED8') + '"><div class="t"><b>' + E(r.Title) + '</b><span class="pill ' + (r.Status === 'Done' ? 'ok' : r.Status === 'In progress' ? 'blue' : 'warn') + '">' + E(r.Status) + '</span></div>' +
          '<small>' + (view === 'mine' ? 'From ' + E(r.Created_By) : 'To ' + E(r.Assigned_To)) + (r.Due_Date ? ' · <span class="' + (late ? 'od' : '') + '">due ' + E(JNP.dmy(r.Due_Date)) + (late ? ' · LATE' : '') + '</span>' : '') + (r.Truck_No ? ' · ' + E(r.Truck_No) : '') + '</small>' +
          (r.Last_Update && r.Last_Update !== 'Created' ? '<div class="lu">💬 ' + E(r.Last_Update) + ' — ' + E(r.Last_Update_By || '') + '</div>' : '') + '</div>';
      }).join('') : '<div class="card muted">' + (state === 'open' ? 'Nothing pending 🎉' : 'Nothing closed in the last 30 days') + '</div>';
    } catch (e) { $('rows').innerHTML = '<div class="card"><span class="err">' + E(e.message) + '</span></div>'; }
  }
  $('rows').onclick = e => { const it = e.target.closest('.tk'); if (it) openTask(ROWS[Number(it.dataset.i)].Record_ID); };
  $('openSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; state = b.dataset.v; $('openSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); loadList(); };

  // ---------- one task: timeline + reply / start / close / reopen / reassign / due
  async function openTask(id) {
    ['newView', 'listView'].forEach(v => $(v).classList.add('hidden')); $('detail').classList.remove('hidden');
    $('detail').innerHTML = '<div class="card muted">Loading…</div>'; window.scrollTo(0, 0);
    try { const o = await JNP.call('taskLog', { id: id }); cur = o.task; drawTask(o.rows); }
    catch (e) { $('detail').innerHTML = '<div class="card"><span class="err">' + E(e.message) + '</span></div>'; }
  }
  function drawTask(log) {
    const r = cur, mine = r.Assigned_Mobile === me.mobile || r.Assigned_To === me.name, given = r.Created_Mobile === me.mobile, l1 = ctx.isL1, done = r.Status === 'Done';
    const late = !done && r.Due_Date && r.Due_Date < today;
    $('detail').innerHTML = '<div class="card"><button class="mini" type="button" id="back">‹ Back</button>' +
      '<h3 class="cardh" style="margin-top:10px"><span>' + E(r.Title) + '</span><span class="pill ' + (done ? 'ok' : 'warn') + '">' + E(r.Status) + '</span></h3>' +
      '<div class="kv">' + [['Given to', r.Assigned_To], ['Given by', r.Created_By + ' · ' + JNP.dmy(String(r.Created_At).slice(0, 10))], ['Due', r.Due_Date ? JNP.dmy(r.Due_Date) + (late ? ' · LATE' : '') : ''], ['Priority', r.Priority], ['Truck', r.Truck_No], ['Details', r.Details]]
        .filter(x => x[1]).map(x => '<span>' + x[0] + '</span><b' + (x[0] === 'Due' && late ? ' class="od"' : '') + '>' + E(x[1]) + '</b>').join('') + '</div>' +
      (r.Photo_URL ? '<div class="thumbs"><a href="' + E(r.Photo_URL) + '" target="_blank"><img src="' + E(JNP.driveThumb(r.Photo_URL)) + '"></a></div>' : '') +
      '<div class="grouph">Updates · अपडेट</div><div class="list tl">' + JNP.rowsHtml(log.slice().reverse(), x => ({ t: E(x.Action) + ' · ' + E(x.By), s: E(JNP.dmy(x.At) + (x.Note ? '\n' + x.Note : '')), extra: x.Photo_URL ? '<a class="mini" target="_blank" href="' + E(x.Photo_URL) + '">📷 photo</a>' : '' }), '—') + '</div></div>' +
      (ctx.can('E') && (mine || given || l1) ? '<form id="rf" class="card" novalidate><div id="rfields"></div><div id="rerr" class="err hidden"></div><div class="acts">' +
        (!done ? '<button class="btn orange" type="button" data-a="comment">💬 Send reply · जवाब</button>' : '') +
        (!done && mine && r.Status === 'Open' ? '<button class="btn light" type="button" data-a="start">▶️ Started · शुरू</button>' : '') +
        (!done ? '<button class="btn green" type="button" data-a="close">✅ Done · पूरा</button>' : '') +
        (done && (given || l1) ? '<button class="btn orange" type="button" data-a="reopen">↩️ Reopen · फिर खोलें</button>' : '') +
        (!done && (given || l1 || mine) ? '<button class="btn light" type="button" data-a="reassign">👤 Give to someone else</button>' : '') +
        (!done && (given || l1) ? '<button class="btn light" type="button" data-a="due">📅 Change due date</button>' : '') +
        '</div></form>' : '') +
      '<div class="card"><button class="btn light" type="button" id="wa">📲 Share on WhatsApp</button></div>';
    $('back').onclick = () => { $('detail').classList.add('hidden'); history.replaceState(null, '', location.pathname); JNP.tabs($('tabs'), TABS, onTab, view); };
    $('wa').onclick = () => JNP.whatsapp(taskMsg(cur, done ? '✅ TASK DONE' : '📋 TASK UPDATE'));
    if (!$('rf')) return;
    let mode = '';
    const R = JNP.form($('rfields'), [
      { k: 'note', label: 'Reply / note', hi: 'जवाब', type: 'textarea', ph: 'e.g. Called RTO, documents submitted' },
      { k: 'photo', label: 'Photo (optional)', type: 'photo' },
      { k: 'to', label: 'Give to', hi: 'किसको', type: 'select', options: () => users().filter(u => u.name !== r.Assigned_To).map(u => ({ v: u.name, t: u.name })), show: () => mode === 'reassign' },
      { k: 'due', label: 'New due date', hi: 'नई तारीख', type: 'date', show: () => mode === 'due' },
    ], { module: 'TSK-01' });
    const showOnly = a => { mode = a; R.refresh(); };
    let pending = '';
    $('rf').querySelector('.acts').onclick = e => {
      const b = e.target.closest('button[data-a]'); if (!b) return; const a = b.dataset.a;
      if ((a === 'reassign' || a === 'due') && pending !== a) { pending = a; showOnly(a); b.textContent = a === 'reassign' ? '👤 Confirm new person' : '📅 Confirm date'; return; }
      JNP.submit(b, $('rerr'), async () => {
        const v = R.all(); if (a === 'reassign' && !v.to) throw new Error('Choose who'); if (a === 'due' && !v.due) throw new Error('Pick a date');
        const o = await JNP.call('taskAct', { id: cur.Record_ID, act: a, note: v.note, photo: v.photo, to: v.to, due: v.due });
        cur = o.task; JNP.toast('Saved ✓', 'ok');
        if (a === 'close' || a === 'reassign' || a === 'comment') JNP.whatsapp(taskMsg(cur, a === 'close' ? '✅ TASK DONE' : a === 'reassign' ? '📋 TASK' : '💬 TASK REPLY'));
        openTask(cur.Record_ID);
      });
    };
  }

  // ---------- tabs
  const TABS = [{ id: 'mine', label: '📥 For me' }, { id: 'given', label: '📤 Given by me' }].concat(ctx.isL1 ? [{ id: 'all', label: '👥 Everyone' }] : []).concat(ctx.can('E') ? [{ id: 'new', label: '➕ New' }] : []);
  function onTab(t) {
    $('detail').classList.add('hidden');
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t === 'new');
    if (t !== 'new') { view = t; loadList(); }
  }
  JNP.tabs($('tabs'), TABS, onTab, view);
  if (JNP.param('id')) openTask(JNP.param('id'));
})();
</script>
</body>
</html>
