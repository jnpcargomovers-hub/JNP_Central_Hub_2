<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Challans · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .sumbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; } .sumbar div { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 10px; text-align: center; }
    .sumbar b { display: block; font-size: 20px; color: var(--red); } .sumbar span { font-size: 12px; font-weight: 700; color: var(--muted); }
    .seg2 { display: flex; gap: 6px; margin: 12px 0 4px; } .seg2 button { flex: 1; border: 1.5px solid #CCD5E2; background: #fff; border-radius: 10px; padding: 8px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .seg2 button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView" class="hidden">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>New challan · नया चालान</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn red" type="submit">🚨 Save challan · सेव करें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="hidden">
      <div class="sumbar" id="sum"></div>
      <div class="seg2" id="stSeg"><button type="button" data-v="Unpaid" class="on">Unpaid · बाकी</button><button type="button" data-v="">All (90 days)</button></div>
      <div class="card list"><div id="rows" class="muted">Loading…</div></div>
      <div id="detail"></div>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  const CODE = 'ADM-01';
  JNP.header($('hdr'), 'Challans', 'चालान · ट्रैफिक / RTO');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(() => { });
  const canClose = ctx.isL1 || ctx.can('A');
  const REASONS = [['Overspeed / rash driving', 'तेज़ गाड़ी', 'Driver'], ['No seat belt / helmet', 'सीट बेल्ट', 'Driver'], ['No / expired driving licence', 'लाइसेंस', 'Driver'], ['Signal / lane / no-entry', 'सिग्नल / नो-एंट्री', 'Driver'],
    ['Documents not carried', 'कागज़ साथ नहीं', 'Driver'], ['Parking', 'पार्किंग', 'Driver'], ['Overloading', 'ओवरलोड', 'Company'], ['Fitness expired', 'फिटनेस', 'Company'], ['Insurance expired', 'इंश्योरेंस', 'Company'],
    ['Tax expired', 'टैक्स', 'Company'], ['PUC expired', 'पीयूसी', 'Company'], ['Permit expired', 'परमिट', 'Company'], ['Other', 'अन्य', 'Other']];
  const faultOf = r => (REASONS.find(x => x[0] === r) || [])[2] || '';
  let clientReqId = JNP.uid(), status = 'Unpaid', rows = [];
  const F = JNP.form($('fields'), [
    { k: 'Truck_No', label: 'Truck', hi: 'गाड़ी', type: 'truck', req: true, allowNew: false },
    { k: 'Driver_Name', label: 'Driver', hi: 'ड्राइवर', type: 'driver' },
    { k: 'Challan_Date', label: 'Challan date', hi: 'तारीख', type: 'date', value: JNP.todayISO(), half: true },
    { k: 'Challan_No', label: 'Challan no.', hi: 'नंबर', upper: true, half: true, ph: 'optional' },
    { k: 'Reason', label: 'Reason', hi: 'कारण', type: 'select', req: true, options: REASONS.map(x => ({ v: x[0], t: x[0] + ' · ' + x[1] + (x[2] === 'Driver' ? ' (driver fault)' : '') })) },
    { k: 'Authority', label: 'Issued by', hi: 'किसने', type: 'seg', options: ['Police', 'RTO', 'Toll / NHAI', 'Other'] },
    { k: 'Location', label: 'Location', hi: 'जगह', ph: 'e.g. Songir toll' },
    { k: 'Amount', label: 'Amount (₹)', hi: 'रकम', type: 'num', req: true, half: true },
    { k: 'Debit_Driver', label: 'Recover from driver?', hi: 'ड्राइवर से वसूली?', type: 'seg', options: [{ v: 'Yes', t: 'Yes · हाँ' }, { v: 'No', t: 'No · नहीं' }], value: 'No', half: true },
    { k: 'Debit_Amount', label: 'Amount to recover (₹)', type: 'num', ph: 'same as challan', show: v => v.Debit_Driver === 'Yes' },
    { k: 'Photo_URL', label: 'Challan photo (optional)', hi: 'फोटो', type: 'photo' },
    { k: 'Remark', label: 'Remark', hi: 'टिप्पणी' },
  ], { module: CODE });
  F.on(k => {
    if (k === 'Reason') { F.set('Debit_Driver', faultOf(F.val('Reason')) === 'Driver' ? 'Yes' : 'No'); F.info('Reason', faultOf(F.val('Reason')) === 'Driver' ? '<span class="warnline">Driver fault — set to recover from driver (change if not)</span>' : ''); F.refresh && F.refresh(); }
    if (k === 'Truck_No') { const t = JNP.findTruck(F.val('Truck_No')); if (t && t.driver && !F.val('Driver_Name')) F.set('Driver_Name', t.driver); }
  });
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const v = F.values(); if (v.Debit_Driver === 'Yes' && !v.Driver_Name) throw new Error('Choose the driver to recover from');
      const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: v }), r = out.record;
      const msg = JNP.waText('🚨 CHALLAN · ' + r.Truck_No + ' · ' + JNP.inr(r.Amount), [['Reason', r.Reason], ['Fault', r.Fault], ['Driver', r.Driver_Name], ['Date', JNP.dmy(r.Challan_Date)], ['Challan no', r.Challan_No],
        ['By', r.Authority], ['Location', r.Location], ['Recover from driver', r.Debit_Driver === 'Yes' ? JNP.inr(r.Debit_Amount) + ' (posted to ledger)' : ''], ['Photo', r.Photo_URL], ['Ref', r.Record_ID]]);
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'CHALLAN SAVED', big: r.Truck_No + ' · ' + JNP.inr(r.Amount), sub: r.Reason + (r.Debit_Driver === 'Yes' ? ' · ' + JNP.inr(r.Debit_Amount) + ' debited to ' + r.Driver_Name : ''),
        buttons: [{ label: '📲 Share on WhatsApp · भेजें', onClick: () => JNP.whatsapp(msg) }],
        onNew: () => { F.reset(); clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });

  async function loadList() {
    $('rows').innerHTML = 'Loading…'; $('detail').innerHTML = '';
    try {
      const [o, s] = await Promise.all([JNP.call('list', { module: CODE, days: 90, limit: 200, status: status || undefined }), JNP.call('admSummary', {}).catch(() => ({}))]);
      if (s.challans) $('sum').innerHTML = '<div><b>' + s.challans.unpaid + '</b><span>Unpaid challans</span></div><div><b>' + JNP.inr(s.challans.unpaidAmt) + '</b><span>Unpaid amount</span></div>';
      rows = o.rows;
      $('rows').innerHTML = JNP.rowsHtml(rows, r => ({ t: JNP.esc(r.Truck_No + ' · ' + JNP.inr(r.Amount)), s: JNP.esc([r.Reason, r.Driver_Name, JNP.dmy(r.Challan_Date), r.Location, r.Debit_Driver === 'Yes' ? 'recover ' + JNP.inr(r.Debit_Amount) : ''].filter(Boolean).join(' · ')),
        tag: r.Status, cls: r.Status === 'Paid' || r.Status === 'Waived' ? 'ok' : r.Status === 'Contested' ? 'warn' : 'bad', click: 1 }), status ? 'No unpaid challans 🎉' : 'No challans');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + E(e.message) + '</span>'; }
  }
  $('rows').onclick = e => { const it = e.target.closest('.item'); if (it) detail(rows[Number(it.dataset.i)]); };
  $('stSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; status = b.dataset.v; $('stSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); loadList(); };
  function detail(r) {
    $('detail').innerHTML = '<div class="card"><h3 class="cardh"><span>🚨 ' + E(r.Truck_No) + ' · ' + JNP.inr(r.Amount) + '</span><span class="pill">' + E(r.Status) + '</span></h3><div class="kv">' +
      [['Reason', r.Reason], ['Fault', r.Fault], ['Driver', r.Driver_Name], ['Date', JNP.dmy(r.Challan_Date)], ['Challan no', r.Challan_No], ['Issued by', r.Authority], ['Location', r.Location],
       ['Recover from driver', r.Debit_Driver === 'Yes' ? JNP.inr(r.Debit_Amount) + (r.Debit_Posted === 'Yes' ? ' · in ledger' : '') : 'No'], ['Paid', r.Paid_Amount ? JNP.inr(r.Paid_Amount) + ' · ' + JNP.dmy(r.Paid_At) + ' · ' + (r.Payment_Mode || '') : ''], ['Entered by', r.Created_By], ['Remark', r.Remark]]
        .filter(x => x[1]).map(x => '<span>' + x[0] + '</span><b>' + E(x[1]) + '</b>').join('') + '</div>' +
      (r.Photo_URL ? '<div class="thumbs"><a href="' + E(r.Photo_URL) + '" target="_blank"><img src="' + E(JNP.driveThumb(r.Photo_URL)) + '"></a></div>' : '') +
      (canClose && r.Status !== 'Paid' ? '<form id="pf" novalidate style="margin-top:12px"><div id="pfields"></div><div id="perr" class="err hidden"></div><button id="pbtn" class="btn green" type="submit">Save · सेव करें</button></form>' : '') + '</div>';
    $('detail').scrollIntoView({ behavior: 'smooth' });
    if (!$('pf')) return;
    const P = JNP.form($('pfields'), [
      { k: 'status', label: 'Status', type: 'seg', req: true, options: [{ v: 'Paid', t: '✅ Paid' }, { v: 'Contested', t: '⚖️ Contested' }, { v: 'Waived', t: 'Waived' }] },
      { k: 'amount', label: 'Paid amount (₹)', type: 'num', value: r.Amount, show: v => v.status === 'Paid', half: true },
      { k: 'mode', label: 'Paid by', type: 'select', list: 'Payment_Mode', show: v => v.status === 'Paid', half: true },
      { k: 'ref', label: 'Receipt / UTR no.', show: v => v.status === 'Paid' },
    ], { module: CODE });
    $('pf').addEventListener('submit', e => { e.preventDefault(); JNP.submit($('pbtn'), $('perr'), async () => {
      const bad = P.check(); if (bad) throw new Error(bad); await JNP.call('challanPay', Object.assign({ id: r.Record_ID }, P.all())); JNP.toast('Saved ✓', 'ok'); loadList(); }); });
  }
  JNP.tabs($('tabs'), (ctx.can('E') ? [{ id: 'new', label: '➕ New challan' }] : []).concat([{ id: 'list', label: '📋 Challans' }]), t => {
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t !== 'list'); if (t === 'list') loadList();
  });
})();
</script>
</body>
</html>
