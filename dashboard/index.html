<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Dashboard · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .wrap { max-width: 1180px; }
    .viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #E6EBF2; }
    .filters { position: sticky; top: 66px; z-index: 15; background: var(--bg); padding: 10px 0 6px; }
    .fbar { display: flex; gap: 8px; align-items: stretch; }
    .fbar .input { flex: 1; min-width: 0; padding: 8px 10px; font-size: 14px; }
    .sel { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; background: #fff; border: 1.5px solid #CCD5E2; border-radius: 12px; padding: 4px 30px 4px 10px; }
    .sel::after { content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .sel span { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .sel.date { padding-right: 8px; } .sel.date::after { content: ''; }
    .sel input[type=date] { border: 0; background: transparent; font-weight: 800; color: var(--navy); font-size: 14.5px; padding: 0; outline: none; width: 100%; min-height: 22px; font-family: inherit; }
    .sel select { border: 0; background: transparent; font-weight: 800; color: var(--navy); font-size: 14.5px; padding: 0; -webkit-appearance: none; appearance: none; outline: none; width: 100%; }
    .sel.view { flex: 3; background: var(--navy); border-color: var(--navy); } .sel.view span { color: #9FB6DA; } .sel.view select { color: #fff; font-size: 15.5px; } .sel.view::after { color: #fff; }
    .sel.view select option { color: var(--ink); }
    .sharebtn { flex: 1; border: 0; border-radius: 12px; background: linear-gradient(135deg, #1FAF5E, #12804A); color: #fff; font-weight: 800; font-size: 14px; white-space: nowrap; padding: 0 12px; cursor: pointer; }
    .kpi.tap { cursor: pointer; } .kpi.tap .l::after { content: ' ›'; color: var(--orange); font-weight: 900; } .kpi.sel1 { outline: 2.5px solid var(--orange); }
    .drill { grid-column: 1 / -1; }
    .donut { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .donut svg { width: 150px; height: 150px; flex: none; }
    .stk { display: grid; grid-template-columns: 56px 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
    .stk .bars { display: flex; gap: 2px; height: 16px; } .stk .bars div { border-radius: 3px; min-width: 2px; }
    .fs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fs .b { border-radius: 12px; padding: 10px; background: var(--bg); cursor: pointer; border: 2px solid transparent; }
    .fs .b.on { border-color: var(--orange); background: #fff; }
    .fs .b b { display: block; font-size: 22px; color: var(--navy); line-height: 1.1; } .fs .b span { font-size: 11.5px; color: var(--muted); font-weight: 700; } .fs .b small { display: block; font-size: 11.5px; color: var(--char); }
    .fs .b.down b { color: var(--red); } .fs .b.ld b { color: var(--blue); } .fs .b.rt b { color: var(--s3); } .fs .b.wt b { color: var(--orange); }
    @media (max-width: 820px) { .fs { grid-template-columns: 1fr 1fr; } .filters { position: static; } .donut svg { width: 120px; height: 120px; } }
    .frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .frow .input { width: auto; padding: 8px 10px; min-height: 0; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1.5px solid #CCD5E2; background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--char); cursor: pointer; }
    .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .chip.sm { padding: 4px 10px; font-size: 12.5px; }
    .flabel { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 12px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k, var(--blue)); }
    .kpi .l { font-size: 12px; color: var(--muted); font-weight: 700; }
    .kpi .v { font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1.15; margin-top: 2px; letter-spacing: -.3px; }
    .kpi .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .sec { margin-top: 18px; }
    .sec h2 { font-size: 15px; color: var(--navy); margin: 0 0 8px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .sec h2::before { content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--orange); }
    .sec h2 small { font-weight: 600; color: var(--muted); font-size: 12px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 800; padding: 8px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; background: #fff; position: sticky; top: 0; }
    .tbl th.nr, .tbl td.nr { text-align: right; }
    .tbl th.sorted::after { content: ' ▾'; } .tbl th.sorted.asc::after { content: ' ▴'; }
    .tbl td { padding: 8px 8px; border-bottom: 1px solid #EEF1F5; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tbl tr.tap { cursor: pointer; } .tbl tr.tap:hover td { background: #F5F8FD; }
    .tbl tfoot td { font-weight: 800; border-top: 1.5px solid var(--line); }
    .tscroll { overflow: auto; max-height: 560px; border-radius: 12px; }
    .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--s1); vertical-align: middle; margin-left: 6px; }
    .muted2 { color: var(--muted); font-size: 12px; }
    .flag { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
    .flag.est { background: var(--warn-bg); color: var(--warn); } .flag.bad { background: var(--bad-bg); color: var(--bad); } .flag.ok { background: var(--ok-bg); color: var(--ok); }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--char); margin: 4px 0 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tip { position: absolute; pointer-events: none; background: #1B2430; color: #fff; font-size: 12.5px; padding: 8px 10px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; z-index: 5; transform: translate(-50%, -100%); margin-top: -10px; }
    .tip b { display: block; margin-bottom: 2px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .filters { position: static; } }
    .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; margin-top: 8px; }
    .search { max-width: 260px; }
    .hb { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
    .hb .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 600; }
    .hb .lb small { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .hb .tr { height: 14px; background: #F0F3F8; border-radius: 4px; position: relative; cursor: pointer; }
    .hb .fl { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
    .hb .vl { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12.5px; }
    .hb .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
    .more { margin-top: 8px; }
    .split { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: #fff; }
    .split div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; min-width: 2px; }
    .splitlg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; margin-top: 6px; color: var(--char); }
    .splitlg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    details.tv { margin-top: 12px; }
    details.tv > summary { cursor: pointer; font-weight: 800; color: var(--blue); font-size: 13px; list-style: none; padding: 6px 0; }
    details.tv > summary::before { content: '▸ '; } details.tv[open] > summary::before { content: '▾ '; }
    .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cgrid .sec { margin-top: 0; }
    .sec.card { margin-top: 14px; }
    .chipscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    @media (max-width: 820px) {
      .cgrid { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi { padding: 10px 11px; } .kpi .v { font-size: 20px; } .kpi .s { font-size: 11px; }
      .frow .input { flex: 1 1 40%; min-width: 0; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
      .frow { flex-wrap: wrap; }
      .card { padding: 12px; }
      .hb { grid-template-columns: minmax(80px, 38%) 1fr auto; font-size: 12.5px; }
    }
    .empty { padding: 30px; text-align: center; color: var(--muted); }

    /* ===== Look v2 — fleet board, Barlow (highway-signage) type, quiet panels ===== */
    body { font-family: Barlow, system-ui, sans-serif; background: #EEF1F5; }
    .viz { --st-load: #1565D8; --st-ret: #12936A; --st-wait: #D48A00; --st-off: #B9061E; --panel: #fff; --rule: #E3E8EF; }
    .num-f, .kpi .v, .fs .b b, .donebox .v, .bigno { font-family: 'Barlow Condensed', Barlow, sans-serif; letter-spacing: 0; }
    .filters { background: #EEF1F5; }
    .fbar { gap: 6px; }
    .sel { border: 1px solid var(--rule); border-radius: 10px; box-shadow: none; padding: 5px 28px 5px 10px; }
    .sel span { text-transform: none; letter-spacing: 0; font-size: 11.5px; font-weight: 600; }
    .sel select, .sel input[type=date] { font-size: 15px; font-weight: 700; }
    .sel.view { background: #022A5B; border-color: #022A5B; }
    .sharebtn { background: #F7821A; box-shadow: none; border-radius: 10px; font-size: 15px; }
    #rangeTxt { font-size: 13px; }
    .card, .sec.card { border: 1px solid var(--rule); box-shadow: none; border-radius: 14px; }
    .sec h2 { font-family: 'Barlow Condensed', Barlow, sans-serif; font-size: 19px; font-weight: 700; color: #022A5B; letter-spacing: .1px; }
    .sec h2::before { display: none; }
    .sec h2 small { font-family: Barlow, sans-serif; font-size: 13px; }
    /* headline numbers: one panel, hairline dividers */
    .kpis { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; gap: 0; overflow: hidden; margin-top: 14px; }
    .kpi { border: 0; border-radius: 0; box-shadow: none; background: transparent; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 12px 14px; }
    .kpi::before { display: none; }
    .kpi .l { color: #4A5566; font-size: 13px; font-weight: 600; }
    .kpi .v { font-size: 30px; font-weight: 700; color: #022A5B; }
    .kpi .s { font-size: 12px; }
    .kpi.tap .l::after { content: ' ›'; color: #F7821A; }
    .kpi.sel1 { outline: none; background: #FFF6EC; }
    .kpis .drill { border-bottom: 1px solid var(--rule); background: #FBFCFE; }
    .kpis .drill .sec.card { border: 0; margin: 0; background: transparent; }
    /* fleet board */
    .fleet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .fleet-head .bigno { font-size: 44px; font-weight: 700; color: #022A5B; line-height: 1; }
    .fleet-head .bigno small { font-family: Barlow, sans-serif; font-size: 15px; font-weight: 600; color: #4A5566; margin-left: 6px; }
    .lanes { display: grid; gap: 12px; margin-top: 14px; }
    .lane { border-top: 3px solid var(--c); padding-top: 8px; }
    .lane-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; cursor: pointer; }
    .lane-h b { font-size: 15px; color: #1B2430; } .lane-h b i { font-style: normal; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: var(--c); margin-right: 6px; }
    .lane-h span { font-size: 13px; color: #4A5566; font-weight: 600; white-space: nowrap; }
    .chips2 { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .tk { white-space: nowrap; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; line-height: 1; padding: 6px 7px 5px; border-radius: 6px; background: color-mix(in srgb, var(--c) 12%, #fff); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 35%, #fff); cursor: pointer; }
    .tk small { font-family: Barlow, sans-serif; font-weight: 600; font-size: 10px; opacity: .8; margin-left: 3px; }
    .tk.sel { background: var(--c); color: #fff; }
    .tkinfo { margin-top: 10px; background: #F7F9FC; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
    .capbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 12px; background: #fff; }
    .capbar div { min-width: 2px; }
    .fs { display: none; }
    @media (min-width: 821px) { .lanes { grid-template-columns: repeat(4, 1fr); } .kpis { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 820px) { .kpis { grid-template-columns: 1fr 1fr; gap: 0; } .kpi .v { font-size: 26px; } .fleet-head .bigno { font-size: 38px; } }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap viz">
    <div class="filters">
      <div class="fbar">
        <label class="sel date"><span>From</span><input type="date" id="from"></label>
        <label class="sel date"><span>To</span><input type="date" id="to"></label>
      </div>
      <div class="fbar" style="margin-top:8px">
        <label class="sel"><span>Load</span><select id="fLoadSel"><option value="All">All</option><option value="BULK">Bulk</option><option value="BAG">Bag</option></select></label>
        <label class="sel"><span>Size</span><select id="fSizeSel"><option value="All">All</option></select></label>
      </div>
      <div class="fbar" style="margin-top:8px">
        <label class="sel view"><span>View</span><select id="viewSel"></select></label>
        <button class="sharebtn" id="shareRep" type="button" title="Share report on WhatsApp">📲 Report</button>
      </div>
      <div class="muted2" id="rangeTxt" style="margin-top:6px"></div>
    </div>
    <div id="status" class="empty">Loading…</div>
    <div id="view"></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  JNP.header($('hdr'), 'Dashboard', 'डैशबोर्ड · ऑपरेशन्स + R&M');
  const ctx = await JNP.requireModule(['OPS-01', 'RM-01', 'RM-02', 'FIN-01', 'FIN-02', 'APR-01']);
  if (ctx.user.level === 'Level 3') { $('status').textContent = 'Dashboard is for HO and department heads.'; return; }

  // ---------- helpers
  const CLASSES = [12, 25, 31, 35, 42];
  const classOf = cap => { cap = Number(cap); if (!cap) return 'Other'; let b = CLASSES[0]; CLASSES.forEach(c => { if (Math.abs(c - cap) < Math.abs(b - cap)) b = c; }); return b + 'T'; };
  const CLASS_COLOR = { '12T': 'var(--s1)', '25T': 'var(--s2)', '31T': 'var(--s3)', '35T': 'var(--s4)', '42T': 'var(--s5)', Other: '#9AA4B2' };
  // dates may arrive as 2026-10-16, 2026-10-16T10:00, or as typed in the sheet: 16/10/2026 10:00, 16-10-2026
  const DMY = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?:[ T,]+(\d{1,2}):(\d{2}))?/;
  const isoOf = v => { const m = String(v || '').trim().match(DMY); if (!m) return v; const p = n => String(n).padStart(2, '0'); return m[3] + '-' + p(m[2]) + '-' + p(m[1]) + (m[4] ? 'T' + p(m[4]) + ':' + m[5] : ''); };
  const D = v => { if (!v) return null; const s = String(isoOf(v)).trim().replace(' ', 'T'); const d = new Date(s.length <= 10 ? s + 'T00:00:00' : s); return isNaN(d) ? null : d; };
  const hrs = (a, b) => (b - a) / 36e5;
  const n0 = v => (Number(v) || 0);
  const fmt = (v, d) => v === '' || v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString('en-IN', { maximumFractionDigits: d === undefined ? 0 : d, minimumFractionDigits: 0 });
  const inr = v => v === '' || v === null || v === undefined || isNaN(v) ? '—' : '₹' + fmtShort(v);
  function fmtShort(v) { v = Number(v); const a = Math.abs(v); if (a >= 1e7) return (v / 1e7).toFixed(2) + ' Cr'; if (a >= 1e5) return (v / 1e5).toFixed(2) + ' L'; return Math.round(v).toLocaleString('en-IN'); }
  const pct = v => isNaN(v) || v === null ? '—' : Math.round(v * 100) + '%';
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
  const sum = (a, f) => a.reduce((s, x) => s + (f ? n0(f(x)) : n0(x)), 0);
  const rows = t => (t && t.rows || []).map(r => { const o = {}; t.cols.forEach((c, i) => o[c] = r[i]); return o; });
  const iso = d => { const x = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return x.toISOString().slice(0, 10); };

  // ---------- filters
  const today = new Date();
  $('to').value = iso(today); $('from').value = iso(new Date(today.getTime() - 29 * 864e5));
  $('fSizeSel').innerHTML = '<option value="All">All sizes</option>' + CLASSES.map(c => '<option value="' + c + 'T">' + c + ' T</option>').join('');
  let fLoad = 'All', fSize = 'All';
  let tmrLoad;
  const onDate = () => { clearTimeout(tmrLoad); tmrLoad = setTimeout(() => { if ($('from').value && $('to').value && !(RAW && RAW.from === $('from').value && RAW.to === $('to').value)) { if ($('from').value > $('to').value) { const x = $('from').value; $('from').value = $('to').value; $('to').value = x; } load(); } }, 400); };
  ['change', 'input', 'blur'].forEach(ev => { $('from').addEventListener(ev, onDate); $('to').addEventListener(ev, onDate); });
  $('fLoadSel').onchange = () => { fLoad = $('fLoadSel').value; render(); };
  $('fSizeSel').onchange = () => { fSize = $('fSizeSel').value; render(); };

  const TABS = [{ id: 'overview', label: '📊 Overview' }, { id: 'trips', label: '🚚 Trips & destinations' }, { id: 'trucks', label: '🛻 Trucks' }, { id: 'drivers', label: '🧑‍✈️ Drivers' },
    { id: 'dest', label: '📍 Destination performance' }, { id: 'fleet', label: '🔧 Fleet health & off-road' }, { id: 'diesel', label: '⛽ Diesel' }];
  let tab = JNP.param('tab') || 'overview', RAW = null, M = null, drillKey = '', fsSel = '';
  $('viewSel').innerHTML = TABS.map(t => '<option value="' + t.id + '"' + (t.id === tab ? ' selected' : '') + '>' + t.label + '</option>').join('');
  $('viewSel').onchange = () => { tab = $('viewSel').value; render(); window.scrollTo(0, 0); };
  $('shareRep').onclick = () => { if (M) JNP.whatsapp(report()); };
  const MONEY = () => RAW && RAW.access === 'full';

  // ---------- data
  async function load() {
    $('status').classList.remove('hidden'); $('status').textContent = 'Loading data…'; $('view').innerHTML = ''; $('rangeTxt').textContent = 'Loading ' + JNP.dmy($('from').value) + ' to ' + JNP.dmy($('to').value) + '…';
    try { RAW = await JNP.call('dash', { from: $('from').value, to: $('to').value }); M = model(RAW); render(); }
    catch (e) { $('status').innerHTML = '<span class="err">' + E(e.message) + '</span>'; }
  }

  const M_DAYS_BACK = 35;
  function model(R) {
    // turn any day-first text dates from the sheets into ISO so every calculation below can read them
    Object.keys(R).forEach(k => { const t = R[k]; if (!t || !t.cols || !t.rows) return; t.cols.forEach((c, i) => { if (/(_At|Date)$/.test(c)) t.rows.forEach(r => { if (typeof r[i] === 'string' && DMY.test(r[i])) r[i] = isoOf(r[i]); }); }); });
    const from = D(R.from), to = new Date(D(R.to).getTime() + 864e5 - 1), now = new Date(), end = to < now ? to : now;
    const days = Math.round((D(R.to) - D(R.from)) / 864e5) + 1;
    // ---- truck master: match numbers whatever the spacing; read "31 Ton" as 31
    const capNum = v => { const m = String(v === null || v === undefined ? '' : v).match(/\d+(\.\d+)?/); return m ? Number(m[0]) : ''; };
    R.trucks.forEach(t => { t.no = JNP.normTruck(t.no); t.cap = capNum(t.cap); });
    const truckM = {}; R.trucks.forEach(t => truckM[t.no] = t);

      '<div class="splitlg" style="flex-direction:column;gap:6px">' + parts.filter(p => p.value).map(p => '<span><i style="background:' + p.color + '"></i><b>' + E(p.label) + '</b> · ' + (p.text || fmt(p.value, 1)) + ' (' + Math.round(100 * p.value / t) + '%)</span>').join('') + '</div></div>';
  }
  // stacked bar per class, Bulk vs Bag segments
  function stackByClass(T, f, txt) {
    const CL = CLASSES.map(c => c + 'T').concat(['Other']);
    const rowsC = CL.map(c => ({ c, bulk: sum(T.filter(x => x.cls === c && x.load === 'BULK'), f), bag: sum(T.filter(x => x.cls === c && x.load === 'BAG'), f) })).filter(r => r.bulk + r.bag);
    const mx = Math.max(1, ...rowsC.map(r => r.bulk + r.bag));
    return '<div class="legend"><span><i style="background:var(--s1)"></i>Bulk</span><span><i style="background:var(--s2)"></i>Bag</span></div><div class="stk">' + rowsC.map(r =>
      '<b>' + r.c + '</b><div class="bars" style="width:' + (100 * (r.bulk + r.bag) / mx) + '%">' + (r.bulk ? '<div style="flex:' + r.bulk + ';background:var(--s1)" title="Bulk ' + E(txt(r.bulk)) + '"></div>' : '') + (r.bag ? '<div style="flex:' + r.bag + ';background:var(--s2)" title="Bag ' + E(txt(r.bag)) + '"></div>' : '') + '</div><span class="vl" style="font-weight:800;font-size:12.5px">' + txt(r.bulk + r.bag) + '</span>').join('') + '</div>';
  }
  const STATE = { off: { t: 'Off road', c: 'down' }, load: { t: 'Loaded · on the way', c: 'ld' }, ret: { t: 'Returning empty', c: 'rt' }, wait: { t: 'Waiting for load', c: 'wt' } };
  let tkSel = '';
  function fleetStatus() {
    const fl = M.fleet.filter(t => keepTruck(t.no)), g = k => fl.filter(t => (M.status[t.no] || {}).st === k), tons = a => sum(a, t => t.cap);
    const totT = tons(fl), on = fl.filter(t => (M.status[t.no] || {}).st !== 'off');
    const LANES = [['load', 'Loaded, on the way', 'var(--st-load)'], ['ret', 'Returning empty', 'var(--st-ret)'], ['wait', 'Waiting for load', 'var(--st-wait)'], ['off', 'Off road', 'var(--st-off)']];
    const shortWhy = w => w === 'Driver not available' ? 'no driver' : w === 'Documents / RTO' ? 'documents' : String(w || '').toLowerCase();
    const lane = ([k, label, c]) => {
      const list = g(k).sort((p, q) => (q.cap || 0) - (p.cap || 0));
      const why = {}; if (k === 'off') list.forEach(t => { const w = shortWhy(M.status[t.no].why); why[w] = (why[w] || 0) + 1; });
      return '<div class="lane" style="--c:' + c + '"><div class="lane-h"><b><i>' + list.length + '</i>' + label + '</b><span>' + fmt(tons(list)) + ' T</span></div>' +
        (k === 'off' && list.length ? '<div class="muted2" style="margin-top:2px">' + Object.keys(why).map(w => w + ' ' + why[w]).join(', ') + '</div>' : '') +
        '<div class="chips2">' + list.map(t => '<span class="tk' + (tkSel === t.no ? ' sel' : '') + '" data-t="' + E(t.no) + '" title="' + E(t.no) + '">' + E(t.no.slice(-4)) + '<small>' + (t.cap ? t.cap + 'T' : '?') + '</small></span>').join('') + '</div></div>';
    };
    let info = '';
    if (tkSel && M.status[tkSel]) {
      const t = M.truckM[tkSel] || {}, s0 = M.status[tkSel];
      info = '<div class="tkinfo"><b>' + E(tkSel) + '</b> · ' + (t.cap ? t.cap + ' T ' : '') + E(t.cargo || '') + '<br>' +
        (s0.st === 'off' ? E(s0.why + (s0.note ? ' — ' + s0.note : '') + (s0.loc ? ', ' + s0.loc : '') + (s0.since ? ', since ' + JNP.dmy(iso(s0.since)) : ''))
          : s0.last ? E('Loaded for ' + s0.last.dest + ' on ' + JNP.dmy(iso(s0.last.at)) + ', ' + fmt(s0.el, 0) + ' h ago (usual round trip ' + fmt(s0.R, 0) + ' h). Driver ' + s0.last.driver + (s0.del ? '. Unloaded.' : ''))
          : E(s0.note || 'No loading recorded recently')) + '</div>';
    }
    setTimeout(() => { const el = $('lanes'); if (el) el.onclick = e => { const c = e.target.closest('.tk'); if (!c) return; tkSel = tkSel === c.dataset.t ? '' : c.dataset.t; render(); }; }, 0);
    const miss = fl.filter(t => !t.cap);
    return '<div class="sec card"><div class="fleet-head"><div class="bigno">' + on.length + '<small>of ' + fl.length + ' trucks on road</small></div>' +
      '<div style="text-align:right"><div style="font-weight:700;color:#022A5B">' + fmt(tons(on)) + ' of ' + fmt(totT) + ' T on road (' + pct(totT ? tons(on) / totT : NaN) + ')</div><div class="muted2">' + (M.isNow ? 'Right now' : 'On ' + JNP.dmy(RAW.to)) + ' · tap a truck for details</div></div></div>' +
      '<div class="capbar" title="Capacity by state">' + LANES.map(([k, l, c]) => tons(g(k)) ? '<div style="flex:' + tons(g(k)) + ';background:' + c + '" title="' + l + ': ' + fmt(tons(g(k))) + ' T"></div>' : '').join('') + '</div>' +
      '<div class="lanes" id="lanes">' + LANES.map(lane).join('') + '</div>' + info +
      (miss.length ? '<div class="note">No capacity in Truck_Master for ' + miss.map(t => E(t.no)).join(', ') + ' — shown as “?” and counted as 0 T.</div>' : '') +
      '<div class="muted2" style="margin-top:10px">Loaded means loaded within half of that destination’s usual round trip (loading to next loading) and not yet unloaded.</div></div>';
  }

  function overview(T) {
    const a = agg(T), fleet = M.fleet.filter(t => keepTruck(t.no)), activeTrucks = new Set(T.map(x => x.truck)).size;
    const bds = M.bds.filter(b => keepTruck(b.Truck_No) && b.rm), downH = sum(bds, b => b.inHrs);
    const offDrv = M.bds.filter(b => keepTruck(b.Truck_No) && b.Off_Road_Type === 'Driver not available');
    const availDays = fleet.length * M.days - downH / 24;
    const spend = sum(M.mnt.filter(m => keepTruck(m.Truck_No)), m => m.Total_Cost) + sum(M.tex.filter(m => keepTruck(m.Truck_No)), m => m.Amount) + sum(M.tyr.filter(m => keepTruck(m.Truck_No)), m => m.Cost);
    const dates = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 864e5)) dates.push(iso(d));
    const by = (lt) => dates.map(d => T.filter(x => x.day === d && x.load === lt).length);
    const bulk = T.filter(x => x.load === 'BULK'), bag = T.filter(x => x.load === 'BAG');
    const DR = {
      trips: { f: () => 1, txt: v => fmt(v), title: 'Trips', centre: [fmt(a.trips), 'trips'] },
      mt: { f: x => x.mt, txt: v => fmt(v, 0) + ' MT', title: 'MT carried', centre: [fmt(a.mt, 0), 'MT'] },
      rev: { f: x => x.rev, txt: v => inr(v), title: 'Freight revenue', centre: [inr(a.rev), 'freight'] },
      diesel: { f: x => x.diesel, txt: v => fmt(v) + ' L', title: 'Diesel', centre: [fmt(a.diesel), 'litres'] },
    };
    const card = (k, l, v, sub, col) => '<div class="kpi tap' + (drillKey === k ? ' sel1' : '') + '" data-d="' + k + '" style="--k:' + col + '"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + sub + '</div></div>';
    let drill = '';
    if (drillKey && DR[drillKey]) {
      const d = DR[drillKey];
      drill = '<div class="drill">' + sec(d.title, 'split — tap the card again to close', '<div class="cgrid"><div>' + donut([{ label: 'Bulk', value: sum(bulk, d.f), color: 'var(--s1)', text: d.txt(sum(bulk, d.f)) }, { label: 'Bag', value: sum(bag, d.f), color: 'var(--s2)', text: d.txt(sum(bag, d.f)) }], d.centre) + '</div><div><div class="muted2" style="margin-bottom:6px">By truck size</div>' + stackByClass(T, d.f, d.txt) + '</div></div>') + '</div>';
    }
    setTimeout(() => { const k = $('kp'); if (k) k.onclick = e => { const c = e.target.closest('.kpi.tap'); if (!c) return; drillKey = drillKey === c.dataset.d ? '' : c.dataset.d; render(); }; }, 0);
    return fleetStatus() + '<div class="kpis" id="kp">' +
      card('trips', 'Trips', fmt(a.trips), activeTrucks + ' trucks · Bulk ' + bulk.length + ' / Bag ' + bag.length, 'var(--blue)') +
      card('mt', 'MT carried', fmt(a.mt, 0), a.est ? a.est + ' trips without builty' : 'from builty', 'var(--blue)') +
      (MONEY() ? card('rev', 'Freight revenue', inr(a.rev), 'Bulk ' + inr(sum(bulk, x => x.rev)) + ' · Bag ' + inr(sum(bag, x => x.rev)), 'var(--orange)') : '') +
      (MONEY() ? card('diesel', 'Revenue / litre', isNaN(revPerL(a)) ? '—' : '₹' + fmt(revPerL(a), 1), fmt(a.diesel) + ' L · diesel on ' + pct(a.trips ? a.dieselTrips / a.trips : NaN) + ' trips', 'var(--orange)') : card('diesel', 'Diesel', fmt(a.diesel) + ' L', 'on ' + a.dieselTrips + ' trips', 'var(--orange)')) +
      drill +
      kpi('Truck fill', pct(a.cap ? a.mt / a.cap : NaN), 'MT loaded ÷ capacity of trucks that loaded', 'var(--navy)') +
      kpi('Fleet utilisation', pct(availDays ? a.busy / availDays : NaN), fmt(a.busy, 0) + ' of ' + fmt(availDays, 0) + ' truck-days busy', 'var(--navy)') +
      kpi('Avg rotation', dd(a.rot), 'loading → next loading', 'var(--blue)') +
      kpi('Delivery TAT', h1(a.tat), 'on time ' + pct(a.onTime), 'var(--blue)') +
      kpi('Breakdown downtime', fmt(downH, 0) + ' h', bds.length + ' breakdowns · uptime ' + pct(fleet.length ? 1 - downH / (fleet.length * M.days * 24) : NaN), 'var(--red)') +
      kpi('No-driver days', fmt(sum(offDrv, b => b.inHrs) / 24, 1), offDrv.length + ' trucks off road for want of a driver', 'var(--red)') +
      (MONEY() ? kpi('Maintenance spend', inr(spend), 'jobs + expenses + tyres', 'var(--red)') : '') +
      kpi('Repeat faults', fmt(repeats(M.bds.filter(b => keepTruck(b.Truck_No)), M.mnt.filter(m => keepTruck(m.Truck_No))).length), 'same truck + fault', 'var(--red)') +
      '</div>' +
      sec('Trips per day', 'Bulk vs Bag', columns('cDaily', dates, [{ name: 'Bulk', color: 'var(--s1)', values: by('BULK') }, { name: 'Bag', color: 'var(--s2)', values: by('BAG') }], { unit: 'trips', label: d => d.slice(8, 10) + '/' + d.slice(5, 7), title: 'Trips per day' })) +
      '<div class="cgrid">' +
      sec('Trips by size', 'Bulk vs Bag in each size', stackByClass(T, () => 1, v => fmt(v))) +
      (MONEY() ? sec('Revenue per litre', 'by size', hbar(CLASSES.map(c => c + 'T').map(c => { const g = agg(T.filter(x => x.cls === c)); return { label: c, sub: g.trips && g.dieselTrips / g.trips < .7 ? 'diesel on ' + pct(g.dieselTrips / g.trips) + ' trips' : '', value: revPerL(g), color: CLASS_COLOR[c], text: isNaN(revPerL(g)) ? '—' : '₹' + fmt(revPerL(g), 1) }; }), { ref: revPerL(a), refLabel: 'fleet average ₹' + fmt(revPerL(a), 1) + ' / L' })) : sec('MT by size', '', stackByClass(T, x => x.mt, v => fmt(v, 0) + ' MT'))) +
      '</div>';
  }

  // WhatsApp report — same layout as the daily "vehicles not on road" message
  function report() {
    const fl = M.fleet.filter(t => keepTruck(t.no)), T = M.trips.filter(keepT), a = agg(T), st = t => M.status[t.no] || {};

    const L = [], short = no => String(no).slice(-4), d2 = d => d ? JNP.dmy(iso(d)).slice(0, 5) : '';
    L.push('*JNP FLEET REPORT · ' + JNP.dmy(iso(M.asOf)) + '*');
    if (fSize !== 'All' || fLoad !== 'All') L.push('Filter: ' + [fSize !== 'All' ? fSize : '', fLoad !== 'All' ? fLoad : ''].filter(Boolean).join(' · '));
    L.push('————————');
    L.push('🚚 Fleet: ' + fl.length + ' trucks · ' + fmt(tons(fl)) + ' T');
    L.push('✅ On road: ' + on.length + '  (Loaded ' + n('load') + ' · Returning ' + n('ret') + ' · Waiting ' + n('wait') + ')');

      Object.keys(grp).sort((p, q) => (parseInt(p) || 999) - (parseInt(q) || 999)).forEach(k => {

        grp[k].forEach(t => { const s0 = st(t); L.push(' ' + short(t.no) + ' – ' + (s0.why === 'Driver not available' ? 'No driver' : s0.why) + (s0.note && s0.note.indexOf('Truck_Master') < 0 ? ' – ' + s0.note : '') + (s0.loc ? ' – ' + s0.loc : '') + (s0.since ? ' – ' + d2(s0.since) : '')); });
      });

      L.push(''); L.push('Total down: ' + off.length + ' trucks · Bag ' + fmt(tons(off.filter(t => (t.cargo || 'BAG') === 'BAG'))) + ' T · Bulk ' + fmt(tons(off.filter(t => t.cargo === 'BULK'))) + ' T');
    }
    L.push('————————');
    L.push('📦 Trips ' + JNP.dmy(RAW.from).slice(0, 5) + ' to ' + JNP.dmy(RAW.to).slice(0, 5) + ': ' + a.trips + ' · ' + fmt(a.mt, 0) + ' MT');
    L.push('  Bulk ' + T.filter(x => x.load === 'BULK').length + ' · Bag ' + T.filter(x => x.load === 'BAG').length);
    L.push('  ' + CLASSES.map(c => c + 'T').map(c => [c, T.filter(x => x.cls === c).length]).filter(x => x[1]).map(x => x[0] + ' ' + x[1]).join(' · '));

  function tripsView(T) {
    const q = (window.__tq || '').toUpperCase();
    const data = T.filter(x => !q || [x.lr, x.truck, x.driver, x.dest, x.consignee].join(' ').toUpperCase().indexOf(q) >= 0)
      .map(x => Object.assign({}, x, { date: x.day, tatv: x.tat }));
    const a = agg(data);
    const destSum = {}; data.forEach(x => { const d = destSum[x.dest] = destSum[x.dest] || { dest: x.dest, trips: 0, mt: 0, rev: 0, trucks: new Set() }; d.trips++; d.mt += x.mt; d.rev += x.rev; d.trucks.add(x.truck); });
    const ds = Object.values(destSum).map(d => Object.assign(d, { tcount: d.trucks.size }));
    const dates = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 864e5)) dates.push(iso(d));
    setTimeout(() => { const s = $('tq'); if (s) { s.oninput = () => { window.__tq = s.value; const p = s.selectionStart; render(); const n = $('tq'); n.focus(); n.setSelectionRange(p, p); }; } const c = $('csv'); if (c) c.onclick = () => csv(data); }, 0);
    return '<div class="card"><div class="frow"><input id="tq" class="input search" style="max-width:none;flex:1" placeholder="Search LR, truck, driver, destination, party" value="' + E(window.__tq || '') + '"><button class="chip sm" id="csv">⬇ CSV</button></div>' +
      '<div class="kpis">' + kpi('Trips', fmt(a.trips)) + kpi('MT', fmt(a.mt, 1)) + $m(kpi('Revenue', inr(a.rev), '', 'var(--orange)')) + kpi('Destinations', ds.length, '', 'var(--navy)') + '</div></div>' +
      sec('Loaded for', 'destination-wise · ' + JNP.dmy(RAW.from) + ' to ' + JNP.dmy(RAW.to), hbar(ds.map(d => ({ label: d.dest, sub: d.tcount + ' trucks · ' + fmt(d.mt, 0) + ' MT', value: d.trips, text: fmt(d.trips) + ' trips', tip: d.dest + ': ' + d.trips + ' trips, ' + fmt(d.mt, 1) + ' MT, ' + inr(d.rev) })), { top: 12 }) +
        tv('Table view', table('tDs', [{ k: 'dest', t: 'Destination' }, { k: 'trips', t: 'Trips', num: 1, bar: 1 }, { k: 'tcount', t: 'Trucks', num: 1 }, { k: 'mt', t: 'MT', num: 1, f: v => fmt(v, 1) }, { k: 'rev', t: 'Revenue', num: 1, f: inr }], ds, { sort: 'trips' }))) +

      sec('Trip log', a.trips + ' trips · tap a heading to sort', '<details class="tv" open><summary>Show trips</summary>' +
        table('tTrips', [{ k: 'date', t: 'Date', f: v => JNP.dmy(v) }, { k: 'lr', t: 'LR' }, { k: 'truck', t: 'Truck' }, { k: 'dest', t: 'Destination' }, { k: 'driver', t: 'Driver' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'load', t: 'Load', f: v => v === 'BULK' ? 'Bulk' : 'Bag' },
          { k: 'consignee', t: 'Party' }, { k: 'mt', t: 'MT', num: 1, f: (v, r) => fmt(v, 2) + (r.mtEst ? '<span class="flag est">est</span>' : '') },
          { k: 'rate', t: 'Rate', num: 1 }, { k: 'rev', t: 'Revenue', num: 1, f: inr }, { k: 'diesel', t: 'Diesel L', num: 1 }, { k: 'tatv', t: 'Delivery TAT', num: 1, f: (v, r) => isNaN(v) ? '<span class="muted2">not delivered</span>' : h1(v) + (r.targetTat && v > r.targetTat ? '<span class="flag bad">late</span>' : '') },
          { k: 'shortKg', t: 'Short kg', num: 1, f: v => v > 0 ? '<b style="color:var(--red)">' + v + '</b>' : '' }], data, { sort: 'date' }) + '</details>');
  }
  function csv(data) {
    const cols = ['day', 'lr', 'truck', 'cls', 'load', 'driver', 'dest', 'consignee', 'mt', 'rate', 'rev', 'diesel', 'adv', 'tat', 'shortKg'];

  }

  function trucks(T) {
    const fleet = M.fleet.filter(t => keepTruck(t.no));
    const data = fleet.map(t => {
      const tt = T.filter(x => x.truck === t.no), g = agg(tt), b = M.bds.filter(x => x.Truck_No === t.no), last = M.lastTrip['T' + t.no];
      const spend = sum(M.mnt.filter(m => m.Truck_No === t.no), m => m.Total_Cost) + sum(M.tex.filter(m => m.Truck_No === t.no), m => m.Amount) + sum(M.tyr.filter(m => m.Truck_No === t.no), m => m.Cost);
      return { truck: t.no, cls: classOf(t.cap), status: t.status, trips: g.trips, mt: g.mt, rev: g.rev, km: g.km, diesel: g.diesel, kmpl: g.kmDiesel ? g.km / g.kmDiesel : NaN, rpl: revPerL(g),
        rot: g.rot, idleNow: last ? (M.end - last.at) / 864e5 : NaN, waitAfterUnload: avg(tt.map(x => x.truckIdle).filter(v => !isNaN(v) && v >= 0 && v < 15 * 24)),
        down: sum(b, x => x.inHrs), bds: b.length, spend: spend, rpt: b.filter(x => x.Repeat_Flag === 'Yes').length + M.mnt.filter(m => m.Truck_No === t.no && m.Repeat_Flag === 'Yes').length };
    });
    const idle = data.filter(r => isNaN(r.idleNow) || r.idleNow > 1).map(r => { const s0 = M.status[r.truck] || {}, off = s0.st === 'off';
      return { label: r.truck, sub: r.cls + (off ? ' · ' + (s0.why === 'Driver not available' ? 'no driver' : s0.why.toLowerCase()) : ''), value: isNaN(r.idleNow) ? M.days : r.idleNow, color: off ? '#9AA4B2' : 'var(--red)', text: (isNaN(r.idleNow) ? 'no trip' : fmt(r.idleNow, 1) + ' d') + (off ? ' · off road' : '') }; });
    return '<div class="cgrid">' +

      $m(sec('₹ earned per litre', 'by class', hbar(cls.map(r => ({ label: r.cls, sub: r.cov < .7 ? 'diesel on ' + pct(r.cov) + ' trips' : '', value: r.rpl, color: CLASS_COLOR[r.cls], text: isNaN(r.rpl) ? '—' : '₹' + fmt(r.rpl, 1) })), { ref: avgR, refLabel: 'fleet average ₹' + fmt(avgR, 1) }))) +
      sec('KM per litre', 'by class', hbar(cls.filter(r => !isNaN(r.kmpl)).map(r => ({ label: r.cls, value: r.kmpl, color: CLASS_COLOR[r.cls], text: fmt(r.kmpl, 2) })))) +
      $m(sec('₹ per litre — lowest trucks', 'check these first', hbar(tr.filter(r => !isNaN(r.rpl)).map(r => ({ label: r.truck, sub: r.cls + (r.cov < .7 ? ' · low diesel entry' : ''), value: r.rpl, color: CLASS_COLOR[r.cls], text: '₹' + fmt(r.rpl, 1) })), { top: 10, asc: true, ref: avgR, refLabel: 'fleet average' }))) +
      $m(sec('₹ per litre — best trucks', '', hbar(tr.filter(r => !isNaN(r.rpl)).map(r => ({ label: r.truck, sub: r.cls, value: r.rpl, color: CLASS_COLOR[r.cls], text: '₹' + fmt(r.rpl, 1) })), { top: 10, ref: avgR, refLabel: 'fleet average' }))) +
      '</div>' +
      sec('By class', '', tv('Table view', table('tDc', [{ k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1 }, { k: 'diesel', t: 'Diesel L', num: 1, f: v => fmt(v) }, { k: 'lpt', t: 'L / trip', num: 1, f: v => fmt(v, 0) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'rpl', t: '₹ per litre', num: 1, f: v => isNaN(v) ? '—' : '₹' + fmt(v, 1) }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'cov', t: 'Trips with diesel', num: 1, f: v => v < .7 ? '<span class="flag est">' + pct(v) + '</span>' : pct(v) }], cls, { sort: 'cls' }))) +
      sec('By truck', '', tv('Table view', table('tDt', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1 }, { k: 'diesel', t: 'Diesel L', num: 1, f: v => fmt(v) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'rpl', t: '₹ per litre', num: 1, f: v => isNaN(v) ? '—' : '₹' + fmt(v, 1) }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'cov', t: 'Trips with diesel', num: 1, f: v => v < .7 ? '<span class="flag est">' + pct(v) + '</span>' : pct(v) }], tr, { sort: 'rpl' })));
  }

  load();
})();
</script>
