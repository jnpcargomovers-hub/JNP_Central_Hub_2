<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Dashboard · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .wrap { max-width: 1180px; }
    .viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #E6EBF2; }
    .filters { position: sticky; top: 66px; z-index: 15; background: var(--bg); padding: 10px 0 6px; }
    .frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .frow .input { width: auto; padding: 8px 10px; min-height: 0; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1.5px solid #CCD5E2; background: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; color: var(--char); cursor: pointer; }
    .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .chip.sm { padding: 4px 10px; font-size: 12.5px; }
    .flabel { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 12px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k, var(--blue)); }
    .kpi .l { font-size: 12px; color: var(--muted); font-weight: 700; }
    .kpi .v { font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1.15; margin-top: 2px; letter-spacing: -.3px; }
    .kpi .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .sec { margin-top: 18px; }
    .sec h2 { font-size: 15px; color: var(--navy); margin: 0 0 8px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .sec h2::before { content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--orange); }
    .sec h2 small { font-weight: 600; color: var(--muted); font-size: 12px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 800; padding: 8px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; background: #fff; position: sticky; top: 0; }
    .tbl th.nr, .tbl td.nr { text-align: right; }
    .tbl th.sorted::after { content: ' ▾'; } .tbl th.sorted.asc::after { content: ' ▴'; }
    .tbl td { padding: 8px 8px; border-bottom: 1px solid #EEF1F5; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tbl tr.tap { cursor: pointer; } .tbl tr.tap:hover td { background: #F5F8FD; }
    .tbl tfoot td { font-weight: 800; border-top: 1.5px solid var(--line); }
    .tscroll { overflow: auto; max-height: 560px; border-radius: 12px; }
    .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--s1); vertical-align: middle; margin-left: 6px; }
    .muted2 { color: var(--muted); font-size: 12px; }
    .flag { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
    .flag.est { background: var(--warn-bg); color: var(--warn); } .flag.bad { background: var(--bad-bg); color: var(--bad); } .flag.ok { background: var(--ok-bg); color: var(--ok); }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--char); margin: 4px 0 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tip { position: absolute; pointer-events: none; background: #1B2430; color: #fff; font-size: 12.5px; padding: 8px 10px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; z-index: 5; transform: translate(-50%, -100%); margin-top: -10px; }
    .tip b { display: block; margin-bottom: 2px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .filters { position: static; } }
    .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; margin-top: 8px; }
    .search { max-width: 260px; }
    .hb { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
    .hb .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 600; }
    .hb .lb small { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .hb .tr { height: 14px; background: #F0F3F8; border-radius: 4px; position: relative; cursor: pointer; }
    .hb .fl { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
    .hb .vl { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12.5px; }
    .hb .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
    .more { margin-top: 8px; }
    .split { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: #fff; }
    .split div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; min-width: 2px; }
    .splitlg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; margin-top: 6px; color: var(--char); }
    .splitlg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    details.tv { margin-top: 12px; }
    details.tv > summary { cursor: pointer; font-weight: 800; color: var(--blue); font-size: 13px; list-style: none; padding: 6px 0; }
    details.tv > summary::before { content: '▸ '; } details.tv[open] > summary::before { content: '▾ '; }
    .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cgrid .sec { margin-top: 0; }
    .sec.card { margin-top: 14px; }
    .chipscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    @media (max-width: 820px) {
      .cgrid { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi { padding: 10px 11px; } .kpi .v { font-size: 20px; } .kpi .s { font-size: 11px; }
      .frow .input { flex: 1 1 40%; min-width: 0; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
      .frow { flex-wrap: wrap; }
      .card { padding: 12px; }
      .hb { grid-template-columns: minmax(80px, 38%) 1fr auto; font-size: 12.5px; }
    }
    .empty { padding: 30px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap viz">
    <div class="filters">
      <div class="frow">
        <input type="date" id="from" class="input" aria-label="From"> <span class="muted2">to</span> <input type="date" id="to" class="input" aria-label="To">
        <button class="chip" id="go" style="background:var(--orange);border-color:var(--orange);color:#fff">Load</button>
      </div>
      <div class="frow" style="margin-top:8px"><div class="chips" id="quick"></div></div>
      <div class="frow" style="margin-top:8px">
        <span class="flabel">Load</span><div class="chips" id="fLoad"></div>
        <span class="flabel" style="margin-left:8px">Class</span><div class="chips" id="fClass"></div>
      </div>
      <div class="tabs" id="tabs" style="margin-top:10px"></div>
    </div>
    <div id="status" class="empty">Loading…</div>
    <div id="view"></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  JNP.header($('hdr'), 'Dashboard', 'डैशबोर्ड · ऑपरेशन्स + R&M');
  const ctx = await JNP.requireModule(['OPS-01', 'RM-01', 'RM-02', 'FIN-01', 'FIN-02', 'APR-01']);
  if (ctx.user.level === 'Level 3') { $('status').textContent = 'Dashboard is for HO and department heads.'; return; }

  // ---------- helpers
  const CLASSES = [12, 25, 31, 35, 42];
  const classOf = cap => { cap = Number(cap); if (!cap) return 'Other'; let b = CLASSES[0]; CLASSES.forEach(c => { if (Math.abs(c - cap) < Math.abs(b - cap)) b = c; }); return b + 'T'; };
  const CLASS_COLOR = { '12T': 'var(--s1)', '25T': 'var(--s2)', '31T': 'var(--s3)', '35T': 'var(--s4)', '42T': 'var(--s5)', Other: '#9AA4B2' };
  const D = s => s ? new Date(String(s).replace(' ', 'T').length <= 10 ? s + 'T00:00:00' : String(s).replace(' ', 'T')) : null;
  const hrs = (a, b) => (b - a) / 36e5;
  const n0 = v => (Number(v) || 0);
  const fmt = (v, d) => v === '' || v === null || v === undefined || isNaN(v) ? '—' : Number(v).toLocaleString('en-IN', { maximumFractionDigits: d === undefined ? 0 : d, minimumFractionDigits: 0 });
  const inr = v => v === '' || v === null || v === undefined || isNaN(v) ? '—' : '₹' + fmtShort(v);
  function fmtShort(v) { v = Number(v); const a = Math.abs(v); if (a >= 1e7) return (v / 1e7).toFixed(2) + ' Cr'; if (a >= 1e5) return (v / 1e5).toFixed(2) + ' L'; return Math.round(v).toLocaleString('en-IN'); }
  const pct = v => isNaN(v) || v === null ? '—' : Math.round(v * 100) + '%';
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
  const sum = (a, f) => a.reduce((s, x) => s + (f ? n0(f(x)) : n0(x)), 0);
  const rows = t => (t && t.rows || []).map(r => { const o = {}; t.cols.forEach((c, i) => o[c] = r[i]); return o; });
  const iso = d => { const x = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return x.toISOString().slice(0, 10); };

  // ---------- filters
  const today = new Date();
  $('to').value = iso(today); $('from').value = iso(new Date(today.getTime() - 29 * 864e5));
  const QUICK = [['7D', 6], ['30D', 29], ['90D', 89], ['This month', 'tm'], ['Last month', 'lm']];
  $('quick').innerHTML = QUICK.map(q => '<button class="chip sm" data-q="' + q[1] + '">' + q[0] + '</button>').join('');
  $('quick').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; const q = b.dataset.q, t = new Date();
    if (q === 'tm') { $('from').value = iso(new Date(t.getFullYear(), t.getMonth(), 1)); $('to').value = iso(t); }
    else if (q === 'lm') { $('from').value = iso(new Date(t.getFullYear(), t.getMonth() - 1, 1)); $('to').value = iso(new Date(t.getFullYear(), t.getMonth(), 0)); }
    else { $('to').value = iso(t); $('from').value = iso(new Date(t.getTime() - Number(q) * 864e5)); }
    $('quick').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); load();
  };
  let fLoad = 'All', fClass = new Set();
  $('fLoad').innerHTML = ['All', 'BULK', 'BAG'].map(x => '<button class="chip sm' + (x === 'All' ? ' on' : '') + '" data-v="' + x + '">' + (x === 'All' ? 'All' : x === 'BULK' ? 'Bulk' : 'Bag') + '</button>').join('');
  $('fLoad').onclick = e => { const b = e.target.closest('button'); if (!b) return; fLoad = b.dataset.v; $('fLoad').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); render(); };
  $('fClass').innerHTML = '<button class="chip sm on" data-v="all">All</button>' + CLASSES.map(c => '<button class="chip sm" data-v="' + c + 'T">' + c + 'T</button>').join('');
  $('fClass').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v;
    if (v === 'all') fClass.clear(); else fClass.has(v) ? fClass.delete(v) : fClass.add(v);
    $('fClass').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.v === 'all' ? !fClass.size : fClass.has(x.dataset.v))); render();
  };
  $('go').onclick = load; $('from').onchange = () => $('quick').querySelectorAll('.chip').forEach(x => x.classList.remove('on'));

  const TABS = [{ id: 'overview', label: '📊 Overview' }, { id: 'trips', label: '🚚 Trips' }, { id: 'trucks', label: '🛻 Trucks' }, { id: 'drivers', label: '🧑‍✈️ Drivers' },
    { id: 'dest', label: '📍 Destinations' }, { id: 'fleet', label: '🔧 Fleet health' }, { id: 'diesel', label: '⛽ Diesel' }];
  let tab = JNP.param('tab') || 'overview', RAW = null, M = null;
  JNP.tabs($('tabs'), TABS, t => { tab = t; render(); }, tab);

  // ---------- data
  async function load() {
    $('status').classList.remove('hidden'); $('status').textContent = 'Loading data…'; $('view').innerHTML = '';
    try { RAW = await JNP.call('dash', { from: $('from').value, to: $('to').value }); M = model(RAW); render(); }
    catch (e) { $('status').innerHTML = '<span class="err">' + E(e.message) + '</span>'; }
  }

  function model(R) {
    const from = D(R.from), to = new Date(D(R.to).getTime() + 864e5 - 1), now = new Date(), end = to < now ? to : now;
    const days = Math.round((D(R.to) - D(R.from)) / 864e5) + 1;
    const truckM = {}; R.trucks.forEach(t => truckM[t.no] = t);
    const destM = {}; (R.dests || []).forEach(d => destM[JNP.keyOf(d.name)] = d);
    const blt = {}; rows(R.builty).forEach(b => blt[b.LR_No] = b);
    const ind = {}; rows(R.indent).forEach(i => ind[i.LR_No] = i);
    const all = rows(R.loader).map(r => {
      const t = truckM[r.Truck_No] || {}, b = blt[r.LR_No], i = ind[r.LR_No];
      const mt = b && n0(b.Qty_MT) ? n0(b.Qty_MT) : i && n0(i.Qty_Issued_MT) ? n0(i.Qty_Issued_MT) : n0(t.cap);
      const lt = b && b.Load_Type ? String(b.Load_Type).toUpperCase() : (t.cargo || '');
      const at = D(r.Created_At), un = i && (i.Unloaded_At || i.Created_At) ? D(i.Unloaded_At || i.Created_At) : null;
      return { lr: r.LR_No, at: at, day: String(r.Trip_Date || r.Created_At).slice(0, 10), truck: r.Truck_No, driver: r.Driver_Name, dest: r.Destination, km0: n0(r.Start_KM),
        diesel: n0(r.Diesel_Ltr), rate: n0(r.Rate), adv: n0(r.Trip_Advance), cap: n0(t.cap), cls: classOf(t.cap), load: lt === 'BULK' ? 'BULK' : 'BAG', mt: mt, mtEst: !(b && n0(b.Qty_MT)),
        rev: n0(r.Rate) * mt, consignee: b ? b.Consignee : '', unload: un, tat: un && at ? hrs(at, un) : NaN, delivered: i ? n0(i.Qty_Delivered_MT) : NaN, shortKg: i ? n0(i.Shortage_KG) : 0,
        targetTat: (destM[JNP.keyOf(r.Destination)] || {}).tat || '', by: r.Created_By };
    }).sort((a, b) => a.at - b.at);
    // rotation / km / idle need the sequence per truck and per driver (includes 35 days before the range)
    const byTruck = {}, byDriver = {};
    all.forEach(x => { (byTruck[x.truck] = byTruck[x.truck] || []).push(x); (byDriver[x.driver] = byDriver[x.driver] || []).push(x); });
    Object.values(byTruck).forEach(a => a.forEach((x, k) => {
      const p = a[k - 1], nx = a[k + 1];
      x.rot = p ? hrs(p.at, x.at) : NaN; if (x.rot > 15 * 24) x.rot = NaN;                 // gap > 15 days = parked, not rotation
      x.km = nx && nx.km0 > x.km0 && nx.km0 - x.km0 < 3000 ? nx.km0 - x.km0 : NaN;          // this trip's km = next loading's start KM − this one
      x.busy = nx ? Math.min(hrs(x.at, nx.at), 96) : Math.min(hrs(x.at, end), 96);            // days this load kept the truck busy (max 4)
      x.truckIdle = p && p.unload ? hrs(p.unload, x.at) : NaN;                                  // waiting after last unload
    }));
    Object.values(byDriver).forEach(a => a.forEach((x, k) => { const p = a[k - 1]; x.drvIdle = p && p.unload ? hrs(p.unload, x.at) : NaN; if (x.drvIdle > 30 * 24 || x.drvIdle < 0) x.drvIdle = NaN; }));
    const trips = all.filter(x => x.day >= R.from && x.day <= R.to);
    const lastTrip = {}; all.forEach(x => { if (x.at <= to) { lastTrip['T' + x.truck] = x; lastTrip['D' + x.driver] = x; } });
    // fleet
    const loadedNow = new Set(all.filter(x => x.day >= R.from && x.day <= R.to).map(x => x.truck));
    all.forEach(x => { if (!truckM[x.truck]) { truckM[x.truck] = { no: x.truck, cap: '', cargo: x.load, status: 'Not in master' }; R.trucks.push(truckM[x.truck]); } });
    const fleet = R.trucks.filter(t => loadedNow.has(t.no) || !/Archived|Sold/i.test(t.status + ' ' + t.compliance));
    const bds = rows(R.breakdowns).map(b => {
      const s = D(b.Created_At), e = b.Back_On_Road_At ? D(b.Back_On_Road_At) : now;
      const a = s < from ? from : s, z = e > end ? end : e;
      return Object.assign(b, { start: s, endAt: e, open: !b.Back_On_Road_At, inHrs: Math.max(0, hrs(a, z)), cls: classOf((truckM[b.Truck_No] || {}).cap) });
    });
    const mnt = rows(R.maintenance).map(m => Object.assign(m, { cls: classOf((truckM[m.Truck_No] || {}).cap) }));
    const tex = rows(R.truckExp).filter(x => /Approved|Paid/.test(x.Status)).map(m => Object.assign(m, { cls: classOf((truckM[m.Truck_No] || {}).cap) }));
    const tyr = rows(R.tyreEv).filter(x => n0(x.Cost)).map(m => Object.assign(m, { cls: classOf((truckM[m.Truck_No] || {}).cap) }));
    return { R, from, to, end, days, truckM, destM, trips, all, byTruck, byDriver, lastTrip, fleet, bds, mnt, tex, tyr, opsExp: rows(R.opsExp), hand: rows(R.handover) };
  }

  // ---------- filtering (load type + class)
  const keepT = x => (fLoad === 'All' || x.load === fLoad) && (!fClass.size || fClass.has(x.cls));
  const keepTruck = no => { const t = M.truckM[no] || {}; const c = classOf(t.cap); return (!fClass.size || fClass.has(c)) && (fLoad === 'All' || (t.cargo || 'BAG') === fLoad); };

  function agg(list) {
    const withD = list.filter(x => x.diesel > 0), km = list.filter(x => !isNaN(x.km));
    return { trips: list.length, mt: sum(list, x => x.mt), rev: sum(list, x => x.rev), diesel: sum(list, x => x.diesel), dieselTrips: withD.length,
      cap: sum(list, x => x.cap), km: sum(km, x => x.km), kmDiesel: sum(km, x => x.diesel), rot: avg(list.map(x => x.rot).filter(v => !isNaN(v))),
      tat: avg(list.map(x => x.tat).filter(v => !isNaN(v) && v >= 0 && v < 240)), short: sum(list, x => x.shortKg), est: list.filter(x => x.mtEst).length,
      onTime: (() => { const z = list.filter(x => !isNaN(x.tat) && x.targetTat); return z.length ? z.filter(x => x.tat <= x.targetTat).length / z.length : NaN; })(),
      busy: sum(list, x => x.busy) / 24 };
  }
  const revPerL = a => a.diesel ? a.rev / a.diesel : NaN;

  // ---------- table component (sortable, optional row click)
  const TBL = {};
  function table(id, cols, data, opt) {
    opt = opt || {}; const st = TBL[id] || (TBL[id] = { k: opt.sort || cols[1].k, asc: false });
    const sorted = data.slice().sort((a, b) => { const x = a[st.k], y = b[st.k]; const c = (typeof x === 'number' || typeof y === 'number') ? (isNaN(x) ? -1e18 : x) - (isNaN(y) ? -1e18 : y) : String(x || '').localeCompare(String(y || '')); return st.asc ? c : -c; });
    const max = {}; cols.forEach(c => { if (c.bar) max[c.k] = Math.max(1, ...data.map(r => n0(r[c.k]))); });
    const h = '<div class="tscroll"><table class="tbl" id="' + id + '"><thead><tr>' + cols.map(c => '<th data-k="' + c.k + '" class="' + (c.num ? 'nr ' : '') + (st.k === c.k ? 'sorted' + (st.asc ? ' asc' : '') : '') + '">' + c.t + '</th>').join('') + '</tr></thead><tbody>' +
      (sorted.length ? sorted.map((r, i) => '<tr' + (opt.click ? ' class="tap" data-i="' + data.indexOf(r) + '"' : '') + '>' + cols.map(c => '<td class="' + (c.num ? 'nr' : '') + '">' + (c.f ? c.f(r[c.k], r) : E(r[c.k])) + (c.bar ? '<span class="bar" style="width:' + Math.round(60 * n0(r[c.k]) / max[c.k]) + 'px;background:' + (c.color ? c.color(r) : 'var(--s1)') + '"></span>' : '') + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + cols.length + '" class="empty">No data for these filters</td></tr>') +
      '</tbody>' + (opt.foot ? '<tfoot><tr>' + cols.map(c => '<td class="' + (c.num ? 'nr' : '') + '">' + (opt.foot[c.k] !== undefined ? opt.foot[c.k] : '') + '</td>').join('') + '</tr></tfoot>' : '') + '</table></div>';
    setTimeout(() => {
      const el = $(id); if (!el) return;
      el.querySelector('thead').onclick = e => { const th = e.target.closest('th'); if (!th) return; if (st.k === th.dataset.k) st.asc = !st.asc; else { st.k = th.dataset.k; st.asc = false; } render(); };
      if (opt.click) el.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr.tap'); if (tr) opt.click(data[Number(tr.dataset.i)]); };
    }, 0);
    return h;
  }

  // ---------- column chart with hover tooltip (stacked, 2px gap, rounded top)
  function columns(id, cats, series, opt) {
    opt = opt || {};
    const W = innerWidth < 600 ? 440 : 900, H = 220, P = { l: 36, r: 8, t: 10, b: 26 }, iw = W - P.l - P.r, ih = H - P.t - P.b;
    const tot = cats.map((c, i) => sum(series, s => s.values[i]));
    const mx = Math.max(1, ...tot), step = opt.unit === 'trips' ? Math.max(1, niceStep(mx)) : niceStep(mx), top = Math.ceil(mx / step) * step;
    const bw = Math.max(2, Math.min(28, iw / cats.length - 3)), gap = iw / cats.length;
    let g = '';
    for (let v = 0; v <= top; v += step) { const y = P.t + ih - ih * v / top; g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)"/><text x="' + (P.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#5D6877">' + (top >= 1e5 ? fmtShort(v) : fmt(v)) + '</text>'; }
    let bars = '';
    cats.forEach((c, i) => {
      let y0 = P.t + ih; const x = P.l + gap * i + (gap - bw) / 2;
      series.forEach((s, k) => {
        const v = n0(s.values[i]); if (!v) return; const h = ih * v / top, y = y0 - h;
        const isTop = series.slice(k + 1).every(s2 => !n0(s2.values[i]));
        bars += isTop ? '<path d="' + roundTop(x, y + (k ? 2 : 0) * 0, bw, Math.max(1, h - (k ? 2 : 0)), Math.min(4, bw / 2)) + '" fill="' + s.color + '"/>' : '<rect x="' + x + '" y="' + (y + 2) + '" width="' + bw + '" height="' + Math.max(0, h - 2) + '" fill="' + s.color + '"/>';
        y0 = y;
      });
      bars += '<rect class="hit" data-i="' + i + '" x="' + (P.l + gap * i) + '" y="' + P.t + '" width="' + gap + '" height="' + ih + '" fill="transparent"/>';
    });
    const every = Math.ceil(cats.length / 12);
    const xl = cats.map((c, i) => i % every ? '' : '<text x="' + (P.l + gap * i + gap / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#5D6877">' + E(opt.label ? opt.label(c) : c) + '</text>').join('');
    const html = '<div class="legend">' + (series.length > 1 ? series.map(s => '<span><i style="background:' + s.color + '"></i>' + E(s.name) + '</span>').join('') : '') + '</div><div class="chart" id="' + id + '"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + E(opt.title || '') + '">' + g + bars + xl + '</svg><div class="tip hidden"></div></div>';
    setTimeout(() => {
      const el = $(id); if (!el) return; const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
      el.addEventListener('mousemove', e => {
        const r = e.target.closest('.hit'); if (!r) { tip.classList.add('hidden'); return; }
        const i = Number(r.dataset.i), bb = svg.getBoundingClientRect(), sc = bb.width / W;
        tip.innerHTML = '<b>' + E(opt.label ? opt.label(cats[i]) : cats[i]) + ' · ' + fmt(tot[i]) + ' ' + (opt.unit || '') + '</b>' + series.map(s => '<span style="display:block"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + s.color + ';margin-right:5px"></i>' + E(s.name) + ': ' + fmt(s.values[i]) + '</span>').join('');
        tip.style.left = ((P.l + gap * i + gap / 2) * sc) + 'px'; tip.style.top = ((P.t + ih - ih * tot[i] / top) * sc) + 'px'; tip.classList.remove('hidden');
      });
      el.addEventListener('mouseleave', () => tip.classList.add('hidden'));
      el.addEventListener('touchstart', e => { const t = e.touches[0]; el.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY, bubbles: true })); }, { passive: true });
    }, 0);
    return html;
  }
  function roundTop(x, y, w, h, r) { r = Math.min(r, h); return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z'; }
  function niceStep(mx) { const raw = mx / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

  // ranked horizontal bars — HTML, so it fits any phone width. items: {label, sub, value, color, text, tip}
  let HB = 0;
  function hbar(items, opt) {
    opt = opt || {}; const id = 'hb' + (++HB), top = opt.top || 10;
    items = items.filter(x => !isNaN(x.value) && x.value !== null).sort((a, b) => opt.asc ? a.value - b.value : b.value - a.value);
    if (!items.length) return '<div class="empty">No data for these filters</div>';
    const mx = Math.max(...items.map(x => Math.abs(x.value)), opt.ref || 0) || 1;
    const row = x => '<div class="lb" title="' + E(x.label) + '">' + E(x.label) + (x.sub ? '<small>' + E(x.sub) + '</small>' : '') + '</div>' +
      '<div class="tr" title="' + E(x.tip || (x.label + ': ' + (x.text || fmt(x.value, 1)))) + '"><div class="fl" style="width:' + (100 * Math.abs(x.value) / mx).toFixed(1) + '%;background:' + (x.color || 'var(--s1)') + '"></div>' +
      (opt.ref ? '<div class="ref" style="left:' + (100 * opt.ref / mx).toFixed(1) + '%" title="' + E(opt.refLabel || '') + '"></div>' : '') + '</div><div class="vl">' + (x.text || fmt(x.value, 1)) + '</div>';
    const first = items.slice(0, top), rest = items.slice(top);
    return (opt.ref ? '<div class="muted2" style="margin-bottom:6px">▏ ' + E(opt.refLabel || '') + '</div>' : '') + '<div class="hb">' + first.map(row).join('') + '</div>' +
      (rest.length ? '<details class="more"><summary class="muted2" style="cursor:pointer;font-weight:700">Show ' + rest.length + ' more</summary><div class="hb" style="margin-top:6px">' + rest.map(row).join('') + '</div></details>' : '');
  }
  // 100% share bar
  function split(parts) {
    const t = sum(parts, p => p.value) || 1;
    return '<div class="split">' + parts.filter(p => p.value).map(p => '<div style="flex:' + p.value + ';background:' + p.color + '" title="' + E(p.label + ': ' + fmt(p.value, 1)) + '">' + (p.value / t > .12 ? Math.round(100 * p.value / t) + '%' : '') + '</div>').join('') + '</div>' +
      '<div class="splitlg">' + parts.filter(p => p.value).map(p => '<span><i style="background:' + p.color + '"></i>' + E(p.label) + ' · ' + (p.text || fmt(p.value, 1)) + ' (' + Math.round(100 * p.value / t) + '%)</span>').join('') + '</div>';
  }
  const tv = (label, html) => '<details class="tv"' + (innerWidth >= 820 ? ' open' : '') + '><summary>' + label + '</summary>' + html + '</details>';
  const kpi = (l, v, s, color) => '<div class="kpi" style="--k:' + (color || 'var(--blue)') + '"><div class="l">' + l + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  const sec = (title, sub, body) => '<div class="sec card"><h2>' + title + (sub ? ' <small>' + sub + '</small>' : '') + '</h2>' + body + '</div>';
  const clsTag = c => '<span class="flag" style="background:#EEF2F8;color:var(--navy)">' + c + '</span>';
  const h1 = v => isNaN(v) ? '—' : fmt(v, 1) + ' h';
  const dd = v => isNaN(v) ? '—' : fmt(v / 24, 1) + ' d';

  // ---------- RENDER
  function render() {
    if (!M) return; $('status').classList.add('hidden');
    const T = M.trips.filter(keepT);

  }

  function overview(T) {
    const a = agg(T), fleet = M.fleet.filter(t => keepTruck(t.no)), activeTrucks = new Set(T.map(x => x.truck)).size;

    const bds = M.bds.filter(b => keepTruck(b.Truck_No)), downH = sum(bds, b => b.inHrs);
    const availDays = fleet.length * M.days - downH / 24;
    const spend = sum(M.mnt.filter(m => keepTruck(m.Truck_No)), m => m.Total_Cost) + sum(M.tex.filter(m => keepTruck(m.Truck_No)), m => m.Amount) + sum(M.tyr.filter(m => keepTruck(m.Truck_No)), m => m.Cost);
    const dates = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 864e5)) dates.push(iso(d));
    const by = (lt) => dates.map(d => T.filter(x => x.day === d && x.load === lt).length);
    const CL = CLASSES.map(c => c + 'T').concat(['Other']);
    const cls = CL.map(c => {
      const tt = T.filter(x => x.cls === c), g = agg(tt), fl = fleet.filter(t => classOf(t.cap) === c);
      return { cls: c, fleet: fl.length, active: new Set(tt.map(x => x.truck)).size, trips: g.trips, mt: g.mt, rev: g.rev, perTruckWk: fl.length ? g.trips / fl.length / (M.days / 7) : NaN,
        lf: g.cap ? g.mt / g.cap : NaN, rot: g.rot, rpl: revPerL(g), cov: g.trips ? g.dieselTrips / g.trips : NaN };
    }).filter(r => r.fleet || r.trips);
    const bulk = T.filter(x => x.load === 'BULK'), bag = T.filter(x => x.load === 'BAG');
    const dests = {}; T.forEach(x => { const d = dests[x.dest] = dests[x.dest] || { n: 0, mt: 0 }; d.n++; d.mt += x.mt; });
    return '<div class="kpis">' +
      kpi('Trips', fmt(a.trips), activeTrucks + ' trucks loaded', 'var(--blue)') +
      kpi('MT carried', fmt(a.mt, 1), a.est ? a.est + ' trips without builty (capacity used)' : 'from builty', 'var(--blue)') +
      kpi('Freight revenue', inr(a.rev), 'Rate × MT', 'var(--orange)') +
      kpi('Revenue / litre', isNaN(revPerL(a)) ? '—' : '₹' + fmt(revPerL(a), 1), fmt(a.diesel) + ' L · diesel on ' + pct(a.trips ? a.dieselTrips / a.trips : NaN) + ' trips', 'var(--orange)') +
      kpi('Load factor', pct(a.cap ? a.mt / a.cap : NaN), 'MT ÷ truck capacity', 'var(--navy)') +
      kpi('Fleet in use', activeTrucks + ' / ' + fleet.length, fmt(activeCap) + ' of ' + fmt(capT) + ' T loaded', 'var(--navy)') +
      kpi('Fleet utilisation', pct(availDays ? a.busy / availDays : NaN), fmt(a.busy, 0) + ' of ' + fmt(availDays, 0) + ' truck-days busy', 'var(--navy)') +
      kpi('Avg rotation', dd(a.rot), 'load → next load', 'var(--blue)') +
      kpi('Delivery TAT', h1(a.tat), 'on time ' + pct(a.onTime), 'var(--blue)') +
      kpi('Downtime', fmt(downH, 0) + ' h', bds.length + ' breakdowns · uptime ' + pct(fleet.length ? 1 - downH / (fleet.length * M.days * 24) : NaN), 'var(--red)') +
      kpi('Maintenance spend', inr(spend), 'jobs + expenses + tyres', 'var(--red)') +
      kpi('Repeat faults', fmt(repeats(M.bds.filter(b => keepTruck(b.Truck_No)), M.mnt.filter(m => keepTruck(m.Truck_No))).length), 'same truck + fault', 'var(--red)') +
      '</div>' +
      sec('Trips per day', 'Bulk vs Bag', columns('cDaily', dates, [{ name: 'Bulk', color: 'var(--s1)', values: by('BULK') }, { name: 'Bag', color: 'var(--s2)', values: by('BAG') }], { unit: 'trips', label: d => d.slice(8, 10) + '/' + d.slice(5, 7), title: 'Trips per day' })) +
      '<div class="cgrid">' +
      sec('Bulk vs Bag', 'share of trips and MT', '<div class="muted2" style="margin-bottom:4px">Trips</div>' + split([{ label: 'Bulk', value: bulk.length, color: 'var(--s1)', text: fmt(bulk.length) }, { label: 'Bag', value: bag.length, color: 'var(--s2)', text: fmt(bag.length) }]) +
        '<div class="muted2" style="margin:12px 0 4px">MT</div>' + split([{ label: 'Bulk', value: sum(bulk, x => x.mt), color: 'var(--s1)' }, { label: 'Bag', value: sum(bag, x => x.mt), color: 'var(--s2)' }]) +
        '<div class="muted2" style="margin:12px 0 4px">Revenue</div>' + split([{ label: 'Bulk', value: sum(bulk, x => x.rev), color: 'var(--s1)', text: inr(sum(bulk, x => x.rev)) }, { label: 'Bag', value: sum(bag, x => x.rev), color: 'var(--s2)', text: inr(sum(bag, x => x.rev)) }])) +
      sec('Trips by class', 'share of trips', split(cls.map(r => ({ label: r.cls, value: r.trips, color: CLASS_COLOR[r.cls], text: fmt(r.trips) }))) +
        '<div class="muted2" style="margin:14px 0 6px">Trips per truck per week</div>' + hbar(cls.map(r => ({ label: r.cls, sub: r.fleet + ' trucks', value: r.perTruckWk, color: CLASS_COLOR[r.cls], text: fmt(r.perTruckWk, 1) })))) +
      sec('Revenue per litre', 'by class — total freight ÷ diesel entered', hbar(cls.map(r => ({ label: r.cls, sub: r.cov < .7 ? 'diesel on ' + pct(r.cov) + ' trips' : '', value: r.rpl, color: CLASS_COLOR[r.cls], text: isNaN(r.rpl) ? '—' : '₹' + fmt(r.rpl, 1) })), { ref: revPerL(a), refLabel: 'fleet average ₹' + fmt(revPerL(a), 1) + ' / L' })) +

      '</div>' +
      sec('By truck class', 'capacity vs utilisation', tv('Table view', table('tCls', [
        { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'fleet', t: 'Fleet', num: 1 }, { k: 'active', t: 'Active', num: 1 }, { k: 'trips', t: 'Trips', num: 1, bar: 1 },
        { k: 'perTruckWk', t: 'Trips/truck/wk', num: 1, f: v => fmt(v, 1) }, { k: 'mt', t: 'MT', num: 1, f: v => fmt(v, 1) }, { k: 'lf', t: 'Load factor', num: 1, f: pct },
        { k: 'rev', t: 'Revenue', num: 1, f: inr }, { k: 'rot', t: 'Rotation', num: 1, f: dd }, { k: 'rpl', t: '₹ / litre', num: 1, f: (v, r) => isNaN(v) ? '—' : '₹' + fmt(v, 1) + (r.cov < .7 ? '<span class="flag est">diesel on ' + pct(r.cov) + ' trips</span>' : '') }], cls, { sort: 'cls' })));

  function tripsView(T) {

      '<div class="kpis">' + kpi('Trips', fmt(a.trips)) + kpi('MT', fmt(a.mt, 1)) + kpi('Revenue', inr(a.rev), '', 'var(--orange)') + kpi('Destinations', ds.length, '', 'var(--navy)') + '</div></div>' +
      sec('Loaded for', 'destination-wise · ' + JNP.dmy(RAW.from) + ' to ' + JNP.dmy(RAW.to), hbar(ds.map(d => ({ label: d.dest, sub: d.tcount + ' trucks · ' + fmt(d.mt, 0) + ' MT', value: d.trips, text: fmt(d.trips) + ' trips', tip: d.dest + ': ' + d.trips + ' trips, ' + fmt(d.mt, 1) + ' MT, ' + inr(d.rev) })), { top: 12 }) +

      sec('Revenue per day', '₹, Bulk vs Bag', columns('cRev', dates, [{ name: 'Bulk', color: 'var(--s1)', values: dates.map(d => sum(data.filter(x => x.day === d && x.load === 'BULK'), x => x.rev)) }, { name: 'Bag', color: 'var(--s2)', values: dates.map(d => sum(data.filter(x => x.day === d && x.load === 'BAG'), x => x.rev)) }], { unit: '₹', label: d => d.slice(8, 10) + '/' + d.slice(5, 7) })) +
      sec('Trip log', a.trips + ' trips · tap a heading to sort', '<details class="tv" open><summary>Show trips</summary>' +
        table('tTrips', [{ k: 'date', t: 'Date', f: v => JNP.dmy(v) }, { k: 'lr', t: 'LR' }, { k: 'truck', t: 'Truck' }, { k: 'dest', t: 'Destination' }, { k: 'driver', t: 'Driver' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'load', t: 'Load', f: v => v === 'BULK' ? 'Bulk' : 'Bag' },

  function csv(data) {

  function trucks(T) {

    });
    const idle = data.filter(r => isNaN(r.idleNow) || r.idleNow > 1).map(r => ({ label: r.truck, sub: r.cls + (r.status && r.status !== 'On Road' ? ' · ' + r.status : ''), value: isNaN(r.idleNow) ? M.days : r.idleNow, color: 'var(--red)', text: isNaN(r.idleNow) ? 'no trip' : fmt(r.idleNow, 1) + ' d' }));

      sec('Rotation', 'avg days between loadings', hbar(data.filter(r => !isNaN(r.rot)).map(r => ({ label: r.truck, sub: r.cls, value: r.rot / 24, color: CLASS_COLOR[r.cls], text: fmt(r.rot / 24, 1) + ' d' })), { top: 10 })) +
      sec('Revenue per truck', '₹', hbar(data.map(r => ({ label: r.truck, sub: r.cls, value: r.rev, color: CLASS_COLOR[r.cls], text: inr(r.rev) })), { top: 10 })) +
      '</div>' +
      sec('All trucks', 'tap a truck for its trips', tv('Table view', table('tTr', [
      { k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1, bar: 1, color: r => CLASS_COLOR[r.cls] }, { k: 'mt', t: 'MT', num: 1, f: v => fmt(v, 1) },
      { k: 'rev', t: 'Revenue', num: 1, f: inr }, { k: 'km', t: 'KM', num: 1 }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'rpl', t: '₹/L', num: 1, f: v => isNaN(v) ? '—' : fmt(v, 1) },
      { k: 'rot', t: 'Rotation', num: 1, f: dd }, { k: 'waitAfterUnload', t: 'Wait after unload', num: 1, f: h1 }, { k: 'idleNow', t: 'Since last load', num: 1, f: v => isNaN(v) ? '<span class="flag bad">no trip</span>' : v > 3 ? '<b style="color:var(--red)">' + fmt(v, 1) + ' d</b>' : fmt(v, 1) + ' d' },
      { k: 'down', t: 'Downtime', num: 1, f: v => v ? fmt(v, 0) + ' h' : '' }, { k: 'spend', t: 'R&M ₹', num: 1, f: v => v ? inr(v) : '' }, { k: 'rpt', t: 'Repeat', num: 1, f: v => v ? '<span class="flag bad">' + v + '</span>' : '' }],
      data, { sort: 'trips', click: r => detail('Truck ' + r.truck, T.filter(x => x.truck === r.truck)) }))) + '<div id="detail"></div>';
  }

  function drivers(T) {
    const names = {}; T.forEach(x => names[x.driver] = 1);
    const data = Object.keys(names).map(n => {
      const tt = T.filter(x => x.driver === n), g = agg(tt), last = M.lastTrip['D' + n];
      const deb = sum(M.hand.filter(h => h.Driver_Name === n && /Approved|Paid/.test(h.Status)), h => h.Proposed_Debit);
      return { driver: n, trips: g.trips, trucks: [...new Set(tt.map(x => x.truck))].join(', '), mt: g.mt, rev: g.rev, adv: sum(tt, x => x.adv), idleGap: avg(tt.map(x => x.drvIdle).filter(v => !isNaN(v))),
        idleNow: last ? (M.end - last.at) / 864e5 : NaN, tat: g.tat, onTime: g.onTime, short: g.short, km: g.km, kmpl: g.kmDiesel ? g.km / g.kmDiesel : NaN, debit: deb };
    });
    const opts = '<option value="">— all drivers —</option>' + data.map(d => d.driver).sort().map(n => '<option' + (window.__drv === n ? ' selected' : '') + '>' + E(n) + '</option>').join('');
    setTimeout(() => { const s = $('selDrv'); if (s) s.onchange = () => { window.__drv = s.value; render(); }; }, 0);
    const sel = window.__drv && data.find(d => d.driver === window.__drv);
    let head = '<div class="card"><div class="frow"><span class="flabel">Driver</span><select id="selDrv" class="input" style="max-width:320px;flex:1">' + opts + '</select></div>';
    if (sel) {
      const tt = T.filter(x => x.driver === sel.driver), dates = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 864e5)) dates.push(iso(d));
      const dst = {}; tt.forEach(x => dst[x.dest] = (dst[x.dest] || 0) + 1);
      head += '<div class="kpis">' + kpi('Trips', sel.trips, sel.trucks) + kpi('MT', fmt(sel.mt, 1)) + kpi('Revenue', inr(sel.rev), '', 'var(--orange)') + kpi('Idle between trips', h1(sel.idleGap), 'unload → next load') +
        kpi('Since last load', isNaN(sel.idleNow) ? '—' : fmt(sel.idleNow, 1) + ' d', '', 'var(--red)') + kpi('Delivery TAT', h1(sel.tat), 'on time ' + pct(sel.onTime)) + kpi('Shortage', fmt(sel.short) + ' kg', '', 'var(--red)') + kpi('Trip advances', inr(sel.adv), sel.debit ? 'debits ' + inr(sel.debit) : '') + '</div></div>' +
        '<div class="cgrid">' + sec('Trips per day', sel.driver, columns('cDrv', dates, [{ name: 'Trips', color: 'var(--s1)', values: dates.map(d => tt.filter(x => x.day === d).length) }], { unit: 'trips', label: d => d.slice(8, 10) + '/' + d.slice(5, 7) })) +
        sec('Destinations', sel.driver, hbar(Object.keys(dst).map(k => ({ label: k, value: dst[k], text: fmt(dst[k]) })), { top: 8 })) + '</div>' + detailHtml('Trips of ' + sel.driver, tt);
      return head;
    }
    return head + '</div><div class="cgrid">' +
      sec('Trips per driver', '', hbar(data.map(r => ({ label: r.driver, value: r.trips, text: fmt(r.trips), tip: r.driver + ': ' + r.trips + ' trips · ' + r.trucks })), { top: 12 })) +
      sec('Idle between trips', 'avg hours from unloading to next loading', hbar(data.filter(r => !isNaN(r.idleGap)).map(r => ({ label: r.driver, value: r.idleGap, color: 'var(--s2)', text: fmt(r.idleGap, 0) + ' h' })), { top: 12 })) +
      sec('Standing idle now', 'days since last loading', hbar(data.filter(r => r.idleNow > 1).map(r => ({ label: r.driver, sub: r.trucks, value: r.idleNow, color: 'var(--red)', text: fmt(r.idleNow, 1) + ' d' })), { top: 10 })) +
      sec('Shortage', 'kg', hbar(data.filter(r => r.short > 0).map(r => ({ label: r.driver, value: r.short, color: 'var(--red)', text: fmt(r.short) + ' kg' })), { top: 10 })) +
      '</div>' + sec('All drivers', 'tap a driver to open', tv('Table view', table('tDr', [
        { k: 'driver', t: 'Driver' }, { k: 'trips', t: 'Trips', num: 1, bar: 1 }, { k: 'trucks', t: 'Truck(s)' }, { k: 'mt', t: 'MT', num: 1, f: v => fmt(v, 1) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'idleGap', t: 'Avg idle', num: 1, f: h1 }, { k: 'idleNow', t: 'Since last load', num: 1, f: v => isNaN(v) ? '—' : v > 3 ? '<b style="color:var(--red)">' + fmt(v, 1) + ' d</b>' : fmt(v, 1) + ' d' },
        { k: 'tat', t: 'Delivery TAT', num: 1, f: h1 }, { k: 'onTime', t: 'On time', num: 1, f: pct }, { k: 'short', t: 'Short kg', num: 1, f: v => v > 0 ? v : '' }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'adv', t: 'Advances', num: 1, f: inr }],
        data, { sort: 'trips', click: r => { window.__drv = r.driver; render(); window.scrollTo(0, 0); } })));
  }

  function dest(T) {
    const names = {}; T.forEach(x => names[x.dest] = 1);
    const data = Object.keys(names).map(n => {
      const tt = T.filter(x => x.dest === n), g = agg(tt), dm = M.destM[JNP.keyOf(n)] || {};
      return { dest: n, trips: g.trips, trucks: new Set(tt.map(x => x.truck)).size, mt: g.mt, rev: g.rev, rate: g.mt ? g.rev / g.mt : NaN, km: dm.km || '', tat: g.tat, target: dm.tat || '', onTime: g.onTime, rot: g.rot, short: g.short, rpl: revPerL(g) };
    });
    return '<div class="cgrid">' +
      sec('Trips', 'by destination', hbar(data.map(r => ({ label: r.dest, sub: fmt(r.mt, 0) + ' MT', value: r.trips, text: fmt(r.trips) })), { top: 12 })) +
      sec('Revenue', 'by destination', hbar(data.map(r => ({ label: r.dest, value: r.rev, color: 'var(--s2)', text: inr(r.rev) })), { top: 12 })) +
      sec('Delivery TAT', 'avg hours, loading → unloading', hbar(data.filter(r => !isNaN(r.tat)).map(r => ({ label: r.dest, sub: r.target ? 'target ' + r.target + ' h' : '', value: r.tat, color: r.target && r.tat > r.target ? 'var(--red)' : 'var(--s3)', text: fmt(r.tat, 0) + ' h' })), { top: 12 })) +
      sec('Rate', 'avg ₹ per MT', hbar(data.filter(r => !isNaN(r.rate)).map(r => ({ label: r.dest, value: r.rate, color: 'var(--s4)', text: '₹' + fmt(r.rate) })), { top: 12 })) +
      '</div>' + sec('All destinations', 'tap one for its trips', tv('Table view', table('tDe', [
      { k: 'dest', t: 'Destination' }, { k: 'trips', t: 'Trips', num: 1, bar: 1 }, { k: 'trucks', t: 'Trucks', num: 1 }, { k: 'mt', t: 'MT', num: 1, f: v => fmt(v, 1) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
      { k: 'rate', t: 'Avg ₹/MT', num: 1, f: v => fmt(v) }, { k: 'km', t: 'KM (one way)', num: 1 }, { k: 'tat', t: 'Delivery TAT', num: 1, f: h1 }, { k: 'target', t: 'Target', num: 1, f: v => v ? v + ' h' : '<span class="muted2">set in master</span>' },
      { k: 'onTime', t: 'On time', num: 1, f: pct }, { k: 'rot', t: 'Rotation', num: 1, f: dd }, { k: 'short', t: 'Short kg', num: 1, f: v => v > 0 ? v : '' }, { k: 'rpl', t: '₹/L', num: 1, f: v => isNaN(v) ? '—' : fmt(v, 1) }],
      data, { sort: 'trips', click: r => detail(r.dest, T.filter(x => x.dest === r.dest)) }))) + '<div id="detail"></div>';
  }

  function detailHtml(title, tt) {
    return sec(title, tt.length + ' trips', table('tDet', [{ k: 'day', t: 'Date', f: v => JNP.dmy(v) }, { k: 'lr', t: 'LR' }, { k: 'truck', t: 'Truck' }, { k: 'driver', t: 'Driver' }, { k: 'dest', t: 'Destination' },
      { k: 'mt', t: 'MT', num: 1, f: v => fmt(v, 2) }, { k: 'rev', t: 'Revenue', num: 1, f: inr }, { k: 'diesel', t: 'Diesel', num: 1 }, { k: 'km', t: 'KM', num: 1, f: v => fmt(v) }, { k: 'tat', t: 'TAT', num: 1, f: h1 }, { k: 'drvIdle', t: 'Idle before', num: 1, f: h1 }], tt, { sort: 'day' }));
  }
  function detail(title, tt) { $('detail').innerHTML = detailHtml(title, tt); $('detail').scrollIntoView({ behavior: 'smooth' }); }

  function repeats(bds, mnt) {
    const rf = {}; bds.concat(mnt).forEach(x => { if (!x.Fault_Code) return; const k = x.Truck_No + '|' + x.Fault_Code; (rf[k] = rf[k] || { truck: x.Truck_No, fault: x.Fault_Code, n: 0, flagged: 0 }).n++; if (x.Repeat_Flag === 'Yes') rf[k].flagged++; });
    const faults = {}; (JNP.M().faults || []).forEach(f => faults[f.code] = f.name);
    return Object.values(rf).filter(x => x.n >= 2 || x.flagged).map(x => Object.assign(x, { name: faults[x.fault] || '' }));
  }
  function fleet() {
    const keep = x => keepTruck(x.Truck_No), bds = M.bds.filter(keep), mnt = M.mnt.filter(keep), tex = M.tex.filter(keep), tyr = M.tyr.filter(keep), fl = M.fleet.filter(t => keepTruck(t.no));
    const downH = sum(bds, b => b.inHrs), closed = bds.filter(b => !b.open);
    const pm = mnt.filter(m => /Preventive/.test(m.Record_Type)), checks = sum(pm, m => String(m.PM_Check_Codes || '').split(',').filter(Boolean).length);
    const overdue = fl.filter(t => t.svcKm && t.odo && t.lastSvc !== '' && t.odo - t.lastSvc >= t.svcKm).map(t => ({ truck: t.no, cls: classOf(t.cap), odo: t.odo, last: t.lastSvc, due: t.lastSvc + t.svcKm, over: t.odo - t.lastSvc - t.svcKm }));
    // repeat faults: same truck + fault ≥ 2 in range (breakdowns + job cards)
    const rep = repeats(bds, mnt);
    const spendRows = fl.map(t => ({ truck: t.no, cls: classOf(t.cap), jobs: sum(mnt.filter(m => m.Truck_No === t.no), m => m.Total_Cost), exp: sum(tex.filter(m => m.Truck_No === t.no), m => m.Amount), tyres: sum(tyr.filter(m => m.Truck_No === t.no), m => m.Cost), budget: t.budget ? t.budget * M.days / 30 : NaN }))
      .map(r => Object.assign(r, { total: r.jobs + r.exp + r.tyres })).filter(r => r.total);
    const heads = {}; tex.forEach(x => heads[x.Expense_Head] = (heads[x.Expense_Head] || 0) + n0(x.Amount));
    const downT = {}; bds.forEach(x => { downT[x.Truck_No] = (downT[x.Truck_No] || 0) + x.inHrs; });
    const weeks = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 7 * 864e5)) weeks.push(iso(d));
    const wkOf = v => { const t = D(String(v).slice(0, 10)); const i = Math.floor((t - M.from) / (7 * 864e5)); return i >= 0 && i < weeks.length ? i : -1; };
    const wk = (list, f) => weeks.map((w, i) => sum(list.filter(x => wkOf(x.Created_At) === i), f));
    return '<div class="kpis">' +
      kpi('Breakdowns', bds.length, bds.filter(b => b.open).length + ' still open', 'var(--red)') + kpi('Fleet downtime', fmt(downH, 0) + ' h', 'uptime ' + pct(fl.length ? 1 - downH / (fl.length * M.days * 24) : NaN) + (RAW.settings.Fleet_Uptime_Target ? ' · target ' + pct(RAW.settings.Fleet_Uptime_Target) : ''), 'var(--red)') +
      kpi('Avg breakdown downtime', h1(avg(closed.map(b => n0(b.Downtime_Hrs))))) + kpi('Repair TAT (job cards)', h1(avg(mnt.map(m => n0(m.Repair_TAT_Hrs)).filter(Boolean)))) +
      kpi('Repeat faults', rep.length, 'same truck + fault', 'var(--red)') + kpi('Maintenance spend', inr(sum(spendRows, r => r.total)), '', 'var(--orange)') +
      kpi('Preventive checks', pm.length, checks + ' check items done', 'var(--ok)') + kpi('PM overdue', overdue.length, 'past service interval', overdue.length ? 'var(--red)' : 'var(--ok)') + '</div>' +
      sec('Spend per week', 'job cards + expenses + tyres', columns('cSpend', weeks, [{ name: 'Job cards', color: 'var(--s1)', values: wk(mnt, x => x.Total_Cost) }, { name: 'Truck expenses', color: 'var(--s2)', values: wk(tex, x => x.Amount) }, { name: 'Tyres', color: 'var(--s3)', values: wk(tyr, x => x.Cost) }], { unit: '₹', label: d => 'wk ' + d.slice(8, 10) + '/' + d.slice(5, 7) })) +
      '<div class="cgrid">' +
      sec('Downtime by truck', 'hours off road in this period', hbar(Object.keys(downT).map(k => ({ label: k, sub: classOf((M.truckM[k] || {}).cap), value: downT[k], color: 'var(--red)', text: fmt(downT[k], 0) + ' h' })), { top: 10 })) +
      sec('Spend by truck', '₹', hbar(spendRows.map(r => ({ label: r.truck, sub: r.cls, value: r.total, color: 'var(--s2)', text: inr(r.total), tip: r.truck + ': jobs ' + inr(r.jobs) + ', expenses ' + inr(r.exp) + ', tyres ' + inr(r.tyres) })), { top: 10 })) +
      sec('Spend split', '', split([{ label: 'Job cards', value: sum(spendRows, r => r.jobs), color: 'var(--s1)', text: inr(sum(spendRows, r => r.jobs)) }, { label: 'Truck expenses', value: sum(spendRows, r => r.exp), color: 'var(--s2)', text: inr(sum(spendRows, r => r.exp)) }, { label: 'Tyres', value: sum(spendRows, r => r.tyres), color: 'var(--s3)', text: inr(sum(spendRows, r => r.tyres)) }]) +
        '<div class="muted2" style="margin:14px 0 6px">Truck expenses by head</div>' + hbar(Object.keys(heads).map(h => ({ label: h, value: heads[h], color: 'var(--s2)', text: inr(heads[h]) })), { top: 6 })) +
      sec('Repeat faults', 'same truck + fault', hbar(rep.map(r => ({ label: r.truck, sub: r.fault + (r.name ? ' ' + r.name : ''), value: r.n, color: 'var(--red)', text: r.n + '×' })), { top: 10 })) +
      '</div>' +
      sec('PM overdue', 'Service_Interval_KM in Truck_Master', hbar(overdue.map(r => ({ label: r.truck, sub: r.cls, value: r.over, color: 'var(--red)', text: fmt(r.over) + ' km over' }))) +
        tv('Table view', table('tPm', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'odo', t: 'KM now', num: 1, f: v => fmt(v) }, { k: 'due', t: 'Due at', num: 1, f: v => fmt(v) }, { k: 'over', t: 'Over by', num: 1, f: v => '<b style="color:var(--red)">' + fmt(v) + '</b>' }], overdue, { sort: 'over' }))) +
      sec('Breakdowns', 'in this period', tv('Table view', table('tBd', [{ k: 'Created_At', t: 'Reported', f: v => JNP.dmy(String(v).replace('T', ' ')) }, { k: 'Truck_No', t: 'Truck' }, { k: 'Symptom', t: 'Problem' }, { k: 'Fault_Code', t: 'Fault' },
        { k: 'Breakdown_Status', t: 'Status', f: v => '<span class="pill ' + JNP.statusCls(v) + '">' + E(v) + '</span>' }, { k: 'inHrs', t: 'Down (in period)', num: 1, f: v => fmt(v, 0) + ' h' }, { k: 'Repair_Location', t: 'Repaired at' }, { k: 'Repeat_Flag', t: 'Repeat', f: v => v === 'Yes' ? '<span class="flag bad">Repeat</span>' : '' }], bds, { sort: 'Created_At' }))) +
      sec('Maintenance spend by truck', 'budget = Monthly_RM_Budget for the period', tv('Table view', table('tSp', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'jobs', t: 'Job cards', num: 1, f: inr }, { k: 'exp', t: 'Expenses', num: 1, f: inr }, { k: 'tyres', t: 'Tyres', num: 1, f: inr },
        { k: 'total', t: 'Total', num: 1, f: inr, bar: 1, color: () => 'var(--s2)' }, { k: 'budget', t: 'Budget', num: 1, f: (v, r) => isNaN(v) ? '—' : inr(v) + (r.total > v ? '<span class="flag bad">over</span>' : '') }], spendRows, { sort: 'total' })));
  }

  function diesel(T) {
    const a = agg(T);
    const cls = CLASSES.map(c => c + 'T').concat(['Other']).map(c => { const g = agg(T.filter(x => x.cls === c)); return { cls: c, trips: g.trips, diesel: g.diesel, rev: g.rev, rpl: revPerL(g), cov: g.trips ? g.dieselTrips / g.trips : NaN, kmpl: g.kmDiesel ? g.km / g.kmDiesel : NaN, lpt: g.trips ? g.diesel / g.trips : NaN }; }).filter(r => r.trips);
    const trk = {}; T.forEach(x => (trk[x.truck] = trk[x.truck] || []).push(x));
    const tr = Object.keys(trk).map(k => { const g = agg(trk[k]); return { truck: k, cls: trk[k][0].cls, trips: g.trips, diesel: g.diesel, rev: g.rev, rpl: revPerL(g), cov: g.trips ? g.dieselTrips / g.trips : NaN, kmpl: g.kmDiesel ? g.km / g.kmDiesel : NaN }; });
    const lowCov = cls.filter(r => r.cov < .7), avgR = revPerL(a);
    const dates = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 864e5)) dates.push(iso(d));
    const CL = cls.map(r => r.cls);
    return '<div class="kpis">' + kpi('Revenue per litre', isNaN(avgR) ? '—' : '₹' + fmt(avgR, 1), 'total freight ÷ total diesel entered', 'var(--orange)') + kpi('Diesel entered', fmt(a.diesel) + ' L', 'on ' + a.dieselTrips + ' of ' + a.trips + ' trips') +
      kpi('Freight revenue', inr(a.rev)) + kpi('KM per litre', a.kmDiesel ? fmt(a.km / a.kmDiesel, 2) : '—', 'where next loading KM is known') + '</div>' +
      (lowCov.length ? '<div class="note">⚠️ ' + lowCov.map(r => r.cls).join(', ') + ': diesel is entered on few trips (filled in lumps), so ₹/litre is worked out over the whole period — reliable only when every fill in the period is entered.</div>' : '') +
      sec('Diesel per day', 'litres entered, by class', columns('cDsl', dates, CL.map(c => ({ name: c, color: CLASS_COLOR[c], values: dates.map(d => sum(T.filter(x => x.day === d && x.cls === c), x => x.diesel)) })), { unit: 'L', label: d => d.slice(8, 10) + '/' + d.slice(5, 7) })) +
      '<div class="cgrid">' +
      sec('₹ earned per litre', 'by class', hbar(cls.map(r => ({ label: r.cls, sub: r.cov < .7 ? 'diesel on ' + pct(r.cov) + ' trips' : '', value: r.rpl, color: CLASS_COLOR[r.cls], text: isNaN(r.rpl) ? '—' : '₹' + fmt(r.rpl, 1) })), { ref: avgR, refLabel: 'fleet average ₹' + fmt(avgR, 1) })) +
      sec('KM per litre', 'by class', hbar(cls.filter(r => !isNaN(r.kmpl)).map(r => ({ label: r.cls, value: r.kmpl, color: CLASS_COLOR[r.cls], text: fmt(r.kmpl, 2) })))) +
      sec('₹ per litre — lowest trucks', 'check these first', hbar(tr.filter(r => !isNaN(r.rpl)).map(r => ({ label: r.truck, sub: r.cls + (r.cov < .7 ? ' · low diesel entry' : ''), value: r.rpl, color: CLASS_COLOR[r.cls], text: '₹' + fmt(r.rpl, 1) })), { top: 10, asc: true, ref: avgR, refLabel: 'fleet average' })) +
      sec('₹ per litre — best trucks', '', hbar(tr.filter(r => !isNaN(r.rpl)).map(r => ({ label: r.truck, sub: r.cls, value: r.rpl, color: CLASS_COLOR[r.cls], text: '₹' + fmt(r.rpl, 1) })), { top: 10, ref: avgR, refLabel: 'fleet average' })) +
      '</div>' +
      sec('By class', '', tv('Table view', table('tDc', [{ k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1 }, { k: 'diesel', t: 'Diesel L', num: 1, f: v => fmt(v) }, { k: 'lpt', t: 'L / trip', num: 1, f: v => fmt(v, 0) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'rpl', t: '₹ per litre', num: 1, f: v => isNaN(v) ? '—' : '₹' + fmt(v, 1) }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'cov', t: 'Trips with diesel', num: 1, f: v => v < .7 ? '<span class="flag est">' + pct(v) + '</span>' : pct(v) }], cls, { sort: 'cls' }))) +
      sec('By truck', '', tv('Table view', table('tDt', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1 }, { k: 'diesel', t: 'Diesel L', num: 1, f: v => fmt(v) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'rpl', t: '₹ per litre', num: 1, f: v => isNaN(v) ? '—' : '₹' + fmt(v, 1) }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'cov', t: 'Trips with diesel', num: 1, f: v => v < .7 ? '<span class="flag est">' + pct(v) + '</span>' : pct(v) }], tr, { sort: 'rpl' })));
  }

  load();
})();
