  <style>
    .wrap { max-width: 1180px; }
    .viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --grid: #E6EBF2; }
    .filters { position: sticky; top: 66px; z-index: 15; background: var(--bg); padding: 10px 0 6px; }
    .fbar { display: flex; gap: 8px; align-items: stretch; }
    .fbar .input { flex: 1; min-width: 0; padding: 8px 10px; font-size: 14px; }
    .sel { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; background: #fff; border: 1.5px solid #CCD5E2; border-radius: 12px; padding: 4px 30px 4px 10px; }
    .sel::after { content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .sel span { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .sel.date { padding-right: 8px; } .sel.date::after { content: ''; }
    .sel input[type=date] { border: 0; background: transparent; font-weight: 800; color: var(--navy); font-size: 14.5px; padding: 0; outline: none; width: 100%; min-height: 22px; font-family: inherit; }
    .sel select { border: 0; background: transparent; font-weight: 800; color: var(--navy); font-size: 14.5px; padding: 0; -webkit-appearance: none; appearance: none; outline: none; width: 100%; }
    .sel.view { flex: 3; background: var(--navy); border-color: var(--navy); } .sel.view span { color: #9FB6DA; } .sel.view select { color: #fff; font-size: 15.5px; } .sel.view::after { color: #fff; }
    .sel.view select option { color: var(--ink); }
    .sharebtn { flex: 1; border: 0; border-radius: 12px; background: linear-gradient(135deg, #1FAF5E, #12804A); color: #fff; font-weight: 800; font-size: 14px; white-space: nowrap; padding: 0 12px; cursor: pointer; }
    .kpi.tap { cursor: pointer; } .kpi.tap .l::after { content: ' ›'; color: var(--orange); font-weight: 900; } .kpi.sel1 { outline: 2.5px solid var(--orange); }
    .drill { grid-column: 1 / -1; }

    .donut svg { width: 150px; height: 150px; flex: none; }
    .stk { display: grid; grid-template-columns: 56px 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
    .stk .bars { display: flex; gap: 2px; height: 16px; } .stk .bars div { border-radius: 3px; min-width: 2px; }
    .fs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fs .b { border-radius: 12px; padding: 10px; background: var(--bg); cursor: pointer; border: 2px solid transparent; }
    .fs .b.on { border-color: var(--orange); background: #fff; }
    .fs .b b { display: block; font-size: 22px; color: var(--navy); line-height: 1.1; } .fs .b span { font-size: 11.5px; color: var(--muted); font-weight: 700; } .fs .b small { display: block; font-size: 11.5px; color: var(--char); }
    .fs .b.down b { color: var(--red); } .fs .b.ld b { color: var(--blue); } .fs .b.rt b { color: var(--s3); } .fs .b.wt b { color: var(--orange); }
    @media (max-width: 820px) { .fs { grid-template-columns: 1fr 1fr; } .filters { position: static; } .donut svg { width: 120px; height: 120px; } }
    .frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .frow .input { width: auto; padding: 8px 10px; min-height: 0; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .chip.sm { padding: 4px 10px; font-size: 12.5px; }
    .flabel { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-top: 12px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--k, var(--blue)); }
    .kpi .l { font-size: 12px; color: var(--muted); font-weight: 700; }
    .kpi .v { font-size: 24px; font-weight: 900; color: var(--ink); line-height: 1.15; margin-top: 2px; letter-spacing: -.3px; }
    .kpi .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .sec { margin-top: 18px; }
    .sec h2 { font-size: 15px; color: var(--navy); margin: 0 0 8px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .sec h2::before { content: ''; width: 5px; height: 18px; border-radius: 3px; background: var(--orange); }
    .sec h2 small { font-weight: 600; color: var(--muted); font-size: 12px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 800; padding: 8px 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; background: #fff; position: sticky; top: 0; }
    .tbl th.nr, .tbl td.nr { text-align: right; }
    .tbl.flow { width: 100%; } .tbl.flow td, .tbl.flow th { vertical-align: top; white-space: normal; padding: 7px 6px; } .tbl.flow td:first-child { width: 46%; } .tbl.flow th { position: static; } .tbl.flow small { color: var(--muted); font-weight: 600; } .tbl.flow tr.tot td { border-top: 2px solid var(--navy); background: #F5F8FC; }
    .tbl th.sorted::after { content: ' ▾'; } .tbl th.sorted.asc::after { content: ' ▴'; }

    .tbl tr.tap { cursor: pointer; } .tbl tr.tap:hover td { background: #F5F8FD; }
    .tbl tfoot td { font-weight: 800; border-top: 1.5px solid var(--line); }
    .tscroll { overflow: auto; max-height: 560px; border-radius: 12px; }
    .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--s1); vertical-align: middle; margin-left: 6px; }
    .muted2 { color: var(--muted); font-size: 12px; }

    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--char); margin: 4px 0 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tip { position: absolute; pointer-events: none; background: #1B2430; color: #fff; font-size: 12.5px; padding: 8px 10px; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; z-index: 5; transform: translate(-50%, -100%); margin-top: -10px; }
    .tip b { display: block; margin-bottom: 2px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .filters { position: static; } }
    .note { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; margin-top: 8px; }
    .search { max-width: 260px; }
    .hb { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
    .hb .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 600; }
    .hb .lb small { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .hb .tr { height: 14px; background: #F0F3F8; border-radius: 4px; position: relative; cursor: pointer; }
    .hb .fl { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
    .hb .vl { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 12.5px; }
    .hb .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
    .more { margin-top: 8px; }
    .split { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: #fff; }
    .split div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; min-width: 2px; }
    .splitlg { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; margin-top: 6px; color: var(--char); }
    .splitlg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    details.tv { margin-top: 12px; }
    details.tv > summary { cursor: pointer; font-weight: 800; color: var(--blue); font-size: 13px; list-style: none; padding: 6px 0; }
    details.tv > summary::before { content: '▸ '; } details.tv[open] > summary::before { content: '▾ '; }
    .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cgrid .sec { margin-top: 0; }
    .sec.card { margin-top: 14px; }
    .chipscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    @media (max-width: 820px) {

      .kpi { padding: 10px 11px; } .kpi .v { font-size: 20px; } .kpi .s { font-size: 11px; }
      .frow .input { flex: 1 1 40%; min-width: 0; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
      .frow { flex-wrap: wrap; }
      .card { padding: 12px; }
      .hb { grid-template-columns: minmax(80px, 38%) 1fr auto; font-size: 12.5px; }
    }
    .empty { padding: 30px; text-align: center; color: var(--muted); }

    const fixNo = no => { no = JNP.normTruck(no); if (!no || truckM[no]) return no; const k = no.slice(-4); return /^\d{4}$/.test(k) && last4[k] ? last4[k] : no; };
    ['loader', 'breakdowns', 'maintenance', 'truckExp', 'tyreEv', 'handover'].forEach(key => { const t = R[key]; if (!t || !t.cols) return; const i = t.cols.indexOf('Truck_No'); if (i >= 0) t.rows.forEach(r => r[i] = fixNo(r[i])); });

  // ---------- Gross profit = Revenue − Diesel ₹ − DEF ₹ − Trip advance − Extra diesel ₹ (management only)
  function gpBlock(T) {
    const a = agg(T), xd = rows(RAW.extraDiesel).filter(x => keepTruck(JNP.normTruck(x.Truck_No))), xdAmt = sum(xd, x => M.extraAmt(x));
    const gp = a.gp - xdAmt, nT = new Set(T.map(x => x.truck)).size;
    const per = {}; T.forEach(x => { const p = per[x.truck] = per[x.truck] || { truck: x.truck, cls: x.cls, trips: 0, rev: 0, cost: 0, gp: 0, xd: 0 }; p.trips++; p.rev += x.rev; p.cost += x.dCost + x.defCost + x.adv; p.gp += x.gp; });
    xd.forEach(x => { const k = JNP.normTruck(x.Truck_No); if (per[k]) { per[k].xd += M.extraAmt(x); per[k].gp -= M.extraAmt(x); } });
    const list = Object.values(per).sort((p, q) => q.gp - p.gp);

      kpi('Gross profit', inr(gp), 'Revenue ' + inr(a.rev) + ' − Diesel ' + inr(a.dCost) + (a.defCost ? ' − DEF ' + inr(a.defCost) : '') + ' − Advance ' + inr(a.adv) + (xdAmt ? ' − Extra diesel ' + inr(xdAmt) : '') +

        (a.noDRate ? '<br><b style="color:var(--red)">⚠ ' + a.noDRate + ' trips have no diesel rate — HO: Trip Advance › Diesel / DEF rates</b>' : ''), gp >= 0 ? 'var(--ok)' : 'var(--red)') +
      kpi('GP per trip', a.trips ? inr(gp / a.trips) : '—', a.trips + ' trips', 'var(--ok)') +

  }

  function loadH2C() {
    if (window.html2canvas) return Promise.resolve();

    return (H2C = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload = res; s.onerror = () => { H2C = null; rej(new Error('Could not load the image maker — check internet')); }; document.head.appendChild(s); }));

  async function sendImage(blob, name, caption) {

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);

    return sec('Loading point', L.length + ' of ' + all.length + ' orders tapped "At loading point"',
      '<div class="kpis">' + kpi('Order → at loading point', isNaN(avg(toL, 'To_Loading_Hrs')) ? '—' : h1(avg(toL, 'To_Loading_Hrs')), 'average · median ' + (isNaN(med(toL, 'To_Loading_Hrs')) ? '—' : h1(med(toL, 'To_Loading_Hrs'))), 'var(--orange)') +
      kpi('Loading time', isNaN(avg(ld, 'Loading_Hrs')) ? '—' : h1(avg(ld, 'Loading_Hrs')), 'at loading point → loaded · median ' + (isNaN(med(ld, 'Loading_Hrs')) ? '—' : h1(med(ld, 'Loading_Hrs'))), 'var(--blue)') + '</div>' +
      (slow.length ? tv('Longest loading', table('tLoadPt', [{ k: 'Truck_No', t: 'Truck' }, { k: 'LR_No', t: 'LR' }, { k: 'Destination', t: 'To' }, { k: 'To_Loading_Hrs', t: 'Order → plant', num: 1, f: v => v === '' ? '—' : h1(n0(v)) }, { k: 'Loading_Hrs', t: 'Loading', num: 1, bar: 1, f: v => h1(n0(v)) }], slow, { sort: 'Loading_Hrs' })) : ''));
  }

  function fleet() {
    const keep = x => keepTruck(x.Truck_No), bdsAll = M.bds.filter(keep), bds = bdsAll.filter(b => b.rm), mnt = M.mnt.filter(keep), tex = M.tex.filter(keep), tyr = M.tyr.filter(keep), fl = M.fleet.filter(t => keepTruck(t.no));
    const downH = sum(bds, b => b.inHrs), closed = bds.filter(b => !b.open);
    const pm = mnt.filter(m => /Preventive/.test(m.Record_Type)), checks = sum(pm, m => String(m.PM_Check_Codes || '').split(',').filter(Boolean).length);
    const overdue = fl.filter(t => t.svcKm && t.odo && t.lastSvc !== '' && t.odo - t.lastSvc >= t.svcKm).map(t => ({ truck: t.no, cls: classOf(t.cap), odo: t.odo, last: t.lastSvc, due: t.lastSvc + t.svcKm, over: t.odo - t.lastSvc - t.svcKm }));
    // repeat faults: same truck + fault ≥ 2 in range (breakdowns + job cards)
    const rep = repeats(bds, mnt);
    const spendRows = fl.map(t => ({ truck: t.no, cls: classOf(t.cap), jobs: sum(mnt.filter(m => m.Truck_No === t.no), m => m.Total_Cost), exp: sum(tex.filter(m => m.Truck_No === t.no), m => m.Amount), tyres: sum(tyr.filter(m => m.Truck_No === t.no), m => m.Cost), budget: t.budget ? t.budget * M.days / 30 : NaN }))
      .map(r => Object.assign(r, { total: r.jobs + r.exp + r.tyres })).filter(r => r.total);
    const heads = {}; tex.forEach(x => heads[x.Expense_Head] = (heads[x.Expense_Head] || 0) + n0(x.Amount));
    const downT = {}; bds.forEach(x => { downT[x.Truck_No] = (downT[x.Truck_No] || 0) + x.inHrs; });
    const weeks = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 7 * 864e5)) weeks.push(iso(d));
    const wkOf = v => { const t = D(String(v).slice(0, 10)); const i = Math.floor((t - M.from) / (7 * 864e5)); return i >= 0 && i < weeks.length ? i : -1; };
    const wk = (list, f) => weeks.map((w, i) => sum(list.filter(x => wkOf(x.Created_At) === i), f));
    return '<div class="kpis">' +
      kpi('Breakdowns', bds.length, bds.filter(b => b.open).length + ' still open', 'var(--red)') + kpi('Fleet downtime', fmt(downH, 0) + ' h', 'uptime ' + pct(fl.length ? 1 - downH / (fl.length * M.days * 24) : NaN) + (RAW.settings.Fleet_Uptime_Target ? ' · target ' + pct(RAW.settings.Fleet_Uptime_Target) : ''), 'var(--red)') +
      kpi('Avg breakdown downtime', h1(avg(closed.map(b => n0(b.Downtime_Hrs))))) + kpi('Repair TAT (job cards)', h1(avg(mnt.map(m => n0(m.Repair_TAT_Hrs)).filter(Boolean)))) +
      (() => { const c = {}; bds.forEach(b => c[b.Truck_No] = (c[b.Truck_No] || 0) + 1); const top = Object.keys(c).sort((p, q) => c[q] - c[p]);
        return kpi('Most breakdowns', top.length ? top[0].slice(-4) : '—', top.length ? c[top[0]] + ' breakdowns' + (top[1] ? ' · next ' + top[1].slice(-4) + ' (' + c[top[1]] + ')' : '') : 'none in these dates', 'var(--red)'); })() + $m(kpi('Maintenance spend', inr(sum(spendRows, r => r.total)), '', 'var(--orange)')) +
      kpi('Preventive checks', pm.length, checks + ' check items done', 'var(--ok)') + kpi('PM overdue', overdue.length, 'past service interval', overdue.length ? 'var(--red)' : 'var(--ok)') + '</div>' +
      sec('Off road by reason', 'all off-road records in this period', (() => { const R = {}; bdsAll.forEach(b => { const k = b.Off_Road_Type || 'Breakdown'; R[k] = R[k] || { n: 0, h: 0, open: 0 }; R[k].n++; R[k].h += b.inHrs; if (b.open) R[k].open++; });
        const C = { 'Breakdown': 'var(--red)', 'Driver not available': 'var(--s2)', 'Accident': 'var(--s5)', 'Documents / RTO': 'var(--s4)', 'Other': '#9AA4B2' };
        return split(Object.keys(R).map(k => ({ label: k, value: R[k].h, color: C[k] || '#9AA4B2', text: fmt(R[k].h / 24, 1) + ' truck-days' }))) + '<div style="margin-top:10px">' + hbar(Object.keys(R).map(k => ({ label: k, sub: R[k].open + ' still off road', value: R[k].n, color: C[k] || '#9AA4B2', text: R[k].n + ' trucks' }))) + '</div>'; })()) +
      $m(sec('Spend per week', 'job cards + expenses + tyres', columns('cSpend', weeks, [{ name: 'Job cards', color: 'var(--s1)', values: wk(mnt, x => x.Total_Cost) }, { name: 'Truck expenses', color: 'var(--s2)', values: wk(tex, x => x.Amount) }, { name: 'Tyres', color: 'var(--s3)', values: wk(tyr, x => x.Cost) }], { unit: '₹', label: d => 'wk ' + d.slice(8, 10) + '/' + d.slice(5, 7) }))) +
      '<div class="cgrid">' +
      sec('Downtime by truck', 'hours off road in this period', hbar(Object.keys(downT).map(k => ({ label: k, sub: classOf((M.truckM[k] || {}).cap), value: downT[k], color: 'var(--red)', text: fmt(downT[k], 0) + ' h' })), { top: 10 })) +
      $m(sec('Spend by truck', '₹', hbar(spendRows.map(r => ({ label: r.truck, sub: r.cls, value: r.total, color: 'var(--s2)', text: inr(r.total), tip: r.truck + ': jobs ' + inr(r.jobs) + ', expenses ' + inr(r.exp) + ', tyres ' + inr(r.tyres) })), { top: 10 }))) +
      $m(sec('Spend split', '', split([{ label: 'Job cards', value: sum(spendRows, r => r.jobs), color: 'var(--s1)', text: inr(sum(spendRows, r => r.jobs)) }, { label: 'Truck expenses', value: sum(spendRows, r => r.exp), color: 'var(--s2)', text: inr(sum(spendRows, r => r.exp)) }, { label: 'Tyres', value: sum(spendRows, r => r.tyres), color: 'var(--s3)', text: inr(sum(spendRows, r => r.tyres)) }]) +
        '<div class="muted2" style="margin:14px 0 6px">Truck expenses by head</div>' + hbar(Object.keys(heads).map(h => ({ label: h, value: heads[h], color: 'var(--s2)', text: inr(heads[h]) })), { top: 6 }))) +
      sec('Breakdowns by truck', 'number of breakdowns in this period', (() => { const c = {}; bds.forEach(b => c[b.Truck_No] = (c[b.Truck_No] || 0) + 1);
        return hbar(Object.keys(c).map(k => ({ label: k, sub: classOf((M.truckM[k] || {}).cap) + ' · ' + fmt((downT[k] || 0) / 24, 1) + ' days down', value: c[k], color: 'var(--red)', text: c[k] + '×' })), { top: 10 }); })()) +
      '</div>' +
      sec('PM overdue', 'Service_Interval_KM in Truck_Master', hbar(overdue.map(r => ({ label: r.truck, sub: r.cls, value: r.over, color: 'var(--red)', text: fmt(r.over) + ' km over' }))) +
        tv('Table view', table('tPm', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'odo', t: 'KM now', num: 1, f: v => fmt(v) }, { k: 'due', t: 'Due at', num: 1, f: v => fmt(v) }, { k: 'over', t: 'Over by', num: 1, f: v => '<b style="color:var(--red)">' + fmt(v) + '</b>' }], overdue, { sort: 'over' }))) +
      sec('Off-road records', 'in this period', tv('Table view', table('tBd', [{ k: 'Created_At', t: 'Reported', f: v => JNP.dmy(String(v).replace('T', ' ')) }, { k: 'Truck_No', t: 'Truck' }, { k: 'Off_Road_Type', t: 'Type', f: v => E(v || 'Breakdown') }, { k: 'Symptom', t: 'Reason' }, { k: 'Fault_Code', t: 'Fault' },
        { k: 'Breakdown_Status', t: 'Status', f: v => '<span class="pill ' + JNP.statusCls(v) + '">' + E(v) + '</span>' }, { k: 'inHrs', t: 'Down (in period)', num: 1, f: v => fmt(v, 0) + ' h' }, { k: 'Repair_Location', t: 'Repaired at' }, { k: 'Repeat_Flag', t: 'Repeat', f: v => v === 'Yes' ? '<span class="flag bad">Repeat</span>' : '' }], bdsAll, { sort: 'Created_At' }))) +
      $m(sec('Maintenance spend by truck', 'budget = Monthly_RM_Budget for the period', tv('Table view', table('tSp', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'jobs', t: 'Job cards', num: 1, f: inr }, { k: 'exp', t: 'Expenses', num: 1, f: inr }, { k: 'tyres', t: 'Tyres', num: 1, f: inr },
        { k: 'total', t: 'Total', num: 1, f: inr, bar: 1, color: () => 'var(--s2)' }, { k: 'budget', t: 'Budget', num: 1, f: (v, r) => isNaN(v) ? '—' : inr(v) + (r.total > v ? '<span class="flag bad">over</span>' : '') }], spendRows, { sort: 'total' }))));
  }

  function diesel(T) {
    const a = agg(T);
    const cls = CLASSES.map(c => c + 'T').concat(['Other']).map(c => { const g = agg(T.filter(x => x.cls === c)); return { cls: c, trips: g.trips, diesel: g.diesel, rev: g.rev, rpl: revPerL(g), cov: g.trips ? g.dieselTrips / g.trips : NaN, kmpl: g.kmDiesel ? g.km / g.kmDiesel : NaN, lpt: g.trips ? g.diesel / g.trips : NaN }; }).filter(r => r.trips);
    const trk = {}; T.forEach(x => (trk[x.truck] = trk[x.truck] || []).push(x));
    const tr = Object.keys(trk).map(k => { const g = agg(trk[k]); return { truck: k, cls: trk[k][0].cls, trips: g.trips, diesel: g.diesel, rev: g.rev, rpl: revPerL(g), cov: g.trips ? g.dieselTrips / g.trips : NaN, kmpl: g.kmDiesel ? g.km / g.kmDiesel : NaN }; });
    const lowCov = cls.filter(r => r.cov < .7), avgR = revPerL(a);
    const dates = []; for (let d = new Date(M.from); d <= M.to; d = new Date(d.getTime() + 864e5)) dates.push(iso(d));
    const CL = cls.map(r => r.cls);
    return '<div class="kpis">' + $m(kpi('Revenue per litre', isNaN(avgR) ? '—' : '₹' + fmt(avgR, 1), 'total freight ÷ total diesel entered', 'var(--orange)')) + kpi('Diesel entered', fmt(a.diesel) + ' L', 'on ' + a.dieselTrips + ' of ' + a.trips + ' trips') +
      $m(kpi('Freight revenue', inr(a.rev))) + kpi('KM per litre', a.kmDiesel ? fmt(a.km / a.kmDiesel, 2) : '—', 'where next loading KM is known') + '</div>' +
      (lowCov.length ? '<div class="note">⚠️ ' + lowCov.map(r => r.cls).join(', ') + ': diesel is entered on few trips (filled in lumps), so ₹/litre is worked out over the whole period — reliable only when every fill in the period is entered.</div>' : '') +
      sec('Diesel per day', 'litres entered, by class', columns('cDsl', dates, CL.map(c => ({ name: c, color: CLASS_COLOR[c], values: dates.map(d => sum(T.filter(x => x.day === d && x.cls === c), x => x.diesel)) })), { unit: 'L', label: d => d.slice(8, 10) + '/' + d.slice(5, 7) })) +
      '<div class="cgrid">' +
      $m(sec('₹ earned per litre', 'by class', hbar(cls.map(r => ({ label: r.cls, sub: r.cov < .7 ? 'diesel on ' + pct(r.cov) + ' trips' : '', value: r.rpl, color: CLASS_COLOR[r.cls], text: isNaN(r.rpl) ? '—' : '₹' + fmt(r.rpl, 1) })), { ref: avgR, refLabel: 'fleet average ₹' + fmt(avgR, 1) }))) +
      sec('KM per litre', 'by class', hbar(cls.filter(r => !isNaN(r.kmpl)).map(r => ({ label: r.cls, value: r.kmpl, color: CLASS_COLOR[r.cls], text: fmt(r.kmpl, 2) })))) +
      $m(sec('₹ per litre — lowest trucks', 'check these first', hbar(tr.filter(r => !isNaN(r.rpl)).map(r => ({ label: r.truck, sub: r.cls + (r.cov < .7 ? ' · low diesel entry' : ''), value: r.rpl, color: CLASS_COLOR[r.cls], text: '₹' + fmt(r.rpl, 1) })), { top: 10, asc: true, ref: avgR, refLabel: 'fleet average' }))) +
      $m(sec('₹ per litre — best trucks', '', hbar(tr.filter(r => !isNaN(r.rpl)).map(r => ({ label: r.truck, sub: r.cls, value: r.rpl, color: CLASS_COLOR[r.cls], text: '₹' + fmt(r.rpl, 1) })), { top: 10, ref: avgR, refLabel: 'fleet average' }))) +
      '</div>' +
      sec('By class', '', tv('Table view', table('tDc', [{ k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1 }, { k: 'diesel', t: 'Diesel L', num: 1, f: v => fmt(v) }, { k: 'lpt', t: 'L / trip', num: 1, f: v => fmt(v, 0) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'rpl', t: '₹ per litre', num: 1, f: v => isNaN(v) ? '—' : '₹' + fmt(v, 1) }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'cov', t: 'Trips with diesel', num: 1, f: v => v < .7 ? '<span class="flag est">' + pct(v) + '</span>' : pct(v) }], cls, { sort: 'cls' }))) +
      sec('By truck', '', tv('Table view', table('tDt', [{ k: 'truck', t: 'Truck' }, { k: 'cls', t: 'Class', f: v => clsTag(v) }, { k: 'trips', t: 'Trips', num: 1 }, { k: 'diesel', t: 'Diesel L', num: 1, f: v => fmt(v) }, { k: 'rev', t: 'Revenue', num: 1, f: inr },
        { k: 'rpl', t: '₹ per litre', num: 1, f: v => isNaN(v) ? '—' : '₹' + fmt(v, 1) }, { k: 'kmpl', t: 'KM/L', num: 1, f: v => fmt(v, 2) }, { k: 'cov', t: 'Trips with diesel', num: 1, f: v => v < .7 ? '<span class="flag est">' + pct(v) + '</span>' : pct(v) }], tr, { sort: 'rpl' })));
  }

  load();
})();
</script>
