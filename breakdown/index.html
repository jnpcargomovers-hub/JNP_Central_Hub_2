<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Off-Road · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <style>
    #in_Off_Road_Type button:nth-child(-n+2) { flex: 1 1 45%; padding: 16px 10px; font-size: 16px; }
    .bigtile { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 18px 16px; background: #fff; border-radius: 18px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); border-left: 6px solid var(--red); }
    .bigtile.res { border-left-color: var(--orange); }
    .bigtile .bi { font-size: 34px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 14px; flex: none; }
    .bigtile b { display: block; font-size: 18px; color: var(--navy); } .bigtile small { display: block; font-size: 15px; color: var(--muted); font-weight: 600; }
    .bigtile em { display: block; font-style: normal; font-size: 12.5px; color: var(--muted); margin-top: 4px; } .bigtile .go { margin-left: auto; font-size: 28px; color: var(--muted); }
    .backlink { display: inline-block; margin-top: 12px; font-weight: 800; color: var(--blue); text-decoration: none; }
  </style>
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="home" class="hidden">
      <a class="bigtile" id="goAdd" href="?tab=report"><span class="bi">🚧</span><span><b>Add new off-road</b><small>नया ऑफ-रोड जोड़ें</small><em>Breakdown · No driver · Accident · Documents</em></span><span class="go">›</span></a>
      <a class="bigtile res" id="goRes" href="?tab=resolve"><span class="bi">🛠️</span><span><b>Off-road resolution</b><small>ऑफ-रोड समाधान</small><em id="resInfo">Trucks off road now — update, mark back on road</em></span><span class="go">›</span></a>
    </div>
    <div id="backRow" class="hidden"><a class="backlink" href="./">‹ Off-Road · ऑफ-रोड</a></div>
    <div id="tabs" class="hidden"></div>
    <div id="repView" class="hidden">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Report truck off road · गाड़ी बंद</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn red" type="submit">🚧 Report off road</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="openView" class="hidden">
      <div class="card list"><h3 class="cardh"><span>Off road now</span><button class="mini" id="reload" type="button">↻</button></h3>
        <div class="seg small" id="typeSeg" style="margin-bottom:10px"></div>
        <div id="open" class="muted">Loading…</div></div>
      <div id="detail" class="card hidden"></div>
      <form id="uf" class="card hidden" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Update · अपडेट</span></h3>
        <div id="ufields"></div>
        <div id="uerr" class="err hidden"></div>
        <button id="ubtn" class="btn orange" type="submit">Update · अपडेट करें</button>
      </form>
      <div id="udone" class="card hidden"></div>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  JNP.header($('hdr'), 'Off-Road', 'गाड़ी बंद · ब्रेकडाउन · ड्राइवर नहीं');
  const ctx = await JNP.requireModule(['OPS-06', 'RM-01']);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  const me = JNP.session().user;
  const canReport = JNP.can('OPS-06', 'E');
  const canFixRm = JNP.can('RM-01', 'E') || ctx.isL1;
  const canFixOps = ctx.isL1 || JNP.can('RM-01', 'E') || (JNP.can('OPS-06', 'E') && me.role !== 'Loader');
  const isRm = t => !t || t === 'Breakdown' || t === 'Accident';
  const FLOW = ['Reported', 'Acknowledged by R&M', 'Mechanic / Towing Sent', 'Under Repair', 'Resolved - Back on Road', 'Closed (Verified)'];
  const TYPES = [{ v: 'Breakdown', t: '🔧 Breakdown · ब्रेकडाउन' }, { v: 'Driver not available', t: '👤 Driver · ड्राइवर' }, { v: 'Other', t: '⋯ Other · अन्य' }];
  const OTHER_KINDS = [{ v: 'Accident', t: '💥 Accident · दुर्घटना' }, { v: 'Documents / RTO', t: '📄 Documents / RTO hold · कागज़ात' }, { v: 'No load', t: '📦 No load · माल नहीं' }, { v: 'Other', t: '⋯ Something else · कुछ और' }];
  const LIST_TYPES = ['Breakdown', 'Driver not available', 'Accident', 'Documents / RTO', 'Other'];
  const ICON = { 'Breakdown': '🔧', 'Driver not available': '🧑', 'Accident': '💥', 'Documents / RTO': '📄', 'Other': '⋯' };
  const rmMobile = JNP.M().settings.Vehicle_Maintenance_Mobile || '';
  let pos = null, clientReqId = JNP.uid(), rows = [], cur = null, typeFilter = 'All';
  const ty = v => (v.Off_Road_Type === 'Other' && (v.oth_kind === 'Accident' || v.oth_kind === 'Documents / RTO')) ? v.oth_kind : (v.Off_Road_Type || 'Breakdown');

  // ---------- REPORT
  const isDrv = v => ty(v) === 'Driver not available';
  const DRV_REASONS = [{ v: 'Driver on leave / sick', t: 'On leave or sick · छुट्टी / बीमार' }, { v: 'Driver absent (no notice)', t: 'Absent without telling · बिना बताए गायब' }, { v: 'Driver left job', t: 'Left the job · नौकरी छोड़ी' }, { v: 'No driver assigned', t: 'No driver given · ड्राइवर नहीं दिया' }];
  const F = JNP.form($('fields'), [
    { k: 'Off_Road_Type', label: 'Why is the truck off road?', hi: 'गाड़ी क्यों बंद है', type: 'seg', options: TYPES, value: 'Breakdown', req: true },
    { k: 'Truck_No', label: 'Truck', hi: 'गाड़ी', type: 'truck', req: true, allowNew: false },
    { k: 'oth_kind', label: 'What is it?', hi: 'क्या हुआ', type: 'seg', noSend: true, options: OTHER_KINDS, req: v => v.Off_Road_Type === 'Other', show: v => v.Off_Road_Type === 'Other' },
    // ---- breakdown / accident
    { k: 'sym_bd', label: 'Problem', hi: 'समस्या', type: 'symptom', noSend: true, req: v => ty(v) === 'Breakdown', show: v => ty(v) === 'Breakdown' },
    { k: 'Details', label: 'What happened?', hi: 'क्या हुआ? पूरी जानकारी', type: 'textarea', ph: 'e.g. air pressure dropped near Songir, brake hard, smoke from engine…', req: v => isRm(ty(v)), show: v => !isDrv(v) },
    // ---- driver
    { k: 'sym_drv', label: 'What happened with the driver?', hi: 'ड्राइवर को क्या हुआ', type: 'select', noSend: true, options: DRV_REASONS, req: isDrv, show: isDrv },
    { k: 'Leave_From', label: 'Leave from', hi: 'छुट्टी कब से', type: 'date', half: true, show: v => isDrv(v) && /leave|sick/i.test(v.sym_drv) },
    { k: 'Leave_To', label: 'Leave till', hi: 'कब तक', type: 'date', half: true, show: v => isDrv(v) && /leave|sick/i.test(v.sym_drv) },
    // ---- documents / other
    { k: 'sym_doc', label: 'Document problem', type: 'select', noSend: true, options: ['Fitness expired', 'Permit expired', 'Insurance expired', 'Tax / PUC expired', 'RTO / police hold', 'Other document'], req: v => ty(v) === 'Documents / RTO', show: v => ty(v) === 'Documents / RTO' },
    { k: 'sym_oth', label: 'Reason', hi: 'कारण', noSend: true, req: v => ty(v) === 'Other' && v.oth_kind === 'Other', show: v => ty(v) === 'Other' && v.oth_kind === 'Other', ph: 'e.g. owner hold' },
    // ---- driver on the truck
    { k: 'Driver_Name', label: 'Driver', hi: 'ड्राइवर', type: 'driver', req: isDrv, labelFn: v => isDrv(v) ? 'Driver who is not available' : 'Driver on the truck' },
    { k: 'Driver_Mobile', label: 'Driver mobile', hi: 'ड्राइवर का नंबर', type: 'num', ph: '10 digits' },
    { k: 'Replacement_Given', label: 'Has he given a replacement driver?', hi: 'क्या बदले में दूसरा ड्राइवर दिया?', type: 'seg', options: [{ v: 'Yes', t: 'Yes · हाँ' }, { v: 'No', t: 'No · नहीं' }], value: 'No', show: isDrv },
    { k: 'Replacement_Driver', label: 'Replacement driver name', hi: 'नए ड्राइवर का नाम', type: 'driver', req: v => isDrv(v) && v.Replacement_Given === 'Yes', show: v => isDrv(v) && v.Replacement_Given === 'Yes' },
    { k: 'Replacement_Mobile', label: 'Replacement driver mobile (optional)', hi: 'नए ड्राइवर का नंबर', type: 'num', ph: '10 digits', show: v => isDrv(v) && v.Replacement_Given === 'Yes' },
    { k: 'Loaded', label: 'Loaded?', hi: 'माल भरा है?', type: 'seg', options: ['Yes', 'No'], half: true },
    { k: 'LR_No', label: 'LR (if loaded)', upper: true, half: true, show: v => v.Loaded === 'Yes' },
    { k: 'Location', label: 'Where is the truck?', hi: 'गाड़ी कहाँ है', req: true, ph: 'e.g. Depot, Songir, Dhule bypass' },
    { k: 'gps', type: 'html', html: '<button class="mini orange" type="button" id="gpsBtn">📍 Add my GPS location</button> <span id="gpsInfo" class="hint"></span><div style="height:12px"></div>' },
    { k: 'Report_Photo_URLs', label: 'Photos', hi: 'फोटो', type: 'photo', multiple: true, show: v => !isDrv(v) },
  ], { module: 'OPS-06' });
  F.on(k => {
    if (k === 'Off_Road_Type' || k === '_init') { const d = isDrv(F.all()); const l = F.field('Driver_Name').querySelector('label'); if (l) l.innerHTML = (d ? 'Driver who is not available <span class="hi">· कौन सा ड्राइवर</span>' : 'Driver on the truck <span class="hi">· ड्राइवर</span>'); if (l) l.classList.toggle('req', d); }
    if (k !== 'Truck_No') return;
    const t = JNP.findTruck(F.val('Truck_No'));
    if (t && t.driver && !F.val('Driver_Name')) { F.set('Driver_Name', t.driver); const d = JNP.findDriver(t.driver); if (d && d.mobile) F.set('Driver_Mobile', d.mobile); }
    F.info('Truck_No', t && t.opStatus && t.opStatus !== 'On Road' ? '<span class="warnline">Status now: ' + JNP.esc(t.opStatus) + '</span>' : '');
  });
  $('gpsBtn').onclick = async () => {
    $('gpsInfo').textContent = 'Getting location…';
    try { pos = await JNP.geo(); $('gpsInfo').innerHTML = '<span class="okline">✓ ' + pos.lat.toFixed(5) + ', ' + pos.lng.toFixed(5) + '</span>'; }
    catch (e) { $('gpsInfo').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  };
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const a = F.all(), t = ty(a);
      const sym = t === 'Breakdown' ? a.sym_bd : t === 'Accident' ? 'Accident' : t === 'Driver not available' ? a.sym_drv : t === 'Documents / RTO' ? a.sym_doc : a.oth_kind === 'No load' ? 'No load' : a.sym_oth;
      const data = Object.assign(F.values(), { Symptom: sym, Off_Road_Type: t }, pos ? { Latitude: pos.lat, Longitude: pos.lng } : {});
      const out = await JNP.call('save', { module: 'OPS-06', clientReqId: clientReqId, data: data });
      const r = out.record;
      const msg = JNP.waText('🚧 OFF ROAD · ' + r.Truck_No + ' · ' + (r.Off_Road_Type === 'Driver not available' ? 'Driver' : r.Off_Road_Type), [['Reason', r.Symptom], ['What happened', r.Details],
        ['Leave', r.Leave_From ? JNP.dmy(String(r.Leave_From).slice(0, 10)) + (r.Leave_To ? ' to ' + JNP.dmy(String(r.Leave_To).slice(0, 10)) : '') : ''],
        ['Replacement', r.Replacement_Given === 'Yes' ? r.Replacement_Driver + (r.Replacement_Mobile ? ' (' + r.Replacement_Mobile + ')' : '') : r.Off_Road_Type === 'Driver not available' ? 'Not given — arrange a driver' : ''],
        ['Location', r.Location], ['Map', pos ? 'https://maps.google.com/?q=' + pos.lat + ',' + pos.lng : ''],
        ['Driver', r.Driver_Name ? r.Driver_Name + (r.Driver_Mobile ? ' (' + r.Driver_Mobile + ')' : '') : ''], ['Loaded', r.Loaded === 'Yes' ? 'Yes' + (r.LR_No ? ' · LR ' + r.LR_No : '') : r.Loaded],
        ['Photo', (r.Report_Photo_URLs || '').split(' ')[0]], ['Ref', r.Record_ID]], isRm(r.Off_Road_Type) ? 'R&M please acknowledge: ' + JNP.CONFIG.HUB + 'breakdown/?tab=resolve&id=' + r.Record_ID : 'Operations: arrange ' + (r.Off_Road_Type === 'Driver not available' ? 'a driver' : 'clearance') + ' — ' + JNP.CONFIG.HUB + 'breakdown/?tab=resolve&id=' + r.Record_ID);
      $('f').classList.add('hidden');
      const btns = [{ label: '📲 Share on WhatsApp · भेजें', onClick: () => JNP.whatsapp(msg) }];
      JNP.done($('doneCard'), { title: 'OFF ROAD REPORTED', big: r.Truck_No, sub: r.Off_Road_Type + ' · ' + r.Symptom + ' · ' + r.Location, buttons: btns,
        onNew: () => { F.reset(); pos = null; $('gpsInfo').textContent = ''; clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });

  // ---------- OFF ROAD NOW + UPDATE
  $('typeSeg').innerHTML = ['All'].concat(LIST_TYPES).map(v => '<button type="button" data-v="' + v + '" class="' + (v === 'All' ? 'on' : '') + '">' + (v === 'All' ? 'All' : ICON[v] + ' ' + (v === 'Driver not available' ? 'No driver' : v.split(' ')[0])) + '</button>').join('');
  $('typeSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; typeFilter = b.dataset.v; $('typeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  async function loadOpen() {
    $('open').innerHTML = 'Loading…';
    try { rows = (await JNP.call('openBreakdowns', { includeRecent: true })).rows; draw();
      const want = JNP.param('id'); if (want && !cur) { const r = rows.find(x => x.Record_ID === want); if (r) show(r); } }
    catch (e) { $('open').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  let shown = [];
  function draw() {
    const f = rows.filter(r => typeFilter === 'All' || ty(r) === typeFilter);
    const openR = f.filter(r => !r.Back_On_Road_At), backR = f.filter(r => r.Back_On_Road_At);
    shown = openR.concat(backR);
    const openN = rows.filter(r => !r.Back_On_Road_At), cnt = {}; openN.forEach(r => cnt[ty(r)] = (cnt[ty(r)] || 0) + 1);
    const fmt = r => ({ t: ICON[ty(r)] + ' ' + JNP.esc(r.Truck_No + ' · ' + r.Symptom), s: JNP.esc(r.Location + ' · ' + (r.Back_On_Road_At ? 'back on road ' + JNP.dmy(r.Back_On_Road_At) : 'off ' + (r.Open_Hrs >= 48 ? Math.round(r.Open_Hrs / 24) + ' days' : r.Open_Hrs + ' h')) + ' · by ' + r.Created_By), tag: r.Back_On_Road_At ? '🟢 On road' : '🔴 Off road', cls: r.Back_On_Road_At ? 'ok' : 'bad', click: 1 });
    const idx = (list, off) => JNP.rowsHtml(list, fmt, '').replace(/data-i="(\d+)"/g, (m, n) => 'data-i="' + (Number(n) + off) + '"');
    $('open').innerHTML = '<div class="hint" style="margin-bottom:6px">' + openN.length + ' off road now: ' + Object.keys(cnt).map(k => ICON[k] + ' ' + cnt[k]).join(' · ') + '</div>' +
      (openR.length ? idx(openR, 0) : '<div class="hint">No trucks off road 🎉</div>') +
      (backR.length ? '<div class="grouph" style="margin-top:14px">✅ Back on road — last 3 days · चालू हुई (' + backR.length + ')</div><div style="opacity:.75">' + idx(backR, openR.length) + '</div>' : '');
  }
  $('open').onclick = e => { const it = e.target.closest('.item'); if (it) show(shown[Number(it.dataset.i)]); };
  $('reload').onclick = loadOpen;

  let U = null;
  function show(r) {
    cur = r; $('udone').classList.add('hidden');
    const t = ty(r), rm = isRm(t), photos = (r.Report_Photo_URLs || '').split(/\s+/).filter(Boolean);
    $('detail').innerHTML = '<h3 class="cardh"><span>' + ICON[t] + ' ' + JNP.esc(r.Truck_No) + '</span><span class="pill ' + (r.Back_On_Road_At ? 'ok' : 'bad') + '">' + (r.Back_On_Road_At ? '🟢 On road' : '🔴 Off road') + '</span></h3>' +
      '<div class="kv">' + [['Type', t], ['Reason', r.Symptom], ['What happened', r.Details], ['Location', r.Location], ['Driver', r.Driver_Name + (r.Driver_Mobile ? ' · ' + r.Driver_Mobile : '')],
        ['Leave', r.Leave_From ? JNP.dmy(String(r.Leave_From).slice(0, 10)) + (r.Leave_To ? ' → ' + JNP.dmy(String(r.Leave_To).slice(0, 10)) : '') : ''],
        ['Replacement', r.Replacement_Given === 'Yes' ? r.Replacement_Driver + (r.Replacement_Mobile ? ' · ' + r.Replacement_Mobile : '') : t === 'Driver not available' ? 'Not given' : ''],
        ['Repaired', r.Repair_Mode], ['Loaded', r.Loaded + (r.LR_No ? ' · ' + r.LR_No : '')],
        ['Reported', JNP.dmy(r.Created_At) + ' by ' + r.Created_By], ['Off road for', r.Open_Hrs >= 48 ? Math.round(r.Open_Hrs / 24) + ' days' : r.Open_Hrs + ' h'], ['Fault', r.Fault_Code], ['Repair at', r.Repair_Location], ['Mechanic', r.Assigned_To || r.Vendor], ['Repair cost', JNP.inr(r.Repair_Cost)]]
        .filter(x => x[1]).map(x => '<span>' + x[0] + '</span><b>' + JNP.esc(x[1]) + '</b>').join('') + '</div>' +
      (r.Latitude ? '<a class="mini" target="_blank" href="https://maps.google.com/?q=' + r.Latitude + ',' + r.Longitude + '">📍 Map</a> ' : '') +
      (r.Driver_Mobile ? '<a class="mini" href="tel:' + JNP.esc(r.Driver_Mobile) + '">📞 Call driver</a> ' : '') +
      (r.Replacement_Mobile ? '<a class="mini" href="tel:' + JNP.esc(r.Replacement_Mobile) + '">📞 Call replacement</a> ' : '') +
      (rm && JNP.can('RM-03', 'E') ? '<a class="mini orange" href="../truck-expense/?truck=' + encodeURIComponent(r.Truck_No) + '&bd=' + encodeURIComponent(r.Record_ID) + '">💸 Raise expense</a>' : '') +
      (rm ? '<div class="grouph">Expenses for this breakdown · खर्च</div>' + ((r.Expenses || []).length ? JNP.rowsHtml(r.Expenses, x => ({ t: JNP.esc(JNP.inr(x.amt) + ' · ' + x.head), s: JNP.esc((x.vendor || '') + ' · ' + x.id), tag: x.status, cls: JNP.statusCls(x.status) })) : '<div class="hint">None yet. If it is repaired in-house with no spend, nothing to raise.</div>') : '') +
      (photos.length ? '<div class="thumbs">' + photos.map(u => '<a href="' + JNP.esc(u) + '" target="_blank"><img src="' + JNP.esc(JNP.driveThumb(u)) + '"></a>').join('') + '</div>' : '') +
      '<div class="grouph">Timeline</div><div id="log" class="list muted">Loading…</div>';
    $('detail').classList.remove('hidden'); $('detail').scrollIntoView({ behavior: 'smooth' });
    JNP.call('breakdownLog', { id: r.Record_ID }).then(o => $('log').innerHTML = JNP.rowsHtml(o.rows, x => ({ t: JNP.esc(/Resolved/.test(x.To_Status) ? '🟢 Back on road' : /Closed/.test(x.To_Status) ? 'Closed' : x.From_Status ? '📝 Update' : '🔴 Reported off road'), s: JNP.esc(JNP.dmy(x.At) + ' · ' + x.By + (x.Note ? ' · ' + x.Note : '')) }), '—')).catch(() => { });
    const may = rm ? canFixRm : canFixOps;
    if (!may || r.Back_On_Road_At) { $('uf').classList.add('hidden'); return; }
    const isD = t === 'Driver not available', back = v => v.act === 'back', note = v => v.act === 'note';
    const LOCS = [{ v: 'On Road (Spot)', t: 'On the spot · मौके पर' }, { v: 'Local Garage', t: 'Outside garage · बाहर गैराज' }, { v: 'JNP Yard / Depot', t: 'Our yard · अपना यार्ड' }];
    U = JNP.form($('ufields'), [
      { k: 'act', label: 'What do you want to do?', hi: 'क्या करना है', type: 'seg', noSend: true, req: true, options: [{ v: 'back', t: isD ? '🟢 Driver assigned · on road' : '🟢 Back on road · गाड़ी चालू' }, { v: 'note', t: '📝 Add update · अपडेट' }] },
      // ---- back on road
      { k: 'Fault_Code', label: 'Actual fault', hi: 'असली खराबी', type: 'fault', allowNew: false, value: r.Fault_Code || '', req: v => back(v) && rm, show: v => back(v) && rm },
      { k: 'Repair_Mode', label: 'How was it repaired?', hi: 'कैसे ठीक हुआ', type: 'seg', options: [{ v: 'In-house (no expense)', t: '🏠 In-house · बिना खर्च' }, { v: 'With expense', t: '💸 With expense · खर्च हुआ' }], value: r.Repair_Mode || '', req: v => back(v) && rm, show: v => back(v) && rm },
      { k: 'expHint', type: 'html', html: (r.Expenses || []).length ? '' : '<div class="warnline" style="margin:-4px 0 10px">No expense raised yet for this breakdown — <a href="../truck-expense/?truck=' + encodeURIComponent(r.Truck_No) + '&bd=' + encodeURIComponent(r.Record_ID) + '">💸 raise it now</a> (can be done after back on road too).</div>', show: v => back(v) && v.Repair_Mode === 'With expense' },
      { k: 'Driver_Name', label: 'Driver now on the truck', hi: 'नया ड्राइवर कौन', type: 'driver', value: r.Replacement_Driver || '', req: v => back(v) && isD, show: v => back(v) && isD },
      { k: 'Driver_Mobile', label: 'His mobile', hi: 'नंबर', type: 'num', ph: '10 digits', value: r.Replacement_Mobile || '', show: v => back(v) && isD },
      { k: 'Repair_Location', label: 'Where was it repaired?', hi: 'कहाँ ठीक हुआ', type: 'seg', options: LOCS, value: r.Repair_Location === 'Authorised Service Centre' ? 'Local Garage' : (r.Repair_Location || ''), show: v => rm && (back(v) || note(v)) },
      { k: 'Vendor', label: 'Garage / mechanic', hi: 'गैराज', type: 'vendor', value: r.Vendor || '', show: v => rm && (back(v) || note(v)) && v.Repair_Location === 'Local Garage' },
      { k: 'Resolution_Note', label: 'What was done', hi: 'क्या काम किया', type: 'textarea', ph: isD ? 'e.g. replacement joined / driver back from leave' : rm ? 'e.g. air pipe changed' : 'e.g. fitness renewed', show: back },
      { k: 'Resolution_Photo_URLs', label: 'Photos after repair', hi: 'फोटो', type: 'photo', multiple: true, show: v => back(v) && rm },
      // ---- update only (truck stays off road)
      { k: 'note', label: 'Update', hi: 'क्या चल रहा है', type: 'textarea', ph: rm ? 'e.g. mechanic reached / part coming from Dhule tomorrow' : 'e.g. driver will join on Monday', req: note, show: note },
      { k: 'Photo_URL', label: 'Photo (optional)', hi: 'फोटो', type: 'photo', show: note },
    ], { module: 'RM-01' });
    U.on(k => { if (k === 'act' || k === '_init') $('ubtn').innerHTML = U.val('act') === 'back' ? '🟢 Mark on road · गाड़ी चालू' : U.val('act') === 'note' ? '📝 Save update · सेव करें' : 'Choose above · ऊपर चुनें'; });
    $('uf').classList.remove('hidden');
  }
  $('uf').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('ubtn'), $('uerr'), async () => {
      const bad = U.check(); if (bad) throw new Error(bad);
      const act = U.val('act'), d = U.values();
      d.Breakdown_Status = act === 'back' ? 'Resolved - Back on Road' : (isRm(ty(cur)) && FLOW.indexOf(cur.Breakdown_Status) < 3 ? 'Under Repair' : cur.Breakdown_Status);   // inside only — the team sees Off road / On road
      const out = await JNP.call('bdUpdate', { id: cur.Record_ID, data: d });
      const r = out.record, t = ty(r);
      const msg = out.backOnRoad
        ? JNP.waText('✅ BACK ON ROAD · ' + r.Truck_No, [['Was off road', t + ' — ' + r.Symptom], ['Fault', r.Fault_Code], ['Driver', r.Driver_Name + (r.Driver_Mobile ? ' (' + r.Driver_Mobile + ')' : '')], ['Work done', r.Resolution_Note], ['Repaired', r.Repair_Mode], ['Repaired at', r.Repair_Location], ['Garage', r.Vendor],
            ['Off road for', r.Downtime_Hrs >= 48 ? Math.round(r.Downtime_Hrs / 24) + ' days' : r.Downtime_Hrs + ' h'], ['Repeat fault', r.Repeat_Flag === 'Yes' ? '⚠️ YES' : ''], ['Ref', r.Record_ID]])
        : JNP.waText('🔴 OFF ROAD · UPDATE · ' + r.Truck_No, [['Reason', r.Symptom], ['Mechanic', r.Assigned_To], ['Repair at', r.Repair_Location], ['Note', U.val('note')], ['Ref', r.Record_ID]]);
      $('uf').classList.add('hidden');
      JNP.done($('udone'), { title: out.backOnRoad ? 'BACK ON ROAD' : 'UPDATE SAVED', big: r.Truck_No, sub: (out.backOnRoad ? '🟢 On road' : '🔴 Still off road') + (r.Downtime_Hrs ? ' · was off road ' + r.Downtime_Hrs + ' h' : ''),
        buttons: [{ label: '📲 Share on WhatsApp', onClick: () => JNP.whatsapp(msg) }] });
      cur = null; loadOpen();
    });
  });

  // Landing: two big tiles (Add new / Resolution). ?tab=report or ?tab=resolve opens one directly.
  const want = JNP.param('tab');
  function openPane(t) {
    $('home').classList.add('hidden'); $('backRow').classList.remove('hidden');
    $('repView').classList.toggle('hidden', t !== 'report'); $('openView').classList.toggle('hidden', t !== 'resolve');
    if (t === 'resolve') loadOpen();
    window.scrollTo(0, 0);
  }
  if (want === 'report' && canReport) openPane('report');
  else if (want === 'resolve' || !canReport) openPane('resolve');
  else {
    $('repView').classList.add('hidden'); $('openView').classList.add('hidden'); $('home').classList.remove('hidden');
    JNP.call('openBreakdowns', {}).then(o => { $('resInfo').textContent = o.rows.length + ' trucks off road now · ' + o.rows.length + ' गाड़ियाँ बंद'; }).catch(() => { });
  }
})();
</script>
</body>
</html>
