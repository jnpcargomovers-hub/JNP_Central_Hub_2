<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Delivery Indent · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <form id="find" class="card" autocomplete="off">
      <h3 class="cardh"><span>Material Delivery · डिलीवरी</span></h3>
      <div class="field">
        <label class="req" for="lr">LR Number · एलआर नंबर</label>
        <div class="btnrow"><input id="lr" class="input upper" placeholder="e.g. A21306" style="font-weight:800;font-size:18px"><button class="btn" style="width:auto;padding:0 18px" type="submit">Find</button></div>
      </div>
      <div id="findErr" class="err hidden"></div>
    </form>

    <div id="lrCard" class="card hidden">
      <h3 class="cardh"><span id="lrTitle"></span><span class="pill blue" id="lrSrc"></span></h3>
      <div class="kv" id="lrKV"></div>
      <form id="f" autocomplete="off" novalidate><div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Save Delivery · सेव करें</button>
      </form>
    </div>
    <div id="doneCard" class="card hidden"></div>

    <div class="card list">
      <h3 class="cardh"><span>On the road — delivery pending</span><button class="mini" id="reload" type="button">↻</button></h3>
      <div id="pending" class="muted">Loading…</div>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  JNP.header($('hdr'), 'Delivery Indent', 'मटेरियल डिलीवरी इंडेंट');
  const ctx = await JNP.requireModule('OPS-02');
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  let src = null, issued = 0, clientReqId = JNP.uid();

  const F = JNP.form($('fields'), [
    { k: 'Qty_Delivered_MT', label: 'Delivered quantity (MT)', hi: 'डिलीवर मात्रा', type: 'dec', req: true, ph: 'e.g. 33.960' },
    { k: 'Shortage_Reason', label: 'Shortage reason', hi: 'कमी का कारण', type: 'select', list: 'Shortage_Reason', req: true, show: v => shortKg(v) > 0 },
    { k: 'POD_Status', label: 'POD', hi: 'पीओडी', type: 'select', list: 'POD_Status', req: true, value: 'Received - Hard Copy' },
    { k: 'POD_Photo_URL', label: 'POD photo', hi: 'पीओडी फोटो', type: 'photo' },
    { k: 'Unloaded_At', label: 'Unloaded at', hi: 'खाली हुआ', type: 'datetime', hint: 'Leave blank = now' },
    { k: 'Remark', label: 'Remark' },
  ], { module: 'OPS-02' });
  function shortKg(v) { const d = Number(v.Qty_Delivered_MT); return issued && d ? Math.round((issued - d) * 1000) : 0; }
  F.on(k => {
    if (k !== 'Qty_Delivered_MT') return;
    const d = Number(F.val('Qty_Delivered_MT')), s = shortKg(F.all());
    F.info('Qty_Delivered_MT', d > 100 ? '<span class="badline">Enter MT, not kg</span>' : !issued || !d ? '' : s > 0 ? '<span class="warnline">Short ' + s + ' kg</span>' : s < 0 ? '<span class="okline">Excess ' + (-s) + ' kg</span>' : '<span class="okline">Full quantity</span>');
  });

  const q = JNP.param('lr'); if (q) { $('lr').value = q; find(); }
  $('find').addEventListener('submit', e => { e.preventDefault(); find(); });
  async function find() {
    $('findErr').classList.add('hidden'); $('lrCard').classList.add('hidden'); $('doneCard').classList.add('hidden');
    const lr = $('lr').value.replace(/\s+/g, '').toUpperCase(); if (!lr) return;
    JNP.busy(true);
    try {
      const out = await JNP.call('lookupLR', { lr: lr });
      if (out.indent) throw new Error('Delivery for ' + lr + ' already entered: ' + out.indent.Qty_Delivered_MT + ' MT on ' + JNP.dmy(out.indent.Created_At) + ' by ' + out.indent.Created_By);
      src = Object.assign({}, out.loader, out.builty || {}); issued = out.builty ? Number(out.builty.Qty_MT) : 0;
      $('lrTitle').textContent = 'LR ' + src.LR_No; $('lrSrc').textContent = out.builty ? 'From Builty' : 'No builty yet';
      $('lrKV').innerHTML = [['Truck', src.Truck_No], ['Driver', src.Driver_Name], ['Party', src.Consignee || '—'], ['Destination', src.Destination], ['DI', src.DI_No || '—'], ['Issued', issued ? issued + ' MT' : '—']]
        .map(r => '<span>' + r[0] + '</span><b>' + JNP.esc(r[1]) + '</b>').join('');
      F.reset(); clientReqId = JNP.uid();
      $('lrCard').classList.remove('hidden'); if (!ctx.can('E')) $('f').classList.add('hidden');
    } catch (e) { $('findErr').textContent = e.message; $('findErr').classList.remove('hidden'); }
    finally { JNP.busy(false); }
  }

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const v = F.values(); if (v.Unloaded_At) v.Unloaded_At = v.Unloaded_At.replace('T', ' ');
      const out = await JNP.call('save', { module: 'OPS-02', clientReqId: clientReqId, data: Object.assign({ LR_No: src.LR_No }, v) });
      const r = out.record;
      const msg = JNP.waText('DELIVERED · ' + r.LR_No, [['Truck', r.Truck_No], ['Driver', r.Driver_Name], ['Party', r.Consignee], ['Destination', r.Destination],
        ['Issued', r.Qty_Issued_MT ? r.Qty_Issued_MT + ' MT' : ''], ['Delivered', r.Qty_Delivered_MT + ' MT'],
        ['Shortage', r.Shortage_KG > 0 ? r.Shortage_KG + ' kg (' + r.Shortage_Reason + ')' : ''], ['POD', r.POD_Status], ['POD photo', r.POD_Photo_URL]]);
      $('lrCard').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'DELIVERY SAVED', big: r.LR_No, sub: r.Truck_No + ' · ' + r.Qty_Delivered_MT + ' MT' + (r.Shortage_KG > 0 ? ' · short ' + r.Shortage_KG + ' kg' : ''),
        buttons: [{ label: '📲 Share on WhatsApp', onClick: () => JNP.whatsapp(msg) }],
        onNew: () => { $('doneCard').classList.add('hidden'); $('lr').value = ''; $('lr').focus(); } });
      loadPending();
    });
  });

  async function loadPending() {
    try {
      const [B, I] = await Promise.all([JNP.call('list', { module: 'OPS-03', days: 10, limit: 150 }), JNP.call('list', { module: 'OPS-02', days: 15, limit: 300 })]);
      const done = {}; I.rows.forEach(x => done[x.LR_No] = 1);
      const rows = B.rows.filter(r => !done[r.LR_No]);
      $('pending').innerHTML = JNP.rowsHtml(rows, r => {
        const hrs = Math.round((Date.now() - new Date(String(r.Created_At).replace(' ', 'T'))) / 36e5);
        return { t: JNP.esc(r.LR_No + ' · ' + r.Truck_No), s: JNP.esc(r.Consignee + ' · ' + r.Destination + ' · ' + r.Qty_MT + ' MT'), tag: hrs + ' h', cls: hrs > 48 ? 'bad' : hrs > 24 ? 'warn' : '', click: 1 };
      }, 'No pending deliveries.');
      $('pending').onclick = e => { const it = e.target.closest('.item'); if (!it) return; $('lr').value = rows[Number(it.dataset.i)].LR_No; find(); window.scrollTo(0, 0); };
    } catch (e) { $('pending').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  $('reload').onclick = loadPending; loadPending();
})();
</script>
</body>
</html>
