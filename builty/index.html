<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Builty · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="../builty.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <form id="find" class="card" autocomplete="off">
      <h3 class="cardh"><span>Builty (LR) · बिल्टी</span></h3>
      <div class="field">
        <label class="req" for="lr">LR Number · एलआर नंबर</label>
        <div class="btnrow"><input id="lr" class="input upper" placeholder="e.g. A21306" style="font-weight:800;font-size:18px"><button class="btn" style="width:auto;padding:0 18px" type="submit">Find</button></div>
        <div class="hint">Truck, driver, date and destination come from the Loader entry.</div>
      </div>
      <div id="findErr" class="err hidden"></div>
    </form>

    <div id="lrCard" class="card hidden">
      <h3 class="cardh"><span id="lrTitle"></span><span class="pill blue">From Loader</span></h3>
      <div class="kv" id="lrKV"></div>
      <form id="f" autocomplete="off" novalidate><div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Save Builty · सेव करें</button>
      </form>
    </div>

    <div id="doneCard" class="card hidden"></div>

    <div class="card list">
      <h3 class="cardh"><span>Loaded, builty pending</span><button class="mini" id="reload" type="button">↻</button></h3>
      <div id="pending" class="muted">Loading…</div>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  JNP.header($('hdr'), 'Builty (LR PDF)', 'बिल्टी');
  const ctx = await JNP.requireModule('OPS-03');
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  let loader = null, clientReqId = JNP.uid();

  const F = JNP.form($('fields'), [
    { k: 'DI_No', label: 'DI Number', hi: 'डीआई नंबर', type: 'num', req: true, ph: '10 digits' },
    { k: 'Invoice_No', label: 'Invoice No.', hi: 'इनवॉइस', ph: 'optional' },
    { k: 'Consignee', label: 'Consignee (Party)', hi: 'पार्टी', type: 'party', req: true },
    { k: 'Grade', label: 'Grade', hi: 'ग्रेड', type: 'select', list: 'Cement_Grade', req: true, half: true },
    { k: 'Load_Type', label: 'Load', type: 'seg', options: ['BAG', 'BULK'], req: true, value: 'BAG', half: true },
    { k: 'Qty_MT', label: 'Quantity (MT)', hi: 'मात्रा', type: 'dec', req: true, ph: 'e.g. 34.120', half: true },
    { k: 'Bags', label: 'Bags', type: 'num', ph: 'auto MT × 20', half: true, show: v => v.Load_Type !== 'BULK' },
    { k: 'Freight_Type', label: 'Freight', type: 'seg', options: JNP.list('Freight_Payment').length ? JNP.list('Freight_Payment') : ['To Pay', 'Paid', 'To Be Billed (TBB)'], value: 'To Be Billed (TBB)' },
    { k: 'Remark', label: 'Remark' },
  ], { module: 'OPS-03' });
  F.on(k => {
    if (k === 'Qty_MT' || k === 'Load_Type') { const q = Number(F.val('Qty_MT')); F.info('Bags', q > 0 && F.val('Load_Type') === 'BAG' ? 'Auto: <b>' + Math.round(q * 20) + '</b> bags' : ''); if (q > 100) F.info('Qty_MT', '<span class="badline">Enter MT, not kg</span>'); else F.info('Qty_MT', ''); }
    if (k === 'DI_No') { const d = F.val('DI_No'); F.info('DI_No', d && !/^\d{10}$/.test(d) ? '<span class="warnline">' + d.length + ' digits — DI is 10 digits</span>' : ''); }
  });

  const q = JNP.param('lr'); if (q) { $('lr').value = q; find(); }
  $('find').addEventListener('submit', e => { e.preventDefault(); find(); });
  async function find() {
    $('findErr').classList.add('hidden'); $('lrCard').classList.add('hidden'); $('doneCard').classList.add('hidden');
    const lr = $('lr').value.replace(/\s+/g, '').toUpperCase(); if (!lr) return;
    JNP.busy(true);
    try {
      const out = await JNP.call('lookupLR', { lr: lr });
      loader = out.loader;
      if (out.builty) return showDone(Object.assign({}, out.loader, out.builty), true);
      $('lrTitle').textContent = 'LR ' + loader.LR_No;
      $('lrKV').innerHTML = [['Date', JNP.dmy(loader.Trip_Date)], ['Truck', loader.Truck_No], ['Driver', loader.Driver_Name + (loader.Driver_Mobile ? ' · ' + loader.Driver_Mobile : '')], ['Destination', loader.Destination]]
        .map(r => '<span>' + r[0] + '</span><b>' + JNP.esc(r[1]) + '</b>').join('');
      F.reset(); clientReqId = JNP.uid();
      $('lrCard').classList.remove('hidden'); if (ctx.can('E')) F.input('DI_No').focus(); else $('f').classList.add('hidden');
    } catch (e) { $('findErr').textContent = e.message; $('findErr').classList.remove('hidden'); }
    finally { JNP.busy(false); }
  }

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      if (!/^\d{10}$/.test(F.val('DI_No'))) throw new Error('DI number must be 10 digits');
      const out = await JNP.call('save', { module: 'OPS-03', clientReqId: clientReqId, data: Object.assign({ LR_No: loader.LR_No }, F.values()) });
      showDone(Object.assign({}, loader, out.record), false); loadPending();
    });
  });

  function showDone(r, existing) {
    $('lrCard').classList.add('hidden');
    const st = JNP.M().settings;
    const msg = JNP.waText('BUILTY · ' + r.LR_No, [['Date', JNP.dmy(r.Trip_Date)], ['Truck', r.Truck_No], ['Driver', r.Driver_Name + (r.Driver_Mobile ? ' (' + r.Driver_Mobile + ')' : '')],
      ['DI', r.DI_No], ['Invoice', r.Invoice_No], ['Party', r.Consignee], ['Destination', r.Destination], ['Grade', r.Grade],
      ['Qty', r.Qty_MT + ' MT' + (r.Bags && r.Bags !== 'Loose' ? ' · ' + r.Bags + ' bags' : r.Bags === 'Loose' ? ' · Bulk' : '')], ['Freight', r.Freight_Type]]);
    JNP.done($('doneCard'), { title: existing ? 'BUILTY ALREADY MADE' : 'BUILTY SAVED', big: r.LR_No, sub: r.Truck_No + ' · ' + r.Consignee + ' · ' + r.Qty_MT + ' MT',
      buttons: [
        { label: '🧾 Share Builty PDF', cls: 'orange', onClick: async () => { JNP.busy(true, 'Making PDF…'); try { await JNPBuilty.share(r, st); } catch (e) { JNP.toast(e.message, 'bad'); } finally { JNP.busy(false); } } },
        { label: '📲 Share details on WhatsApp', onClick: () => JNP.whatsapp(msg, r.Driver_Mobile) },
        { label: '👁 View PDF', cls: 'light', onClick: async () => { const b = await JNPBuilty.make(r, st); window.open(URL.createObjectURL(b), '_blank'); } },
      ],
      onNew: () => { $('doneCard').classList.add('hidden'); $('lr').value = ''; $('lr').focus(); window.scrollTo(0, 0); } });
  }

  async function loadPending() {
    try {
      const [L, B] = await Promise.all([JNP.call('list', { module: 'OPS-01', days: 4, limit: 60 }), JNP.call('list', { module: 'OPS-03', days: 6, limit: 200 })]);
      const done = {}; B.rows.forEach(b => done[b.LR_No] = 1);
      const rows = L.rows.filter(r => !done[r.LR_No]);
      $('pending').innerHTML = JNP.rowsHtml(rows, r => ({ t: JNP.esc(r.LR_No + ' · ' + r.Truck_No), s: JNP.esc(r.Destination + ' · ' + r.Driver_Name + ' · ' + JNP.dmy(r.Created_At)), tag: 'Make', cls: 'warn', click: 1 }), 'All loaded trucks have a builty.');
      $('pending').onclick = e => { const it = e.target.closest('.item'); if (!it) return; $('lr').value = rows[Number(it.dataset.i)].LR_No; find(); window.scrollTo(0, 0); };
    } catch (e) { $('pending').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  $('reload').onclick = loadPending; loadPending();
})();
</script>
</body>
</html>
