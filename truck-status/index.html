<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Truck Status · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 12px; font-weight: 700; font-size: 13px; color: var(--char); cursor: pointer; }
    .chips button b { margin-left: 4px; } .chips button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
    .alert { border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
    .alert.red { background: var(--bad-bg); color: var(--red); } .alert.purple { background: #F3E8FF; color: #7E22CE; }
    .srch { position: relative; margin-top: 10px; } .srch input { padding-left: 40px; } .srch i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-style: normal; }
    .lane { margin-top: 18px; } .lane h3 { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; font-size: 14.5px; margin: 0 0 4px; color: var(--c); }
    .lane h3 .n { margin-left: auto; color: #fff; background: var(--c); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; white-space: nowrap; }
    .lane h3 small { width: 100%; color: var(--muted); font-weight: 600; font-size: 12px; }
    .tr { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px; margin-top: 8px; border-left: 5px solid var(--c); }
    .tr .top { display: flex; align-items: baseline; gap: 6px; } .tr .top b { font-size: 17px; color: var(--navy); letter-spacing: .3px; cursor: pointer; }
    .tr .top small { color: var(--muted); font-weight: 700; font-size: 12px; } .tr .top .age { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .tr .top .age.late { color: var(--red); }
    .tr select { width: 100%; margin-top: 7px; border: 1.5px solid var(--c); border-radius: 10px; padding: 9px 10px; font-weight: 700; font-size: 14px; color: var(--c); background: #fff; }
    .tr .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 6px; margin-top: 6px; }
    .tr .two input { border: 1.5px solid #D7DEE8; border-radius: 9px; padding: 8px 9px; font-size: 13.5px; min-width: 0; width: 100%; }
    .tr .two input.ok { border-color: #12804A; background: #F2FBF5; }
    .tr .msg { font-size: 12.5px; margin-top: 5px; } .tr .msg a { font-weight: 800; }
    .tr .acts { display: flex; gap: 6px; margin-top: 6px; } .tr .acts:empty { display: none; }
    .lane .grp { display: block; width: 100%; margin: 6px 0 2px; background: var(--red); color: #fff; border-color: transparent; padding: 8px; font-weight: 800; }
    .tr .acts .mini.red { background: var(--red); color: #fff; border-color: transparent; }
    .warnline { background: #FFF4E5; color: #8A4B00; border-radius: 9px; padding: 8px 10px; font-size: 13px; margin: 6px 0; }
    #sheet .mini.sel { background: #022A5B; color: #fff; border-color: transparent; } #sheet .mini.red { background: #fff; color: #B91C1C; border-color: #F3C2C2; } #sheet .mini.red.sel { background: #B91C1C; color: #fff; }
    #sheet .btnrow .mini { white-space: normal; text-align: left; }
    .ro { margin-top: 6px; font-size: 13px; color: var(--char); font-weight: 600; }
    .offsum { background: #FDE8EB; border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
    .offsum table { width: 100%; border-collapse: collapse; font-size: 14px; } .offsum td { padding: 5px 2px; border-bottom: 1px solid #F6C9D0; } .offsum td:last-child { text-align: right; font-weight: 800; }
    .sheet-bg { position: fixed; inset: 0; background: rgba(2, 20, 45, .45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
    .sheet h3 { margin: 0 0 4px; color: var(--navy); } .sheet .sub { color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .tl div { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid #EEF1F5; font-size: 13.5px; } .tl div span { color: var(--muted); font-weight: 600; }
    .preview { white-space: pre-wrap; background: #F4F7FB; border-radius: 10px; padding: 10px; font-size: 12.5px; margin: 8px 0 12px; max-height: 200px; overflow: auto; }
    .foot { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 14px 0 calc(10px + env(safe-area-inset-bottom)); margin-top: 10px; }
    @media (min-width: 900px) { .lanes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 16px; align-items: start; } }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div class="chips" id="cchips"></div>
    <div class="chips" id="chips" style="padding-top:4px"></div>
    <div id="alerts"></div>
    <div class="srch"><i>🔍</i><input id="q" class="input upper" placeholder="Truck no. or last 4 · गाड़ी नंबर" autocomplete="off"></div>
    <div id="lanes" class="lanes"><div class="card muted">Loading…</div></div>
    <div id="off"></div>
    <div class="hint" id="upd" style="margin-top:10px"></div>
    <div class="foot"><button class="btn green" type="button" id="share">📷 Share status report · रिपोर्ट भेजें</button></div>
  </div>
  <div id="sheet"></div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  JNP.header($('hdr'), 'Truck Status', 'गाड़ी स्थिति', { sync: () => load(true) });
  const ctx = await JNP.requireModule(['OPS-07', 'DASH-02', 'DASH-03']);
  let DATA = null, ROWS = [], filt = JNP.param('stage') || 'All', M = null, redrawLater = false, cargoF = 'All';
  const own = t => !/MARKET|HIRE|ATTACH/i.test(t.ownership || '') && !/INACTIVE|NOC|SOLD/i.test(t.vstatus || '');
  const S = k => JNP.stageOf(k);
  const ORDER = ['WAIT_ORDER', 'WAIT_LOADER', 'LOADED', 'UNLOADING', 'UNLOAD_START', 'RETURNING'];
  // one simple dropdown: any status → any status (the app sorts out the steps in between)
  const ALL = ['WAIT_ORDER', 'WAIT_LOADER', 'LOADED', 'UNLOADING', 'UNLOAD_START', 'RETURNING', 'OFF'];
  const LABEL = { WAIT_ORDER: '🅿️ At depot – waiting for order', WAIT_LOADER: '⏳ Order given – waiting for loader', LOADED: '🚚 Loaded – to destination', UNLOADING: '📍 Reached – waiting for unloading',
    UNLOAD_START: '⬇️ Unloading started', RETURNING: '↩️ Unloaded – returning to depot', DONE: '🏠 Reached depot – waiting for order', OFF: '🔧 Off road – breakdown / no driver / accident' };
  const mtOf = a => Math.round(a.reduce((x, r) => x + (Number(r.mt) || Number(r.cap) || 0), 0));
  const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.id !== 'q'; };
  async function load(fresh) {
    try {
      if (!M || fresh) M = (await JNP.masters(!!fresh).catch(() => null)) || JNP.M();
      const snap = await JNP.boardSnapshot(false); DATA = snap.data; ROWS = snap.rows;
      if (typing()) redrawLater = true; else draw();
      $('upd').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + ' · ' + ROWS.length + ' trucks · changes save by themselves';
    } catch (e) { $('lanes').innerHTML = '<div class="card"><span class="err">' + E(e.message) + '</span></div>'; }
  }
  const escH = () => (DATA && DATA.escalateHrs) || 4;
  const late = r => !!S(r.st).esc && r.hrs >= escH() && !(r.st === 'WAIT_ORDER' && r.own === 'MARKET');
  function draw() {
    redrawLater = false;
    const cnt = {}; ROWS.forEach(r => cnt[r.st] = (cnt[r.st] || 0) + 1);
    $('cchips').innerHTML = ['All', 'BULK', 'BAG'].map(c => '<button type="button" data-c="' + c + '" class="' + (cargoF === c ? 'on' : '') + '">' + (c === 'All' ? 'Bulk + Bag' : c === 'BULK' ? '🔵 Bulk' : '🟠 Bag') + '<b>' + (c === 'All' ? ROWS.length : ROWS.filter(r => r.cargo === c).length) + '</b></button>').join('');
    $('chips').innerHTML = '<button type="button" data-f="All" class="' + (filt === 'All' ? 'on' : '') + '">All<b>' + ROWS.length + '</b></button>' +
      ORDER.concat('OFF').filter(k => cnt[k]).map(k => '<button type="button" data-f="' + k + '" class="' + (filt === k ? 'on' : '') + '">' + S(k).icon + ' ' + E(S(k).short) + '<b>' + cnt[k] + '</b></button>').join('');
    const lt = ROWS.filter(late), unset = ROWS.filter(r => r.st === 'WAIT_LOADER' && r.hrs > 24), lk = {}; lt.forEach(r => lk[r.st] = (lk[r.st] || 0) + 1);
    $('alerts').innerHTML = Object.keys(lk).map(k => '<div class="alert red" data-f="' + k + '">⚠️ ' + lk[k] + ' truck' + (lk[k] > 1 ? 's' : '') + ' ' + E(S(k).short.toLowerCase()) + ' over ' + escH() + ' h — escalate · ज़्यादा देर</div>').join('') +
      (unset.length ? '<div class="alert purple" data-f="WAIT_LOADER">❓ ' + unset.length + ' order' + (unset.length > 1 ? 's' : '') + ' older than a day still "waiting for loader" — please update · स्थिति अपडेट करें</div>' : '');
    const q = $('q').value.trim().toUpperCase().replace(/\s/g, '');
    const show = ROWS.filter(r => (filt === 'All' || r.st === filt) && (cargoF === 'All' || r.cargo === cargoF) && (!q || r.no.indexOf(q) >= 0));
    $('lanes').innerHTML = ORDER.map(k => {
      const a = show.filter(r => r.st === k).sort((x, y) => (x.cargo === y.cargo ? 0 : x.cargo === 'BULK' ? -1 : 1) || (y.hrs || 0) - (x.hrs || 0)); if (!a.length) return '';
      const L = S(k);
      const lateA = a.filter(late), kb = a.filter(r => r.cargo === 'BULK').length;
      return '<div class="lane" style="--c:' + L.c + '"><h3>' + L.icon + ' ' + E(L.en) + '<span class="n">' + a.length + ' · ' + mtOf(a) + ' MT</span><small>' + L.hi + ' · Bulk ' + kb + ' · Bag ' + (a.length - kb) + '</small></h3>' +
        (DATA.canMove && lateA.length > 1 ? '<button type="button" class="mini red grp" data-g="' + k + '">📣 Escalate all ' + lateA.length + ' (' + mtOf(lateA) + ' MT) waiting over ' + escH() + ' h</button>' : '') + a.map(rowHtml).join('') + '</div>';
    }).join('') || (filt === 'OFF' ? '' : '<div class="card muted">No trucks here.</div>');
    // off road: only a size-wise summary, at the bottom
    const off = ROWS.filter(r => r.st === 'OFF' && (!q || r.no.indexOf(q) >= 0)), sz = {};
    off.forEach(r => { const c = r.cap ? Math.round(r.cap) + ' MT' : 'Size ?'; (sz[c] = sz[c] || []).push(r); });
    $('off').innerHTML = '';
    if (off.length && (filt === 'All' || filt === 'OFF')) $('lanes').innerHTML += '<div class="lane" style="--c:#B91C1C"><h3>🔧 Off road<span class="n">' + off.length + ' · ' + mtOf(off) + ' MT</span><small>गाड़ी बंद · pick a status to put it back on road</small></h3><div class="offsum"><table>' +
      Object.keys(sz).sort((a, b) => (parseInt(b) || 0) - (parseInt(a) || 0)).map(c => '<tr><td><b>' + c + '</b></td><td>' + sz[c].length + ' truck' + (sz[c].length > 1 ? 's' : '') + '</td><td>' + mtOf(sz[c]) + ' MT</td></tr>').join('') +
      '</table><a class="mini" href="../breakdown/?tab=resolve" style="display:inline-block;margin-top:8px">🔧 Open Off-Road ›</a></div>' +
      off.filter(r => cargoF === 'All' || r.cargo === cargoF).sort((x, y) => (y.hrs || 0) - (x.hrs || 0)).map(rowHtml).join('') + '</div>';
  }
  function rowHtml(r) {
    const L = S(r.st), t = r.trip, lateNow = late(r);
    const hasTrip = !!(r.trip || r.pend);
    const opts = (r.st === 'UNSET' ? '<option value="">— choose —</option>' : '') + ALL.map(k => '<option value="' + k + '"' + (k === r.st ? ' selected' : '') + '>' + E(k === 'LOADED' && r.dest ? '🚚 Loaded – to ' + r.dest : k === 'WAIT_ORDER' && hasTrip && r.st !== 'OFF' ? LABEL.DONE : LABEL[k]) + '</option>').join('');
    const where = JNP.whereTxt(r) + (r.st === 'WAIT_LOADER' && r.hrs > 24 ? ' · old order — update' : '') + ((r.st === 'UNLOADING' || r.st === 'UNLOAD_START') && t && t.Party && JNP.keyOf(t.Party) !== JNP.keyOf(r.dest) ? ' · ' + t.Party : '');
    const age = isNaN(r.hrs) ? '' : (r.since ? 'since ' + JNP.sinceTxt(r.since) + ' · ' : '') + Math.floor(r.hrs) + ' h';
    return '<div class="tr" style="--c:' + L.c + '" data-t="' + r.no + '"><div class="top"><b data-a="open">' + E(r.no.slice(-4)) + '</b><small>' + E(r.no.slice(0, -4)) + ' · <span style="color:' + (r.cargo === 'BULK' ? '#1565D8' : '#C2610C') + ';font-weight:800">' + E(JNP.vehicleType(r)) + '</span>' + (r.own === 'MARKET' ? ' · Market' : '') + '</small><span class="age' + (lateNow ? ' late' : '') + '">' + E(age) + '</span></div>' +
      (where ? '<div class="hint" style="margin-top:2px">' + E(where) + '</div>' : '') +
      (r.st === 'WAIT_ORDER' && DATA.misClosed && DATA.misClosed[r.no] ? '<div class="warnline">⚠ Order LR ' + E(DATA.misClosed[r.no].LR_No) + ' → ' + E(DATA.misClosed[r.no].Destination || '') + ' was closed as "reached depot" before loading' + (DATA.misClosed[r.no].By ? ' (by ' + E(DATA.misClosed[r.no].By) + ')' : '') + '. If it is loaded / still to load, pick the status — it reopens.</div>' : '') +
      (DATA.canMove ? '<select data-a="st" aria-label="Status">' + opts + '</select>' +
        (r.st === 'OFF' ? '' : '<div class="two"><input data-a="loc" placeholder="📍 Place · जगह" value="' + E(r.st === 'RETURNING' || r.st === 'WAIT_ORDER' || (r.st === 'LOADED' && !/^On the way/i.test(r.place || '')) ? r.place : '') + '"><input data-a="rem" placeholder="💬 Remark · टिप्पणी" value="' + E(r.remark || '') + '"></div>') +
        '<div class="msg"></div><div class="acts">' + (lateNow ? '<button type="button" class="mini red" data-a="esc">📣 Escalate' + (Number(t && t.Escalations) ? ' (' + t.Escalations + ' done)' : '') + '</button>' : '') + '</div>'
        : '<div class="ro">' + L.icon + ' ' + E(L.en) + (r.place ? ' · ' + E(r.place) : '') + (r.remark ? ' · ' + E(r.remark) : '') + '</div>') + '</div>';
  }
  $('chips').onclick = e => { const b = e.target.closest('button'); if (!b) return; filt = b.dataset.f; draw(); };
  $('cchips').onclick = e => { const b = e.target.closest('button'); if (!b) return; cargoF = b.dataset.c; draw(); };
  $('alerts').onclick = e => { const b = e.target.closest('.alert'); if (!b) return; filt = b.dataset.f; draw(); };
  $('q').oninput = draw;
  const rowOf = el => { const card = el.closest('.tr'); return { card: card, r: card && ROWS.find(x => x.no === card.dataset.t) }; };
  const flash = (el, ok) => { el.classList.toggle('ok', ok); setTimeout(() => el.classList.remove('ok'), 1500); };
  // status: saved the moment it is picked
  $('lanes').addEventListener('change', async e => {
    const el = e.target, { card, r } = rowOf(el); if (!r) return;
    const a = el.dataset.a, msg = card.querySelector('.msg');
    if (a === 'st') {
      const to = el.value; if (!to || to === r.st) return;
      el.value = r.st; stepSheet(r, to, msg);
    } else if (a === 'loc' || a === 'rem') saveInfo(el);
  });
  // place / remark: saved automatically while typing (no button)
  const timers = new WeakMap();
  async function saveInfo(el) {
    clearTimeout(timers.get(el));
    const { card, r } = rowOf(el); if (!r) return;
    const a = el.dataset.a, v = el.value.trim(), msg = card.querySelector('.msg');
    const cur = el.dataset.saved != null ? el.dataset.saved : el.defaultValue.trim();
    if (v === cur) return;
    const p = { truck: r.no }; p[a === 'loc' ? 'location' : 'remark'] = v;
    el.dataset.saved = v; msg.innerHTML = '<span class="hint">Saving…</span>';
    try { await JNP.call('tripInfo', p); if (a === 'rem') r.remark = v; else r.place = v; flash(el, true); msg.innerHTML = '<span class="hint" style="color:#12804A">✓ Saved · सेव हो गया</span>'; setTimeout(() => { if (/Saved/.test(msg.textContent)) msg.innerHTML = ''; }, 2000); }
    catch (x) { delete el.dataset.saved; msg.innerHTML = '<span class="err">' + E(x.message) + '</span>'; }
  }
  $('lanes').addEventListener('input', e => {
    const el = e.target; if (el.dataset.a !== 'loc' && el.dataset.a !== 'rem') return;
    clearTimeout(timers.get(el)); timers.set(el, setTimeout(() => saveInfo(el), 1500));
  });
  $('lanes').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });
  document.addEventListener('focusout', () => setTimeout(() => { if (redrawLater && !typing()) draw(); }, 300));
  $('lanes').addEventListener('click', e => {
    const g = e.target.closest('button.grp'); if (g) { const k = g.dataset.g; groupSheet(k, ROWS.filter(r => r.st === k && late(r) && (cargoF === 'All' || r.cargo === cargoF))); return; }
    const b = e.target.closest('[data-a]'); if (!b) return; const { r } = rowOf(b); if (!r) return;
    if (b.dataset.a === 'esc') escSheet(r); else if (b.dataset.a === 'open') detail(r);
  });

  // ---------- sheets (escalation, truck details)
  function sheet(html) { $('sheet').innerHTML = '<div class="sheet-bg" id="bg"><div class="sheet">' + html + '<button class="btn light" type="button" id="xCancel" style="margin-top:10px">Close · बंद करें</button></div></div>';
    $('bg').onclick = e => { if (e.target.id === 'bg' || e.target.id === 'xCancel') close(); }; }
  const close = () => { $('sheet').innerHTML = ''; };
  // ---------- status change: ask WHEN it happened (default now) and, for returning, WHERE the truck is now
  const localISO = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 16); };
  function stepSheet(r, to, msg) {
    if (to === 'OFF') return offRoadForm(r);
    if (r.st === 'OFF') return backOnRoadForm(r, to);
    if (to === 'WAIT_ORDER' && (r.trip || r.pend)) to = 'DONE';
    const mis = !r.trip && !r.pend && DATA && DATA.misClosed && DATA.misClosed[r.no];        // its order was closed as "reached depot" before loading
    const keepOrder = r.st === 'WAIT_LOADER' && to === 'DONE';                                  // order waiting for loader → don't lose it by mistake
    const needOrder = ['WAIT_LOADER', 'LOADED', 'UNLOADING', 'UNLOAD_START', 'RETURNING'].indexOf(to) >= 0 && !r.trip && !r.pend && !mis;
    if (needOrder) {
      sheet('<h3>' + E(r.no.slice(-4)) + ' · ' + E(LABEL[to]) + '</h3><div class="sub">This truck has no order yet. Make the <b>Loader entry</b> (LR) first — the truck then moves by itself, and you can set the status after that.</div>' +
        '<a class="btn orange" href="../loader/?truck=' + encodeURIComponent(r.no) + '">📝 Loader entry · लोडर एंट्री</a>');
      return;
    }
    const needLoc = to === 'RETURNING', now = new Date();
    const lrNow = ((r.trip || r.pend || {}).LR_No) || '';
    sheet('<h3>' + E(r.no.slice(-4)) + ' · ' + E(LABEL[to]) + '</h3><div class="sub">' + E(JNP.vehicleType(r)) + (r.dest ? ' · ' + E(r.dest) : '') + '</div>' +
      (mis ? '<div class="warnline">This reopens order <b>LR ' + E(mis.LR_No) + '</b> → ' + E(mis.Destination || '') + ' (it was closed as "reached depot" before loading). No new Loader entry needed.</div>' : '') +
      (keepOrder ? '<div class="warnline">This truck has order <b>LR ' + E(lrNow) + '</b> waiting for loader. What happened?</div>' +
        '<div class="btnrow" style="margin:6px 0 10px"><button type="button" class="mini sel" data-k="keep">🏠 Reached depot before this order — keep LR ' + E(lrNow) + '</button><button type="button" class="mini red" data-k="cancel">✕ Cancel order LR ' + E(lrNow) + '</button></div>' : '') +
      '<div class="field"><label class="req">When? · कब</label><input id="sWhen" class="input" type="datetime-local" value="' + localISO(now) + '" max="' + localISO(now) + '"></div>' +
      '<div class="btnrow" style="margin:-4px 0 10px">' + [0, 1, 2, 4].map(h => '<button type="button" class="mini" data-h="' + h + '">' + (h ? h + ' h ago' : 'Now') + '</button>').join('') + '</div>' +
      (needLoc || to === 'DONE' || to === 'LOADED' ? '<div class="field"><label class="' + (needLoc ? 'req' : '') + '">' + (needLoc || to === 'LOADED' ? 'Where is the truck now? · अभी कहाँ है' : 'Place') + '</label><input id="sLoc" class="input upper" placeholder="' + (needLoc ? 'e.g. Songir toll, Malegaon bypass' : to === 'LOADED' ? 'Type like a remark — e.g. waiting at depot, at plant. Blank = on the way' : 'Depot') + '" value="' + E(to === 'DONE' ? 'Depot' : '') + '">' +
        '</div>' : '') +
      '<div id="sErr" class="err hidden"></div><button class="btn green" type="button" id="sGo">✓ Save · सेव करें</button>');
    let cancelOrder = false;
    $('sheet').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { cancelOrder = b.dataset.k === 'cancel'; $('sheet').querySelectorAll('[data-k]').forEach(x => x.classList.toggle('sel', x === b)); });
    $('sheet').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { $('sWhen').value = localISO(new Date(Date.now() - Number(b.dataset.h) * 36e5)); });
    $('sGo').onclick = () => JNP.submit($('sGo'), $('sErr'), async () => {
      const at = $('sWhen').value ? new Date($('sWhen').value) : new Date(), loc = $('sLoc') ? $('sLoc').value.trim() : '';
      if (needLoc && loc.length < 3) throw new Error('Write where the truck is now · गाड़ी अभी कहाँ है');
      if (at > new Date(Date.now() + 6e4)) throw new Error('Time cannot be in the future');
      const out = await JNP.call('tripSet', { truck: r.no, to: to === 'DONE' ? 'WAIT_ORDER' : to, lr: r.pend ? r.pend.LR_No : '', at: at.toISOString(), location: loc, cancelOrder: cancelOrder });
      close(); msg.innerHTML = '<span class="okline">✓ Saved · ' + E(out && out.kept ? 'depot time saved · LR ' + out.kept + ' still waiting for loader' : out && out.reopened ? LABEL[to] + ' · LR ' + out.reopened + ' reopened' : LABEL[to]) + '</span>'; setTimeout(() => load(), 500);
    }).then(() => { const er = $('sErr'); if (er && !er.classList.contains('hidden') && /Loader entry|लोडर/.test(er.textContent)) er.innerHTML += ' <a href="../loader/?truck=' + encodeURIComponent(r.no) + '">📝 Loader entry ›</a>'; });
  }
  // ---------- off road from the board: the full Off-Road form opens on top of the board, truck filled in
  function overlay(src, title) {
    const o = document.createElement('div'); o.id = 'ovl';
    o.style.cssText = 'position:fixed;inset:0;z-index:90;background:#fff;display:flex;flex-direction:column';
    o.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #E3E8EF;background:#F7F9FC"><button type="button" class="mini" id="ovlX">✕ Close</button><b style="color:#022A5B">' + E(title) + '</b></div>' +
      '<iframe src="' + src + '" style="flex:1;border:0;width:100%"></iframe>';
    document.body.appendChild(o);
    let saved = false;
    const shut = () => { window.removeEventListener('message', onMsg); o.remove(); if (saved) load(); };
    const onMsg = e => { if (!e.data || !e.data.jnp) return; if (e.data.jnp === 'saved') saved = true; if (e.data.jnp === 'close') shut(); };
    window.addEventListener('message', onMsg); $('ovlX').onclick = shut;
  }
  function offRoadForm(r) {
    const t = r.trip || {}, loaded = ['LOADED', 'UNLOADING', 'UNLOAD_START'].indexOf(r.st) >= 0;
    overlay('../breakdown/?tab=report&embed=1&truck=' + encodeURIComponent(r.no) + '&loaded=' + (loaded ? 'Yes' : 'No') + (loaded && t.LR_No ? '&lr=' + encodeURIComponent(t.LR_No) : '') +
      '&loc=' + encodeURIComponent(r.st === 'WAIT_ORDER' ? (r.place || 'Depot') : (r.place || r.dest || '')), r.no.slice(-4) + ' · Off road · गाड़ी बंद');
  }
  function backOnRoadForm(r, to) {
    if (!r.off || !r.off.Record_ID) return JNP.toast('Open the Off-Road screen to put it back on road', 'warn');
    JNP.toast('First mark ' + r.no.slice(-4) + ' back on road — then set "' + (LABEL[to] || to) + '"', 'warn', 6000);
    overlay('../breakdown/?tab=resolve&embed=1&id=' + encodeURIComponent(r.off.Record_ID), r.no.slice(-4) + ' · Back on road · गाड़ी चालू');
  }
  // ---------- escalation messages (after Settings › Escalate_Hrs, default 4 h)
  const veh = r => (r.cap ? Math.round(r.cap) + 'T ' : '') + (r.cargo === 'BULK' ? 'bulker' : 'bag truck') + ' (' + r.no + ')';
  const CTX = { order: ['waiting for order', 'help us get an order'], loader: ['waiting for loading at the plant', 'help us get it loaded'], unload: ['waiting for unloading', 'help us get it unloaded'] };
  function escText(r) {
    const k = S(r.st).esc, c = CTX[k], h = Math.floor(r.hrs), t = r.trip || r.pend || {};
    const extra = k === 'loader' && t.LR_No ? ' (LR ' + t.LR_No + (r.dest ? ', ' + r.dest : '') + ')' : k === 'unload' ? ' at ' + (r.dest || '') + (t.Party && JNP.keyOf(t.Party) !== JNP.keyOf(r.dest) ? ' (' + t.Party + ')' : '') : '';
    return 'Dear Sir,\n\nOur ' + veh(r) + ' is ' + c[0] + extra + ' for the last ' + h + ' hours. Requesting your support to please ' + c[1] + '.\n\nRegards,\nJNP Cargo Movers';
  }
  function groupText(k, a) {
    const c = CTX[S(k).esc], mt = mtOf(a), minH = Math.floor(Math.min.apply(null, a.map(r => r.hrs))), g = {};
    a.forEach(r => { const key = (r.cap ? Math.round(r.cap) + 'T ' : '') + (r.cargo === 'BULK' ? 'bulker' : 'bag'); (g[key] = g[key] || []).push(r.no.slice(-4)); });
    return 'Dear Sir,\n\nWe are holding ' + mt + ' MT of capacity ' + c[0] + ' for the last ' + minH + '+ hours:\n' +
      Object.keys(g).sort((p, q) => parseInt(q) - parseInt(p)).map(key => '• ' + key + ' × ' + g[key].length + ' (' + g[key].join(', ') + ')').join('\n') +
      '\n\nRequesting your support to please ' + c[1].replace(' it ', ' them ').replace('an order', 'orders') + '.\n\nRegards,\nJNP Cargo Movers';
  }
  function escSheet(r) {
    const t = r.trip || {};
    sheet('<h3>📣 Escalate · ' + E(r.no.slice(-4)) + '</h3><div class="sub">' + E(S(r.st).en) + ' for ' + Math.floor(r.hrs) + ' h' + (Number(t.Escalations) ? ' · escalated ' + t.Escalations + '× before' : '') + '</div>' +
      '<div class="field"><label>Message (you can change it)</label><textarea id="eT" class="input" rows="9">' + E(escText(r)) + '</textarea></div>' +
      '<button class="btn red" type="button" id="eGo">📲 Share on WhatsApp</button>');
    $('eGo').onclick = async () => { const txt = $('eT').value; try { await JNP.call('tripEscalate', { trucks: [r.no], stage: r.st, text: txt }); } catch (e) { } JNP.whatsapp(txt); close(); load(); };
  }
  function groupSheet(k, a) {
    if (!a.length) return;
    sheet('<h3>📣 Escalate ' + a.length + ' trucks · ' + E(S(k).short) + '</h3><div class="sub">' + mtOf(a) + ' MT waiting over ' + escH() + ' h</div>' +
      '<div class="field"><label>Message (you can change it)</label><textarea id="eT" class="input" rows="11">' + E(groupText(k, a)) + '</textarea></div>' +
      '<button class="btn red" type="button" id="eGo">📲 Share on WhatsApp</button>');
    $('eGo').onclick = async () => { const txt = $('eT').value; try { await JNP.call('tripEscalate', { trucks: a.map(r => r.no), stage: k, text: txt }); } catch (e) { } JNP.whatsapp(txt); close(); load(); };
  }
  function detail(r) {
    const t = r.trip, L = S(r.st), drv = t ? t.Driver_Name : r.pend ? r.pend.Driver_Name : '', mob = t ? t.Driver_Mobile : r.pend ? r.pend.Driver_Mobile : '';
    const rowT = (k, v, h) => '<div><span>' + k + '</span><b>' + (v ? E(JNP.dmy(String(v).slice(0, 16))) + (h !== '' && h !== undefined && h !== null ? ' · ' + h + ' h' : '') : '—') + '</b></div>';
    sheet('<h3>' + L.icon + ' ' + E(r.no) + (r.cap ? ' · ' + r.cap + 'T' : '') + '</h3><div class="sub">' + E(L.en) + (isNaN(r.hrs) ? '' : ' · since ' + JNP.ago(r.hrs)) + '</div>' +
      (t ? '<div class="kv"><span>LR</span><b>' + E(t.LR_No) + '</b><span>Destination</span><b>' + E(t.Destination) + '</b>' + (t.Party ? '<span>Party</span><b>' + E(t.Party) + '</b>' : '') + '<span>Driver</span><b>' + E(drv || '—') + '</b></div>' +
        '<div class="tl">' + rowT('Order · ऑर्डर', t.Order_At) + rowT('Loaded · लोड', t.Loaded_At, t.Wait_Loader_Hrs) + rowT('Reached · पहुँचा', t.Reached_At, t.Travel_Hrs) + rowT('Unloading started · उतराई', t.Unload_Start_At, t.Wait_Unload_Hrs) + rowT('Unloaded · खाली', t.Unloaded_At, t.Unload_Hrs) + '</div>' +
        (t.Skipped_Steps ? '<div class="warnline">Skipped: ' + E(t.Skipped_Steps) + '</div>' : '') : '<div class="kv"><span>Place</span><b>' + E(r.place || '—') + '</b></div>') +
      (mob ? '<a class="btn light" style="margin-top:12px" href="tel:' + E(mob) + '">📞 Call driver ' + E(drv || '') + '</a>' : '') +
      (r.st === 'WAIT_ORDER' && DATA.canMove ? '<a class="btn light" style="margin-top:10px" href="../loader/?truck=' + encodeURIComponent(r.no) + '">📝 New order · Loader entry</a>' : ''));
  }
  $('share').onclick = () => JNP.shareStatusImage(ROWS.filter(r => (filt === 'All' || r.st === filt) && (cargoF === 'All' || r.cargo === cargoF)), { title: 'Truck status' + (cargoF === 'All' ? '' : cargoF === 'BULK' ? ' · Bulk' : ' · Bag'), escHrs: DATA && DATA.escalateHrs });
  await load();
  setInterval(() => { if (document.visibilityState === 'visible' && !$('sheet').innerHTML && !typing()) load(); }, 120000);
})();
</script>
</body>
</html>
