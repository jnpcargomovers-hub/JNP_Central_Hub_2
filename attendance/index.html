<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Attendance · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div class="card">
      <h3 class="cardh"><span>Attendance · हाज़िरी</span><span class="pill" id="stPill"></span></h3>
      <div class="cam" id="cam"><video id="video" playsinline autoplay muted></video><img id="shot" class="shot hidden" alt=""></div>
      <div class="btnrow" style="margin-bottom:10px">
        <button class="btn light" id="camBtn" type="button">📷 Open camera</button>
        <button class="btn light hidden" id="snapBtn" type="button">📸 Take selfie</button>
        <label class="btn light hidden" id="fileBtn">📷 Selfie<input type="file" accept="image/*" capture="user" hidden id="file"></label>
      </div>
      <div id="loc" class="hint" style="margin-bottom:10px">📍 Location will be taken when you punch.</div>
      <div id="err" class="err hidden"></div>
      <button class="btn green" id="punchBtn" type="button">Punch IN</button>
    </div>
    <div id="doneCard" class="card hidden"></div>
    <div class="card list"><h3 class="cardh"><span id="lt">My last 7 days</span><span class="seg small hidden" id="who"><button type="button" data-v="me" class="on">Me</button><button type="button" data-v="all">Everyone</button></span></h3><div id="rows" class="muted">Loading…</div></div>
    <div class="card hidden" id="regCard">
      <h3 class="cardh"><span>📅 Register · नाम × तारीख</span><span class="seg small" id="regG"><button type="button" data-g="Staff" class="on">Staff</button><button type="button" data-g="Driver">Drivers</button></span></h3>
      <div class="row2"><div class="field"><label>Month</label><input id="regM" class="input" type="month"></div><div class="field"><label>&nbsp;</label><button class="btn light" id="regGo" type="button">Show</button></div></div>
      <div class="hint" id="regHint"></div>
      <div id="reg" style="overflow-x:auto;margin-top:8px"></div>
    </div>
  </div>
  <style>
    .rg { border-collapse: collapse; font-size: 12px; } .rg th, .rg td { border: 1px solid #E3E8EF; padding: 3px 4px; text-align: center; white-space: nowrap; }
    .rg th { background: #F3F6FB; font-size: 10.5px; color: #5D6877; } .rg td.nm { text-align: left; font-weight: 700; position: sticky; left: 0; background: #fff; z-index: 1; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
    .rg td.P { background: #E6F6EC; color: #12804A; font-weight: 800; } .rg td.A { background: #FDE8EB; color: #B91C1C; font-weight: 800; } .rg td.Lt { background: #FFF1E3; color: #C2610C; font-weight: 800; } .rg td[data-d] { cursor: pointer; } .rg td.o { background: #FFF5E6; color: #B45309; font-weight: 800; }
    .rg th.sun { color: #B91C1C; }
  </style>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  JNP.header($('hdr'), 'Attendance', 'हाज़िरी · सेल्फी + लोकेशन');
  const ctx = await JNP.requireModule('ATT-01');
  let type = 'IN', selfie = null, stream = null;
  const needSelfie = String((JNP.M().settings || {}).Attendance_Selfie || '').toLowerCase() === 'must';   // photos are optional unless Settings says Must
  function setType() {
    const c = JNP.session().counts || {}; type = c.punchedIn ? 'OUT' : 'IN';
    $('punchBtn').textContent = type === 'IN' ? '✅ Punch IN · ड्यूटी शुरू' : '🏁 Punch OUT · ड्यूटी खत्म';
    $('punchBtn').className = 'btn ' + (type === 'IN' ? 'green' : 'orange');
    $('stPill').textContent = c.punchedIn ? 'On duty' : 'Not punched in'; $('stPill').className = 'pill ' + (c.punchedIn ? 'ok' : 'warn');
  }
  setType();

  async function openCam() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 } }, audio: false });
      $('video').srcObject = stream; $('video').classList.remove('hidden'); $('shot').classList.add('hidden');
      $('camBtn').classList.add('hidden'); $('snapBtn').classList.remove('hidden'); selfie = null;
    } catch (e) { $('camBtn').classList.add('hidden'); $('fileBtn').classList.remove('hidden'); JNP.toast('Camera blocked — use the Selfie button', 'warn'); }
  }
  $('camBtn').onclick = openCam;
  $('snapBtn').onclick = () => {
    const v = $('video'), c = document.createElement('canvas'), k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight));
    c.width = v.videoWidth * k; c.height = v.videoHeight * k;
    const x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, c.width, c.height);
    selfie = c.toDataURL('image/jpeg', 0.7); $('shot').src = selfie; $('shot').classList.remove('hidden'); $('video').classList.add('hidden');
    stream && stream.getTracks().forEach(t => t.stop()); $('snapBtn').classList.add('hidden'); $('camBtn').classList.remove('hidden'); $('camBtn').textContent = '🔁 Retake';
  };
  $('file').onchange = async () => { const f = $('file').files[0]; if (!f) return; selfie = await JNP.compress(f, 900, 0.7); $('shot').src = selfie; $('shot').classList.remove('hidden'); $('video').classList.add('hidden'); };
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) openCam(); else { $('camBtn').classList.add('hidden'); $('fileBtn').classList.remove('hidden'); }

  $('punchBtn').onclick = () => JNP.submit($('punchBtn'), $('err'), async () => {
    if (needSelfie && !selfie) throw new Error('Take a selfie first');
    $('loc').textContent = '📍 Getting location…';
    const p = await JNP.geo().catch(e => { $('loc').textContent = ''; throw e; });
    $('loc').innerHTML = '<span class="okline">📍 ' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) + ' (±' + Math.round(p.acc) + ' m)</span>';
    let url = '';
    if (selfie) url = (await JNP.call('upload', { dataUrl: selfie, module: 'ATT-01', label: 'selfie_' + type })).url;
    const out = await JNP.call('punch', { type: type, lat: p.lat, lng: p.lng, acc: p.acc, selfieUrl: url });
    const r = out.record;
    await JNP.refreshMe().catch(() => { }); setType();
    const lateTxt = r.Punch_Type === 'IN' && Number(String(r.Punch_Time).slice(11, 13)) >= 12 ? ' (late — after 12 noon)' : '';
    const msg = JNP.waText('🕘 PUNCH ' + r.Punch_Type + ' · ' + r.User_Name, [['Time', String(r.Punch_Time).slice(11, 16) + ' · ' + JNP.dmy(String(r.Punch_Time).slice(0, 10)) + lateTxt], ['Place', r.Address],
      ['Location', Number(r.Latitude).toFixed(5) + ', ' + Number(r.Longitude).toFixed(5) + (r.Accuracy_m ? ' (±' + r.Accuracy_m + ' m)' : '')], ['Map', r.Map_Link], ['Selfie', r.Selfie_URL], ['Hours worked', r.Hours_Worked ? r.Hours_Worked + ' h' : '']]);
    JNP.done($('doneCard'), { title: 'PUNCH ' + r.Punch_Type + ' SAVED', big: String(r.Punch_Time).slice(11, 16), sub: (r.Address || r.Map_Link) + (r.Hours_Worked ? ' · ' + r.Hours_Worked + ' h' : ''),
      buttons: [{ label: '📲 Share location on WhatsApp · लोकेशन भेजें', onClick: () => JNP.whatsapp(msg) }, { label: '⌂ Back to Hub', cls: 'light', onClick: () => location.href = JNP.CONFIG.HUB }] });
    selfie = null; load();
  });

  let all = false;
  let canAll = false;
  function viewerUi() { $('who').classList.remove('hidden'); $('who').onclick = e => { const b = e.target.closest('button'); if (!b) return; all = b.dataset.v === 'all'; $('who').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); load(); }; }
  async function load() {
    $('lt').textContent = all ? 'Everyone · today' : 'My last 7 days'; $('rows').innerHTML = 'Loading…';
    try {
      const out = await JNP.call('attendance', all ? { all: true, from: JNP.todayISO() } : {});
      if (out.canAll && !canAll) { canAll = true; viewerUi(); startRegister(); }
      $('rows').innerHTML = JNP.rowsHtml(out.rows, r => ({ t: (all ? JNP.esc(r.User_Name) + ' · ' : '') + JNP.esc(r.Punch_Type + ' · ' + JNP.dmy(r.Punch_Time)), s: JNP.esc((r.Address || '') + (r.Latitude ? ' · ' + Number(r.Latitude).toFixed(5) + ', ' + Number(r.Longitude).toFixed(5) : '') + (r.Hours_Worked ? ' · ' + r.Hours_Worked + ' h' : '')) + (r.Map_Link ? ' · <a href="' + JNP.esc(r.Map_Link) + '" target="_blank">map</a>' : '') + (r.Selfie_URL ? ' · <a href="' + JNP.esc(r.Selfie_URL) + '" target="_blank">selfie</a>' : ''), tag: r.Punch_Type, cls: r.Punch_Type === 'IN' ? 'ok' : 'blue' }), 'No punches yet.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  load();
  // ---- register (HO): name × date P / A for the salary cycle
  function startRegister() {
    $('regCard').classList.remove('hidden');
    const now = new Date(), endM = new Date(now.getFullYear(), now.getMonth(), 1);
    $('regM').value = endM.getFullYear() + '-' + String(endM.getMonth() + 1).padStart(2, '0');
    let REG = null, grp = 'Staff';
    const draw = () => {
      if (!REG) return; const R = REG.rows.filter(r => r.group === grp);
      $('regHint').innerHTML = JNP.dmy(REG.from) + ' → ' + JNP.dmy(REG.to) + ' · ' + (grp === 'Staff' ? 'P = punched IN before 12 noon · <b>L = late</b> (after 12 noon) · A = no punch (marked after midnight) · <b>tap a day</b> for time, place, map and selfie' : 'Drivers with at least one trip this month · P = on duty (loading day + days between loadings) · A = not on duty') + ' · letters typed in JNP_Admin_DB › "' + REG.sheet + '" (LV, H, WO…) are kept.';
      $('reg').innerHTML = R.length ? '<table class="rg"><tr><th>Name</th>' + REG.days.map(d => '<th class="' + (new Date(d + 'T12:00:00').getDay() === 0 ? 'sun' : '') + '">' + d.slice(8) + '</th>').join('') + '<th>P</th><th>L</th><th>A</th></tr>' +
        R.map(r => '<tr><td class="nm" title="' + JNP.esc(r.role) + '">' + JNP.esc(r.name) + '</td>' + r.cells.map((c, j) => '<td data-m="' + JNP.esc(r.mobile) + '" data-d="' + REG.days[j] + '" class="' + (c === 'P' ? 'P' : c === 'A' ? 'A' : c === 'L' ? 'Lt' : c ? 'o' : '') + '">' + JNP.esc(c) + '</td>').join('') + '<td><b>' + r.p + '</b></td><td>' + (r.l || 0) + '</td><td>' + r.a + '</td></tr>').join('') + '</table><div id="regDet"></div>' : '<span class="muted">Nobody here.</span>';
    };
    $('regG').onclick = e => { const b = e.target.closest('button'); if (!b) return; grp = b.dataset.g; $('regG').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
    const loadReg = async () => { $('reg').innerHTML = 'Loading…'; try { REG = await JNP.call('attRegister', { cycle: $('regM').value }); draw(); } catch (e) { $('reg').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; } };
    $('reg').onclick = e => {
      const td = e.target.closest('td[data-d]'); if (!td || !REG) return;
      const o = (REG.detail || {})[td.dataset.m + '|' + td.dataset.d], E = JNP.esc;
      $('regDet').innerHTML = '<div class="card" style="margin-top:8px;background:#F7F9FC">' + (o ? '<b>' + E(o.name) + ' · ' + JNP.dmy(o.date) + '</b>' +
        '<div class="kv" style="margin-top:6px"><span>IN</span><b>' + E(o.inAt || '—') + (o.inAt && o.inAt >= '12:00' ? ' (late)' : '') + '</b><span>OUT</span><b>' + E(o.outAt || '—') + (o.hours ? ' · ' + E(o.hours) + ' h' : '') + '</b>' +
        '<span>Place</span><b>' + E(o.addr || '—') + '</b><span>Location</span><b>' + (o.lat ? Number(o.lat).toFixed(5) + ', ' + Number(o.lng).toFixed(5) + (o.acc ? ' (±' + E(o.acc) + ' m)' : '') : '—') + '</b></div>' +
        '<div style="display:flex;gap:8px;margin-top:8px">' + (o.map ? '<a class="mini" target="_blank" href="' + E(o.map) + '">📍 Map</a>' : '') + (o.selfie ? '<a class="mini" target="_blank" href="' + E(o.selfie) + '">🤳 Selfie</a>' : '') + '</div>'
        : '<span class="muted">No punch on ' + JNP.dmy(td.dataset.d) + '.</span>') + '</div>';
      $('regDet').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    $('regGo').onclick = loadReg; loadReg();
  }
})();
</script>
</body>
</html>
