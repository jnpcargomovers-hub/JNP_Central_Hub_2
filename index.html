<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2A5B">
  <title>JNP Central Hub</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="jnp.css">
  <script src="jnp.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginView" class="wrap login hidden">
    <div class="brand"><img id="loginLogo" alt="JNP Cargo Movers"></div>
    <h1>Central Hub</h1>
    <p class="sub">JNP Cargo Movers · सेंट्रल हब</p>
    <form id="loginForm" class="card" autocomplete="on">
      <div class="field">
        <label for="mobile">Mobile Number <span class="hi">· मोबाइल नंबर</span></label>
        <input id="mobile" class="input" type="tel" inputmode="numeric" maxlength="14" placeholder="10-digit mobile" required autocomplete="tel">
      </div>
      <div class="field">
        <label for="code">Entry Code <span class="hi">· एंट्री कोड</span></label>
        <input id="code" class="input" type="password" inputmode="numeric" maxlength="12" placeholder="Code given by HO" required autocomplete="current-password">
      </div>
      <div id="loginErr" class="err hidden"></div>
      <button id="loginBtn" class="btn" type="submit">Login · लॉगिन</button>
      <p class="hint center" style="margin-top:12px">You stay logged in on this phone for 30 days.</p>
    </form>
    <p class="footnote">Forgot your code? Ask HO.</p>
  </div>

  <!-- HOME -->
  <div id="homeView" class="hidden">
    <div id="hdr"></div>
    <div class="wrap">
      <div class="userstrip">
        <div class="who"><b id="uName"></b><span id="uRole"></span></div>
        <button class="icon-btn" id="logoutBtn" type="button">Logout</button>
      </div>
      <div id="sections"></div>
      <p class="footnote" id="foot"></p>
    </div>
  </div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const roleNames = { Loader: 'Loader', Ops_Head: 'Operations Head', 'R&M_Head': 'R&M Head', Fin_Head: 'Finance Head', CEO: 'CEO', Dir_1: 'Director', Dir_2: 'Director', Office: 'Head Office' };

  function showLogin() {
    $('homeView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('loginLogo').src = JNP.CONFIG.LOGO;
    setTimeout(() => $('mobile').focus(), 50);
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('loginErr').classList.add('hidden');
    const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const out = await JNP.login($('mobile').value, $('code').value);
      if (!out.ok) throw new Error(out.error);
      const next = new URLSearchParams(location.search).get('next');
      if (next && next.indexOf('https://jnpcargomovers-hub.github.io/') === 0) { location.href = next; return; }
      showHome();
    } catch (err) {
      $('loginErr').textContent = err.message; $('loginErr').classList.remove('hidden');
    } finally { btn.disabled = false; btn.textContent = 'Login · लॉगिन'; }
  });

  function rightsTag(r) {
    if (r.indexOf('E') >= 0 && r.indexOf('A') >= 0) return '<span class="pill ok">Entry + Approve</span>';
    if (r.indexOf('A') >= 0) return '<span class="pill ok">Approve</span>';
    if (r.indexOf('P') >= 0 && r.indexOf('E') < 0) return '<span class="pill warn">View + Pay</span>';
    if (r.indexOf('E') >= 0) return '';
    return '<span class="pill">View only</span>';
  }

  function render() {
    const s = JNP.session();
    $('uName').textContent = s.user.name;
    $('uRole').textContent = (roleNames[s.user.role] || s.user.role) + ' · ' + s.user.level;
    let html = '';
    JNP.TILES.forEach(dept => {
      const codes = Object.keys(s.access).filter(c => c.indexOf(dept.prefix) === 0);
      const visible = codes.filter(c => JNP.rights(c).length);
      if (!visible.length) return;
      html += '<div class="section"><h2 style="color:' + dept.color + '"><span class="dot" style="background:' + dept.color + '"></span>' +
        JNP.esc(dept.name) + ' <small>' + dept.hindi + '</small></h2><div class="tiles">';
      visible.forEach(code => {
        const a = s.access[code], m = JNP.MODULES[code] || { icon: '▪️' }, r = JNP.rights(code);
        const href = m.ready ? JNP.CONFIG.HUB + m.path : (m.legacy || '');
        const tag = m.ready ? rightsTag(r) : (m.legacy ? '<span class="pill warn">Old app</span>' : '<span class="pill">Coming soon</span>');
        html += '<a class="tile' + (href ? '' : ' off') + '" style="--accent:' + dept.color + '" href="' + (href || '#') + '">' +
          '<span class="ic">' + m.icon + '</span><span class="en">' + JNP.esc(a.name) + '</span>' +
          '<span class="hi">' + JNP.esc(a.hindi) + '</span><span class="tag">' + tag + '</span></a>';
      });
      html += '</div></div>';
    });
    if (s.user.level === 'Level 1' || s.user.level === 'Level 2') {
      html += '<div class="section"><h2 style="color:var(--navy)"><span class="dot" style="background:var(--navy)"></span>Reports <small>रिपोर्ट</small></h2>' +
        '<div class="tiles"><a class="tile wide" style="--accent:var(--navy)" href="' + JNP.CONFIG.DASHBOARD + '"><span class="ic">📊</span>' +
        '<span><span class="en" style="display:block">Operations Dashboard</span><span class="hi">डैशबोर्ड</span></span></a></div></div>';
    }
    $('sections').innerHTML = html || '<div class="card center muted">No modules assigned to you yet. Ask HO.</div>';
    $('foot').textContent = 'JNP Cargo Movers Pvt Ltd · Central Hub';
  }

  async function showHome() {
    $('loginView').classList.add('hidden');
    $('homeView').classList.remove('hidden');
    JNP.header($('hdr'), 'JNP CARGO MOVERS', 'Central Hub · सेंट्रल हब', { home: false, who: false });
    render();
    try {                                                 // refresh rights quietly
      const me = await JNP.api('me');
      if (me.ok) { const s = JNP.session(); s.user = me.user; s.access = me.access; JNP.store.set('jnp_session', s); render(); }
    } catch (e) { JNP.toast(e.message, 'warn'); }
    JNP.masters().catch(() => { });                       // warm the dropdown cache for module screens
  }

  $('logoutBtn').onclick = () => { if (confirm('Logout from this phone?')) JNP.logout(); };

  const s = JNP.session();
  if (s && s.token) showHome(); else showLogin();
})();
</script>
</body>
</html>
