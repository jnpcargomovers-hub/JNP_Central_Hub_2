<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Manage Partners · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    h3.h { margin: 0 0 10px; font-size: 14px; color: var(--navy); } .tscroll { overflow-x: auto; }
    table.p { width: 100%; border-collapse: collapse; font-size: 12.5px; } table.p th, table.p td { border-bottom: 1px solid #EEF1F5; padding: 7px 4px; text-align: left; vertical-align: top; }
    table.p td.n, table.p th.n { text-align: right; white-space: nowrap; } table.p th { color: var(--muted); font-size: 11px; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 1px 5px; background: #FFF4E5; color: #8A4B00; }
    .mg td .mini { padding: 4px 8px; } .vchips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
    .vchips label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; background: #F3F6FB; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
    .vchips label.mk { background: #FFF4E5; } .off { opacity: .55; }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <p class="muted" style="margin:0 0 10px;font-size:13px">Truck partners log in at <b>…/partner/</b> with their own mobile + code. They are kept in DB_Master › <b>Partners</b> (not in Users), so they can never open a staff screen. Each sees only the trucks ticked here.</p>
    <!-- HO only: manage partner logins -->
    <div class="card" id="manage">
      <h3 class="h" style="display:flex;justify-content:space-between;align-items:center">Manage partners · HO only <button class="mini" id="mgNew" type="button">➕ New partner</button></h3>
      <div id="mgList" class="tscroll muted">Loading…</div>
      <form id="mgForm" class="hidden" autocomplete="off" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        <input type="hidden" id="mgId">
        <div class="field"><label class="req" for="mgName">Partner name</label><input id="mgName" class="input" placeholder="e.g. Shree Transport"></div>
        <div class="row2">
          <div class="field"><label class="req" for="mgMob">Mobile (login)</label><input id="mgMob" class="input" type="tel" inputmode="numeric" maxlength="10"></div>
          <div class="field"><label class="req" for="mgCode">Entry code</label><div style="display:flex;gap:6px"><input id="mgCode" class="input" inputmode="numeric" maxlength="8"><button type="button" class="mini" id="mgGen">New</button></div></div>
        </div>
        <div class="field"><label>Trucks (only these are visible to the partner)</label><input id="mgFind" class="input" placeholder="Search truck…" style="margin-bottom:6px"><div class="vchips" id="mgVeh"></div></div>
        <div class="row2">
          <div class="field"><label for="mgFee">Fee ₹ per MT</label><input id="mgFee" class="input" inputmode="decimal"><div class="hint" id="mgFeeHint"></div></div>
          <div class="field"><label for="mgSt">Status</label><select id="mgSt" class="input"><option>Active</option><option>Inactive</option></select></div>
        </div>
        <div class="field"><label for="mgRem">Remark</label><input id="mgRem" class="input"></div>
        <div id="mgErr" class="err hidden" style="margin-bottom:8px"></div>
        <button class="btn orange" id="mgSave" type="submit">Save partner</button>
        <button class="btn light" id="mgCancel" type="button" style="margin-top:8px">Cancel</button>
      </form>
  
    <a class="btn light" href="../partner/" style="display:block;text-align:center;text-decoration:none">🤝 Open Partner Dashboard (HO view)</a>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  JNP.header($('hdr'), 'Manage Partners', 'पार्टनर लॉगिन · HO');
  const ctx = await JNP.requireModule('PTR-01');
  if (!ctx.isL1) { $('manage').innerHTML = '<span class="muted">Only HO (Level 1) can manage partners.</span>'; return; }
  // ---------- HO: manage partner logins (Level 1 only; the server checks again)
  let MG = null, sel = new Set();
  async function loadManage() {
    try {
      MG = await JNP.call('partnerList');
      $('mgFeeHint').textContent = 'Blank = ₹' + MG.defaultFee + ' (Settings)';
      $('mgList').innerHTML = MG.partners.length ? '<table class="p mg"><tr><th>Partner</th><th>Mobile</th><th>Trucks</th><th class="n">Fee</th><th></th></tr>' +
        MG.partners.map(p => '<tr class="' + (p.status === 'Active' ? '' : 'off') + '"><td><b>' + E(p.name) + '</b>' + (p.status === 'Active' ? '' : '<br><span class="tag">Inactive</span>') + '</td><td>' + E(p.mobile) + '</td><td>' + p.vehicles.map(v => E(v.slice(-4))).join(', ') + '</td><td class="n">' + (p.fee === '' ? '₹' + MG.defaultFee : '₹' + E(p.fee)) + '</td>' +
          '<td class="n"><button type="button" class="mini" data-e="' + E(p.id) + '">Edit</button> <button type="button" class="mini" data-w="' + E(p.id) + '">📲</button></td></tr>').join('') + '</table>' : 'No partners yet.';
    } catch (e) { $('mgList').innerHTML = '<span class="err">' + E(e.message) + '</span>'; }
  }
  function vehChips() {
    const f = $('mgFind').value.replace(/\s/g, '').toUpperCase();
    $('mgVeh').innerHTML = MG.trucks.slice().sort((x, y) => (/MARKET|HIRE|ATTACH/i.test(y.own) ? 1 : 0) - (/MARKET|HIRE|ATTACH/i.test(x.own) ? 1 : 0)).filter(t => !f || t.no.includes(f) || sel.has(t.no)).map(t => { const mk = /MARKET|HIRE|ATTACH/i.test(t.own);
      return '<label class="' + (mk ? 'mk' : '') + '"><input type="checkbox" value="' + E(t.no) + '"' + (sel.has(t.no) ? ' checked' : '') + '>' + E(t.no) + (t.own ? ' <small class="muted">' + E(t.own) + '</small>' : '') + '</label>'; }).join('');
  }
  $('mgFind').oninput = vehChips;
  $('mgVeh').onchange = e => { if (e.target.type === 'checkbox') e.target.checked ? sel.add(e.target.value) : sel.delete(e.target.value); };
  const genCode = () => String(Math.floor(1000 + Math.random() * 9000)) + String(Math.floor(Math.random() * 100)).padStart(2, '0');
  $('mgGen').onclick = () => $('mgCode').value = genCode();
  function openForm(p) {
    p = p || {}; $('mgForm').classList.remove('hidden'); $('mgErr').classList.add('hidden');
    $('mgId').value = p.id || ''; $('mgName').value = p.name || ''; $('mgMob').value = p.mobile || ''; $('mgCode').value = p.code || genCode();
    $('mgFee').value = p.fee == null ? '' : p.fee; $('mgSt').value = p.status || 'Active'; $('mgRem').value = p.remark || '';
    sel = new Set(p.vehicles || []); $('mgFind').value = ''; vehChips(); $('mgName').focus();
  }
  $('mgNew').onclick = () => openForm();
  $('mgCancel').onclick = () => $('mgForm').classList.add('hidden');
  $('mgList').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const p = MG.partners.find(x => x.id === (b.dataset.e || b.dataset.w)); if (!p) return;
    if (b.dataset.e) return openForm(p);
    JNP.whatsapp('*JNP Cargo Movers — Partner Dashboard*\nअपनी गाड़ियों की ट्रिप और कमाई यहाँ देखें:\n' + JNP.CONFIG.HUB + 'partner/\nMobile: ' + p.mobile + '\nEntry code: ' + p.code + '\n(Code किसी को न बताएं)');
  };
  $('mgForm').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('mgErr'), b = $('mgSave'); er.classList.add('hidden'); b.disabled = true; b.textContent = 'Saving…';
    try {
      await JNP.call('partnerSave', { data: { id: $('mgId').value, name: $('mgName').value, mobile: $('mgMob').value, code: $('mgCode').value, vehicles: [...sel].join(', '), fee: $('mgFee').value.trim(), status: $('mgSt').value, remark: $('mgRem').value } });
      JNP.toast('Partner saved', 'ok'); $('mgForm').classList.add('hidden'); await loadManage();
    } catch (ex) { er.textContent = ex.message; er.classList.remove('hidden'); }
    finally { b.disabled = false; b.textContent = 'Save partner'; }
  });

  loadManage();
})();
</script>
</body>
</html>
