<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Reimbursement · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
  <style>
    .sumbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; } .sumbar div { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 10px 6px; text-align: center; }
    .sumbar b { display: block; font-size: 18px; color: var(--navy); } .sumbar span { font-size: 11.5px; font-weight: 700; color: var(--muted); }
    .filt { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; } .filt > div { flex: 1 1 130px; } .filt label { font-size: 12px; font-weight: 700; color: var(--muted); }
    .grp { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; } .grp td, .grp th { padding: 6px 4px; border-bottom: 1px solid #EEF1F5; text-align: left; } .grp .n { text-align: right; white-space: nowrap; }
    .dupbox { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-weight: 700; font-size: 13.5px; }
  </style>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView" class="hidden">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Claim money you paid · अपना खर्च वापस लें</span></h3>
        <div class="hint" style="margin:-4px 0 10px">Paid from your own pocket for JNP? Claim it here with the bill photo. Approval → Finance pays you.</div>
        <div id="fields"></div>
        <label class="dupbox hidden" id="dupWrap"><input type="checkbox" id="dupOk"> This is a different expense · यह अलग खर्च है</label>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Send for approval · अप्रूवल के लिए भेजें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="hidden">
      <div class="card" id="filtCard">
        <div class="filt">
          <div><label>From</label><input type="date" id="from" class="input"></div>
          <div><label>To</label><input type="date" id="to" class="input"></div>
          <div id="viewWrap" class="hidden"><label>Show</label><select id="view" class="input"><option value="all">Everyone</option><option value="mine">My claims</option></select></div>
        </div>
      </div>
      <div class="sumbar" id="sum"></div>
      <div id="groups"></div>
      <div class="card list"><div class="khead" style="display:flex;justify-content:space-between;align-items:center"><b>Claims</b><button type="button" class="mini" id="csvBtn">⬇️ Excel (CSV)</button></div><div id="rows" class="muted">Loading…</div></div>
    </div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id), E = JNP.esc;
  const CODE = 'ADM-04';
  JNP.header($('hdr'), 'Reimbursement', 'कर्मचारी खर्च वापसी');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(() => { });
  let META;
  try { META = await JNP.call('reimbMeta', {}); } catch (e) { $('newView').innerHTML = '<div class="card err">' + E(e.message) + '</div>'; $('newView').classList.remove('hidden'); return; }
  const CATS = META.cats, cat = v => CATS[v.Category] || {}, sub = v => v.Sub_Type;
  const isTravel = v => v.Category === 'Admin' && sub(v) === 'Travel', isStay = v => v.Category === 'Admin' && sub(v) === 'Accommodation';
  const isChallan = v => v.Category === 'Documentation' && sub(v) === 'Challan', isDrvAdv = v => sub(v) === 'Driver advance paid';
  let clientReqId = JNP.uid(), F = null;
  F = JNP.form($('fields'), [
    { k: 'Category', label: 'Type of expense', hi: 'खर्च का प्रकार', type: 'seg', req: true, options: Object.keys(CATS).map(c => ({ v: c, t: c })) },
    { k: 'Sub_Type', label: 'For what?', hi: 'किस लिए', type: 'select', req: true, options: () => ((CATS[F && F.val ? F.val('Category') : ''] || {}).subs || []).map(s => ({ v: s, t: s })), show: v => !!v.Category },
    { k: 'Expense_Date', label: 'Date of expense', hi: 'तारीख', type: 'date', value: JNP.todayISO(), half: true, req: true },
    { k: 'Amount', label: 'Amount (₹)', hi: 'रकम', type: 'num', req: true, half: true },
    { k: 'Truck_No', label: 'Truck', hi: 'गाड़ी', type: 'truck', allowNew: false, show: v => !!v.Category && cat(v).truck !== 'no', req: v => cat(v).truck === 'must' },
    { k: 'Driver_Name', label: 'Driver', hi: 'ड्राइवर', type: 'driver', show: v => isDrvAdv(v) || (!!v.Category && cat(v).truck !== 'no'), req: v => isDrvAdv(v) },
    { k: 'From_Place', label: 'From', hi: 'कहाँ से', half: true, show: isTravel, req: isTravel },
    { k: 'To_Place', label: 'To', hi: 'कहाँ तक', half: true, show: isTravel, req: isTravel },
    { k: 'Travel_Mode', label: 'Travelled by', hi: 'किससे गए', type: 'select', options: META.modes.map(m => ({ v: m, t: m })), show: isTravel, req: isTravel, half: true },
    { k: 'KM', label: 'KM (own vehicle)', hi: 'किमी', type: 'num', half: true, show: v => isTravel(v) && /^Own/.test(v.Travel_Mode), req: v => isTravel(v) && /^Own/.test(v.Travel_Mode) },
    { k: 'From_Date', label: 'Check-in', hi: 'कब से', type: 'date', half: true, show: isStay, req: isStay },
    { k: 'To_Date', label: 'Check-out', hi: 'कब तक', type: 'date', half: true, show: isStay, req: isStay },
    { k: 'City', label: 'City / place of stay', hi: 'शहर', show: isStay, req: isStay },
    { k: 'Challan_No', label: 'Challan number', hi: 'चालान नंबर', type: 'upper', show: isChallan, req: isChallan },
    { k: 'Vendor', label: 'Paid to (shop / vendor / office)', hi: 'किसको दिया', show: v => !!v.Category && !isDrvAdv(v) },
    { k: 'Bill_No', label: 'Bill / receipt no.', hi: 'बिल नंबर', ph: 'optional', show: v => !!v.Category && !isDrvAdv(v) },
    { k: 'Description', label: 'Details', hi: 'विवरण', type: 'textarea', show: v => !!v.Category, req: v => sub(v) === 'Other' },
    { k: 'Bill_Photo_URL', label: 'Bill / receipt photo', hi: 'बिल की फोटो', type: 'photo', show: v => !!v.Category, req: v => Number(v.Amount) > META.billAbove },
    { k: 'Approver_Requested', label: 'Whose approval?', hi: 'किसका अप्रूवल', type: 'approver', amountKey: 'Amount', req: true },
  ], { module: CODE });
  F.on(k => {
    if (k === 'Category') { F.set('Sub_Type', ''); F.fill('Sub_Type'); F.refresh();
      const c = CATS[F.val('Category')]; F.info('Category', c ? '<span class="hint">' + E(c.hi || '') + (c.truck === 'must' ? ' · truck number needed' : c.truck === 'no' ? ' · no truck' : '') + '</span>' : ''); }
    if (k === 'Truck_No') { const t = JNP.findTruck(F.val('Truck_No')); if (t && t.driver && !F.val('Driver_Name')) F.set('Driver_Name', t.driver); }
    if (k === 'Amount' || k === 'Category') { const a = Number(F.val('Amount')) || 0; F.info('Amount', a > META.billAbove ? '<span class="hint">Bill photo needed above ' + JNP.inr(META.billAbove) + (a > META.limit ? ' · above ' + JNP.inr(META.limit) + ' only HO approves' : '') + '</span>' : ''); }
    if (k === 'From_Date' || k === 'To_Date') { const a = F.val('From_Date'), b = F.val('To_Date'); const n = a && b ? Math.round((new Date(b) - new Date(a)) / 864e5) : NaN; F.info('To_Date', !isNaN(n) ? (n < 0 ? '<span class="err">Check-out before check-in</span>' : '<span class="hint">' + Math.max(1, n) + ' night(s)</span>') : ''); }
  });
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const data = F.values(); if ($('dupOk').checked) data._dupOk = true;
      let out;
      try { out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: data }); }
      catch (er) { if (/repeat of/.test(er.message)) $('dupWrap').classList.remove('hidden'); throw er; }
      const r = out.record;
      const what = [r.Category + ' · ' + r.Sub_Type, r.Truck_No, r.From_Place ? r.From_Place + ' → ' + r.To_Place + (r.Travel_Mode ? ' (' + r.Travel_Mode + ')' : '') : '', r.Nights ? r.Nights + ' night(s) · ' + r.City : '', r.Challan_No ? 'Challan ' + r.Challan_No : '', r.Driver_Name].filter(Boolean).join(' · ');
      const msg = JNP.waText('REIMBURSEMENT · ' + JNP.inr(r.Amount), [['Claim by', r.Employee_Name], ['For', what], ['Date', JNP.dmy(r.Expense_Date)], ['Details', r.Description], ['Bill', r.Bill_Photo_URL], ['Approval by', r.Approver_Requested], ['Ref', r.Record_ID]]);
      $('f').classList.add('hidden'); $('dupWrap').classList.add('hidden'); $('dupOk').checked = false;
      JNP.done($('doneCard'), { title: 'SENT FOR APPROVAL', big: JNP.inr(r.Amount), sub: what + ' · waiting for ' + r.Approver_Requested,
        buttons: JNP.approvalButtons(out, msg),
        onNew: () => { F.reset(); clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });

  // ---------- claims list (mine; approvers / Finance / HO can see everyone, with totals)
  const today = JNP.todayISO(); $('to').value = today; $('from').value = today.slice(0, 8) + '01';
  if (META.isApprover) $('viewWrap').classList.remove('hidden');
  let LAST = [];
  async function loadList() {
    $('rows').innerHTML = 'Loading…'; $('groups').innerHTML = '';
    try {
      const o = await JNP.call('reimbList', { from: $('from').value, to: $('to').value, view: META.isApprover ? $('view').value : 'mine' }); LAST = o.rows;
      const R = o.rows, s = st => R.filter(r => st.indexOf(r.Status) >= 0), amt = a => a.reduce((t, r) => t + (Number(r.Amount) || 0), 0);
      $('sum').innerHTML = '<div><b>' + JNP.inr(amt(s(['Pending', 'On Hold']))) + '</b><span>Waiting approval · ' + s(['Pending', 'On Hold']).length + '</span></div>' +
        '<div><b>' + JNP.inr(amt(s(['Approved']))) + '</b><span>Approved, to pay · ' + s(['Approved']).length + '</span></div>' +
        '<div><b>' + JNP.inr(amt(s(['Paid']))) + '</b><span>Paid · ' + s(['Paid']).length + '</span></div>';
      if (o.all && R.length) {
        const ok = R.filter(r => r.Status !== 'Rejected'), by = k => { const m = {}; ok.forEach(r => { const x = r[k] || '—'; m[x] = (m[x] || 0) + (Number(r.Amount) || 0); }); return Object.keys(m).sort((a, b) => m[b] - m[a]).map(x => '<tr><td>' + E(x) + '</td><td class="n">' + JNP.inr(m[x]) + '</td></tr>').join(''); };
        $('groups').innerHTML = '<div class="card"><b>By type</b><table class="grp">' + by('Category') + '</table></div><div class="card"><b>By employee</b><table class="grp">' + by('Employee_Name') + '</table></div>' +
          (ok.some(r => r.Truck_No) ? '<div class="card"><b>By truck</b><table class="grp">' + by('Truck_No') + '</table></div>' : '');
      }
      $('rows').innerHTML = JNP.rowsHtml(R, r => ({ t: JNP.inr(r.Amount) + ' · ' + E(r.Category + ' · ' + r.Sub_Type),
        s: E([o.all ? r.Employee_Name : '', r.Truck_No, r.From_Place ? r.From_Place + ' → ' + r.To_Place : '', r.Nights ? r.Nights + ' night(s) ' + r.City : '', r.Challan_No ? 'Challan ' + r.Challan_No : '', r.Driver_Name,
          JNP.dmy(r.Expense_Date), r.Description, r.Approved_By ? '✓ ' + r.Approved_By : 'to ' + r.Approver_Requested, r.Approval_Remark, r.Paid_At ? 'paid ' + JNP.dmy(r.Paid_At) + ' ' + (r.Payment_Mode || '') + ' ' + (r.Payment_Ref || '') : ''].filter(Boolean).join(' · ')) +
          (r.Bill_Photo_URL ? ' · <a href="' + E(String(r.Bill_Photo_URL).split(' ')[0]) + '" target="_blank" rel="noopener">bill</a>' : ''),
        tag: r.Status, cls: JNP.statusCls(r.Status) }), 'No claims in these dates.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + E(e.message) + '</span>'; }
  }
  ['from', 'to', 'view'].forEach(id => $(id).addEventListener('change', loadList));
  $('csvBtn').onclick = () => {
    const cols = ['Record_ID', 'Expense_Date', 'Employee_Name', 'Category', 'Sub_Type', 'Amount', 'Truck_No', 'Driver_Name', 'From_Place', 'To_Place', 'Travel_Mode', 'KM', 'From_Date', 'To_Date', 'Nights', 'City', 'Challan_No', 'Vendor', 'Bill_No', 'Description', 'Status', 'Approved_By', 'Paid_At', 'Payment_Mode', 'Payment_Ref', 'Bill_Photo_URL'];
    const q = v => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
    const csv = [cols.join(',')].concat(LAST.map(r => cols.map(c => q(r[c])).join(','))).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'JNP_Reimbursements_' + $('from').value + '_to_' + $('to').value + '.csv'; a.click();
  };
  JNP.tabs($('tabs'), (ctx.can('E') ? [{ id: 'new', label: '➕ New claim' }] : []).concat([{ id: 'list', label: META.isApprover ? '📋 Claims' : '📋 My claims' }]), t => {
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t !== 'list'); if (t === 'list') loadList();
  });
})();
</script>
</body>
</html>
