<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#022A5B">
  <title>Maintenance · JNP</title>
  <link rel="icon" href="../icon.png">
  <link rel="stylesheet" href="../jnp.css">
  <script src="../jnp.js"></script>
</head>
<body>
  <div id="hdr"></div>
  <div class="wrap">
    <div id="tabs"></div>
    <div id="newView">
      <form id="f" class="card" autocomplete="off" novalidate>
        <h3 class="cardh"><span>Job card · जॉब कार्ड</span></h3>
        <div id="fields"></div>
        <div id="err" class="err hidden"></div>
        <button id="saveBtn" class="btn orange" type="submit">Save job card · सेव करें</button>
      </form>
      <div id="doneCard" class="card hidden"></div>
    </div>
    <div id="listView" class="card list hidden"><div id="rows" class="muted">Loading…</div></div>
  </div>
<script>
(async function () {
  const $ = id => document.getElementById(id);
  const CODE = 'RM-02';
  JNP.header($('hdr'), 'Maintenance Record', 'मेंटेनेंस रिकॉर्ड');
  const ctx = await JNP.requireModule(CODE);
  await JNP.masters().catch(e => JNP.toast(e.message, 'bad'));
  let clientReqId = JNP.uid(), openBd = [], lastT = '';
  const PM = JNP.M().pm || [];
  const isPM = v => /Preventive/.test(v.Record_Type);
  const F = JNP.form($('fields'), [
    { k: 'Truck_No', label: 'Truck', hi: 'गाड़ी', type: 'truck', req: true, allowNew: false },
    { k: 'Odometer_KM', label: 'Odometer KM', type: 'num', req: true, half: true },
    { k: 'Record_Type', label: 'Type', type: 'select', options: ['Preventive (PM)', 'Repair', 'Breakdown Repair', 'Accident Repair', 'Inspection'], req: true, half: true },
    { k: 'pm', type: 'html', html: '' },
    { k: 'Fault_Code', label: 'Fault', hi: 'खराबी', type: 'fault', allowNew: false, show: v => !isPM(v) },
    { k: 'Breakdown_ID', label: 'Linked breakdown', type: 'select', options: () => openBd.map(b => ({ v: b.Record_ID, t: b.Symptom + ' (' + b.Breakdown_Status + ')' })), show: () => openBd.length > 0 },
    { k: 'Work_Done', label: 'Work done', hi: 'किया गया काम', type: 'textarea', req: true },
    { k: 'Vendor', label: 'Garage / mechanic', type: 'vendor' },
    { k: 'Parts_Cost', label: 'Parts ₹', type: 'num', half: true },
    { k: 'Labour_Cost', label: 'Labour ₹', type: 'num', half: true },
    { k: 'Started_At', label: 'Started', type: 'datetime', half: true },
    { k: 'Completed_At', label: 'Completed', type: 'datetime', half: true },
    { k: 'Before_Photo_URLs', label: 'Before photos', type: 'photo', multiple: true },
    { k: 'After_Photo_URLs', label: 'After photos', type: 'photo', multiple: true },
    { k: 'Bill_Photo_URL', label: 'Bill photo', type: 'photo' },
    { k: 'Remark', label: 'Remark' },
  ], { module: CODE });
  function drawPM() {
    const v = F.all();
    F.F.pm.set(isPM(v) && PM.length ? '<div class="field"><label>PM checks done · चेक</label>' + PM.map(p => '<label style="display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:600"><input type="checkbox" class="pmc" value="' + JNP.esc(p.code) + '"> ' + JNP.esc(p.code + ' · ' + p.name) + (p.km ? ' <small class="muted">every ' + p.km + ' km</small>' : '') + '</label>').join('') + '</div>' : '');
  }
  F.on(async k => {
    if (k === 'Record_Type' || k === '_init') drawPM();
    if (k === 'Parts_Cost' || k === 'Labour_Cost') F.info('Labour_Cost', 'Total <b>' + JNP.inr((Number(F.val('Parts_Cost')) || 0) + (Number(F.val('Labour_Cost')) || 0)) + '</b>');
    if (k === 'Truck_No' && F.val('Truck_No') && F.val('Truck_No') !== lastT) {
      lastT = F.val('Truck_No'); const t = JNP.findTruck(lastT);
      F.info('Truck_No', t && t.odo ? 'Last KM <b>' + Number(t.odo).toLocaleString('en-IN') + '</b>' : '');
      try { openBd = (await JNP.call('openBreakdowns', { truck: lastT })).rows; } catch (e) { openBd = []; }
      F.fill('Breakdown_ID'); F.refresh();
    }
  });
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    JNP.submit($('saveBtn'), $('err'), async () => {
      const bad = F.check(); if (bad) throw new Error(bad);
      const v = F.values();
      v.PM_Check_Codes = [...document.querySelectorAll('.pmc:checked')].map(x => x.value).join(',');
      if (isPM(v) && PM.length && !v.PM_Check_Codes) throw new Error('Tick the PM checks done');
      ['Started_At', 'Completed_At'].forEach(k => { if (v[k]) v[k] = v[k].replace('T', ' '); });
      const out = await JNP.call('save', { module: CODE, clientReqId: clientReqId, data: v });
      const r = out.record;
      const msg = JNP.waText('🔧 JOB CARD · ' + r.Truck_No, [['Type', r.Record_Type], ['KM', r.Odometer_KM], ['Fault', r.Fault_Code], ['PM checks', r.PM_Check_Codes], ['Work', r.Work_Done],
        ['Garage', r.Vendor], ['Cost', JNP.inr(r.Total_Cost) + ' (parts ' + JNP.inr(r.Parts_Cost) + ' + labour ' + JNP.inr(r.Labour_Cost) + ')'], ['Repair time', r.Repair_TAT_Hrs ? r.Repair_TAT_Hrs + ' h' : ''],
        ['Repeat fault', r.Repeat_Flag === 'Yes' ? '⚠️ YES' : ''], ['Ref', r.Record_ID]]);
      $('f').classList.add('hidden');
      JNP.done($('doneCard'), { title: 'JOB CARD SAVED', big: r.Truck_No, sub: r.Record_Type + ' · ' + JNP.inr(r.Total_Cost) + (r.Repeat_Flag === 'Yes' ? ' · REPEAT FAULT' : ''),
        buttons: [{ label: '📲 Share on WhatsApp', onClick: () => JNP.whatsapp(msg) }],
        onNew: () => { F.reset(); openBd = []; lastT = ''; clientReqId = JNP.uid(); $('doneCard').classList.add('hidden'); $('f').classList.remove('hidden'); } });
    });
  });
  async function loadList() {
    $('rows').innerHTML = 'Loading…';
    try {
      const out = await JNP.call('list', { module: CODE, days: 60, limit: 80 });
      $('rows').innerHTML = JNP.rowsHtml(out.rows, r => ({ t: JNP.esc(r.Truck_No + ' · ' + r.Record_Type), s: JNP.esc([r.Fault_Code, r.Work_Done, JNP.inr(r.Total_Cost), r.Vendor, JNP.dmy(r.Created_At)].filter(Boolean).join(' · ')), tag: r.Repeat_Flag === 'Yes' ? 'Repeat' : '', cls: 'bad' }), 'No job cards in 60 days.');
    } catch (e) { $('rows').innerHTML = '<span class="err">' + JNP.esc(e.message) + '</span>'; }
  }
  JNP.tabs($('tabs'), (ctx.can('E') ? [{ id: 'new', label: '➕ New job card' }] : []).concat([{ id: 'list', label: '📋 History' }]), t => {
    $('newView').classList.toggle('hidden', t !== 'new'); $('listView').classList.toggle('hidden', t !== 'list'); if (t === 'list') loadList();
  });
})();
</script>
</body>
</html>
